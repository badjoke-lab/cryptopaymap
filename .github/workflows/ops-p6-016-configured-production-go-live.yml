name: OPS-P6-016 configured production go-live

on:
  pull_request:
    paths:
      - '.github/workflows/ops-p6-016-configured-production-go-live.yml'
      - 'docs/OPS_P6_016_CONFIGURED_PRODUCTION_GO_LIVE.md'
      - 'scripts/check-ops-p6-016-production-go-live-executor.mjs'
      - 'scripts/run-ops-p6-016-production-go-live-executor.mjs'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter EXECUTE_CONFIGURED_PRODUCTION_GO_LIVE exactly.
        required: true
        type: string
      approved_commit:
        description: Exact 40-character current main commit SHA.
        required: true
        type: string
      authorization_id:
        description: Exact configured-production authorizationId.
        required: true
        type: string
      execution_owner:
        description: Exact authorized production execution-owner identity.
        required: true
        type: string
      rollback_owner:
        description: Exact authorized production rollback-owner identity.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ops-p6-016-configured-production-go-live
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Check production go-live executor contract
        run: node scripts/check-ops-p6-016-production-go-live-executor.mjs

      - name: Run production go-live executor self-test
        run: node scripts/run-ops-p6-016-production-go-live-executor.mjs --self-test

  preflight:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
      AUTHORIZATION_ID: ${{ inputs.authorization_id }}
    steps:
      - name: Check out evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify exact current main
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          current_main_commit="$(git -C source rev-parse origin/main)"
          test "$current_main_commit" = "$APPROVED_COMMIT"

      - name: Recheck exact-source repository contract
        working-directory: source
        run: |
          npm run check
          node scripts/check-ops-p6-016-production-go-live-executor.mjs
          node scripts/run-ops-p6-016-production-go-live-executor.mjs --self-test

      - name: Verify exact current configured-production authorization before protected job
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const receipt = JSON.parse(readFileSync('status/config/production-authorization/authorization-receipt.json', 'utf8'));
          if (receipt?.state !== 'authorized') process.exit(1);
          if (receipt?.approvedCommit !== process.env.APPROVED_COMMIT) process.exit(1);
          if (receipt?.authorizationId !== process.env.AUTHORIZATION_ID) process.exit(1);
          if (!receipt?.expiresAt || Date.parse(receipt.expiresAt) <= Date.now()) process.exit(1);
          if (receipt?.checks?.productionMutation !== false) process.exit(1);
          NODE

      - name: Verify protected production environment exists before mutation job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const response = await fetch(`https://api.github.com/repos/${repository}/environments/production`, {
            method: 'GET',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (response.status !== 200) process.exit(1);
          const body = await response.json();
          const protections = Array.isArray(body?.protection_rules) ? body.protection_rules : [];
          if (protections.length < 1) process.exit(1);
          NODE

  execute:
    if: github.event_name == 'workflow_dispatch'
    needs: [contract, preflight]
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      AUTHORIZATION_ID: ${{ inputs.authorization_id }}
      EXECUTION_OWNER: ${{ inputs.execution_owner }}
      ROLLBACK_OWNER: ${{ inputs.rollback_owner }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID: ${{ secrets.P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID }}
    steps:
      - name: Check out exact evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify exact current main immediately before mutation
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          current_main_commit="$(git -C source rev-parse origin/main)"
          test "$current_main_commit" = "$APPROVED_COMMIT"

      - name: Recheck exact-source repository contract immediately before mutation
        id: repository_contract
        continue-on-error: true
        working-directory: source
        run: |
          npm run check
          node scripts/check-ops-p6-016-production-go-live-executor.mjs
          node scripts/run-ops-p6-016-production-go-live-executor.mjs --self-test

      - name: Verify Cloudflare execution credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID"

      - name: Execute separately authorized production cutover and rollback drill
        env:
          REPOSITORY_CONTRACT_OUTCOME: ${{ steps.repository_contract.outcome }}
        working-directory: source
        run: |
          node scripts/run-ops-p6-016-production-go-live-executor.mjs \
            ../status \
            ../production-go-live-receipt.json

      - name: Upload bounded production go-live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-016-configured-production-go-live
          path: production-go-live-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish production go-live receipt to status branch
        if: always()
        run: |
          set -euo pipefail
          test -f production-go-live-receipt.json
          mkdir -p status/config/production-authorization
          cp production-go-live-receipt.json \
            status/config/production-authorization/go-live-receipt.json
          git -C status config user.name 'github-actions[bot]'
          git -C status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C status add config/production-authorization/go-live-receipt.json
          if ! git -C status diff --cached --quiet; then
            git -C status commit -m 'Record configured production go-live execution receipt'
            git -C status push origin HEAD:staging-review
          fi

      - name: Write production go-live summary
        if: always()
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync } = require('node:fs');
          if (!existsSync('production-go-live-receipt.json')) process.exit(0);
          const receipt = JSON.parse(readFileSync('production-go-live-receipt.json', 'utf8'));
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Configured production go-live execution',
              '',
              `- State: \`${receipt.state}\``,
              `- Commit: \`${receipt.commit}\``,
              `- Apex mutation: \`${receipt.checks.apexMutation}\``,
              `- Unrelated DNS mutation: \`${receipt.checks.unrelatedDnsMutation}\``,
              `- Rollback: \`${receipt.checks.rollback.status}\``,
              `- Final external verification: \`${receipt.checks.finalExternal.status}\``,
              `- Launch closed: \`${receipt.checks.launchClosed}\``,
              `- Exceptions: ${receipt.exceptions.length === 0 ? 'none' : receipt.exceptions.map((value) => `\`${value}\``).join(', ')}`,
              '',
            ].join('\n'),
          );
          NODE

      - name: Enforce accepted go-live without launch-close claim
        if: always()
        run: |
          node -e "const r=require('./production-go-live-receipt.json'); if(r.state!=='accepted') process.exit(1)"
          node -e "const r=require('./production-go-live-receipt.json'); if(r.checks.apexMutation!==true||r.checks.unrelatedDnsMutation!==false||r.checks.stagingMutation!==false||r.checks.launchClosed!==false) process.exit(1)"

# TEMP_APEX_AUTOFIX_START
  apex-autofix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/p6-apex-canonical'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/p6-apex-canonical
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply reviewed apex hardening fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          p16 = Path('scripts/run-ops-p6-016-production-go-live-executor.mjs')
          text = p16.read_text()
          old = 'const response = await fetch(`https://${canonicalHost}/?p6_016_legacy=${Date.now()}`, {'
          new = 'const response = await fetch(`https://${redirectHost}/?p6_016_legacy=${Date.now()}`, {'
          if text.count(old) != 1:
              raise SystemExit(f'P6-016 legacy target marker count: {text.count(old)}')
          p16.write_text(text.replace(old, new))

          p17 = Path('scripts/run-ops-p6-017-production-launch-close.mjs')
          text = p17.read_text()
          old_fixture = """    apexRedirect: { status: 307, locationDigest: digest('location') },
    dns: {
      apexDigest: digest('apex'),
      canonicalAddressCount: 2,
      canonicalDigest: digest('www'),
      legacyCnamePresent: false,
    },
    tls: {
      protocol: 'TLSv1.3',
      validTo: '2026-12-01T00:00:00.000Z',
      certificateDigest: digest('cert'),
      hostnameCovered: true,
    },"""
          new_fixture = """    wwwRedirect: { status: 308, locationDigest: digest('location') },
    dns: {
      apexAddressCount: 2,
      apexDigest: digest('apex'),
      redirectAddressCount: 2,
      redirectDigest: digest('www'),
      legacyCnamePresent: false,
    },
    tls: {
      canonical: {
        protocol: 'TLSv1.3',
        validTo: '2026-12-01T00:00:00.000Z',
        certificateDigest: digest('canonical-cert'),
        hostnameCovered: true,
      },
      redirect: {
        protocol: 'TLSv1.3',
        validTo: '2026-12-01T00:00:00.000Z',
        certificateDigest: digest('redirect-cert'),
        hostnameCovered: true,
      },
    },"""
          if text.count(old_fixture) != 1:
              raise SystemExit(f'P6-017 fixture marker count: {text.count(old_fixture)}')
          text = text.replace(old_fixture, new_fixture)
          old_normalize = """      sample?.admin?.status !== 403 ||
      sample?.dns?.legacyCnamePresent !== false ||
      sample?.release?.candidateArtifactId === undefined"""
          new_normalize = """      sample?.admin?.status !== 403 ||
      sample?.wwwRedirect?.status !== 308 ||
      !Number.isInteger(sample?.dns?.apexAddressCount) ||
      sample.dns.apexAddressCount < 1 ||
      !Number.isInteger(sample?.dns?.redirectAddressCount) ||
      sample.dns.redirectAddressCount < 1 ||
      sample?.dns?.legacyCnamePresent !== false ||
      sample?.tls?.canonical?.hostnameCovered !== true ||
      sample?.tls?.redirect?.hostnameCovered !== true ||
      sample?.release?.candidateArtifactId === undefined"""
          if text.count(old_normalize) != 1:
              raise SystemExit(f'P6-017 normalize marker count: {text.count(old_normalize)}')
          p17.write_text(text.replace(old_normalize, new_normalize))

          helper = Path('.github/workflows/_tmp-p6-apex-review-fix.yml')
          if helper.exists():
              helper.unlink()

          workflow = Path('.github/workflows/ops-p6-016-configured-production-go-live.yml')
          workflow_text = workflow.read_text()
          marker = '\n# TEMP_APEX_AUTOFIX_START\n'
          if workflow_text.count(marker) != 1:
              raise SystemExit('temporary workflow marker mismatch')
          workflow.write_text(workflow_text.split(marker, 1)[0].rstrip() + '\n')
          PY

      - name: Format changed scripts
        run: npx prettier --write scripts/run-ops-p6-016-production-go-live-executor.mjs scripts/run-ops-p6-017-production-launch-close.mjs .github/workflows/ops-p6-016-configured-production-go-live.yml

      - name: Validate hardened apex topology
        run: |
          npm run format:check
          npm run check
          node scripts/materialize-production-machine-files.mjs --self-test
          node scripts/check-ops-p6-014-production-candidate-bootstrap.mjs
          node scripts/run-ops-p6-014-production-candidate-bootstrap.mjs --self-test
          node scripts/check-ops-p6-016-production-go-live-executor.mjs
          node scripts/run-ops-p6-016-production-go-live-executor.mjs --self-test
          node scripts/check-ops-p6-017-production-launch-close.mjs
          node scripts/run-ops-p6-017-production-launch-close.mjs --self-test
          git diff --check

      - name: Commit validated hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P6: harden apex cutover verification'
          git push origin HEAD:ops/p6-apex-canonical
