name: One-time P6-05 P6-06 expiry recovery patcher

on:
  push:
    branches:
      - agent/ops-p6-06-expiry-deadlock-recovery
    paths:
      - '.github/workflows/one-time-p6-05-p6-06-expiry-recovery-patcher.yml'
      - 'scripts/one-time-p6-05-p6-06-expiry-recovery-patcher.py'
      - 'scripts/one-time-p6-05-p6-06-checker-normalizer.py'
      - 'scripts/one-time-p6-05-p6-06-checker-normalizer-extra.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-06-expiry-deadlock-recovery

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply bounded expiry-deadlock recovery patch
        run: |
          python3 scripts/one-time-p6-05-p6-06-expiry-recovery-patcher.py
          python3 scripts/one-time-p6-05-p6-06-checker-normalizer.py
          python3 scripts/one-time-p6-05-p6-06-checker-normalizer-extra.py

      - name: Format changed sources
        run: npx prettier --write scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs scripts/run-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs scripts/check-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs docs/OPS_P6_001I_CONFIGURED_STAGING_P6_05_PUBLIC_EXPORT_RELEASE.md docs/OPS_P6_001R_CONFIGURED_STAGING_P6_06_CONTINUITY_REVALIDATION.md

      - name: Validate recovery contracts
        run: |
          npm run check
          node scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs
          node scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs --self-test
          node scripts/check-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs
          node scripts/run-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs --self-test

      - name: Commit recovery patch and remove one-time helpers
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-p6-05-p6-06-expiry-recovery-patcher.yml
          rm -f scripts/one-time-p6-05-p6-06-expiry-recovery-patcher.py
          rm -f scripts/one-time-p6-05-p6-06-checker-normalizer.py
          rm -f scripts/one-time-p6-05-p6-06-checker-normalizer-extra.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Recover configured staging evidence after P6-06 expiry'
          git push origin HEAD:agent/ops-p6-06-expiry-deadlock-recovery