name: Temporary OPS-P6-016 validator

on:
  push:
    branches:
      - ops-p6-016-production-go-live-executor
    paths:
      - '.github/workflows/tmp-ops-p6-016-validator.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-016-production-go-live-executor
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Harden and validate executor
        run: |
          set -euo pipefail
          python tmp-ops-p6-016-patch.py
          npx biome check --write \
            scripts/run-ops-p6-016-production-go-live-executor.mjs \
            scripts/check-ops-p6-016-production-go-live-executor.mjs
          node scripts/check-ops-p6-016-production-go-live-executor.mjs
          node scripts/run-ops-p6-016-production-go-live-executor.mjs --self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/run-ops-p6-016-production-go-live-executor.mjs \
            scripts/check-ops-p6-016-production-go-live-executor.mjs
          git commit -m 'OPS-P6-016: harden production go-live execution window'
          git push origin HEAD:ops-p6-016-production-go-live-executor
          echo 'validator rerun passed'
