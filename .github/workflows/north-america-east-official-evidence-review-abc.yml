name: North America east official Evidence review ABC

on:
  push:
    branches:
      - ops/north-america-east-official-evidence-review-abc
    paths:
      - scripts/review-north-america-east-official-evidence-abc.ts
      - .github/workflows/north-america-east-official-evidence-review-abc.yml

permissions:
  contents: read

env:
  CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Review official Evidence privately
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          review_file="${RUNNER_TEMP}/north-america-east-official-evidence-review-abc.json"
          npx tsx scripts/review-north-america-east-official-evidence-abc.ts > "$review_file"
          jq -e '.target == "fixed-review-staging" and .mutationPerformed == false and .publicDataChanged == false and .payloadExposedInLogs == false' "$review_file" >/dev/null
          {
            echo '## North America east private official Evidence review ABC'
            echo
            echo "- Evidence rows: $(jq -r '.evidenceRows' "$review_file")"
            echo "- structurally valid rows: $(jq -r '.structurallyValidRows' "$review_file")"
            echo "- live fetched rows: $(jq -r '.liveFetchedRows' "$review_file")"
            echo "- payment-context rows: $(jq -r '.paymentContextRows' "$review_file")"
            echo "- physical-signal rows: $(jq -r '.physicalSignalRows' "$review_file")"
            echo '- Candidate names/addresses/URLs/page context in public logs: 0'
            echo '- mutation performed: false'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload short-lived private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: north-america-east-official-evidence-review-abc-private
          path: ${{ runner.temp }}/north-america-east-official-evidence-review-abc.json
          retention-days: 1
          if-no-files-found: error
