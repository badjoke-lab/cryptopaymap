name: One-shot Steak n Shake publisher slug fix

on:
  push:
    branches:
      - feat/steak-n-shake-btc-growth
    paths:
      - .github/workflows/one-shot-steak-n-shake-publisher-slug-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steak-n-shake-btc-growth
      - name: Make canonical entity slug derivation bounded and deterministic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/publish-reviewed-physical-canonical-staging.ts')
          text = path.read_text()

          old_import = "import { and, asc, eq, inArray, sql } from 'drizzle-orm';\n"
          new_import = old_import + "import { createHash } from 'node:crypto';\n"
          if text.count(old_import) != 1:
              raise SystemExit('unexpected drizzle import shape')
          text = text.replace(old_import, new_import, 1)

          old_fn = """function entitySlug(locationSlug: string): string {\n  const value = `merchant-${locationSlug}`;\n  if (value.length > 64) throw new Error('Derived public entity slug exceeds the canonical limit.');\n  return value;\n}\n"""
          new_fn = """function entitySlug(locationSlug: string): string {\n  const value = `merchant-${locationSlug}`;\n  if (value.length <= 64) return value;\n  const digest = createHash('md5').update(locationSlug).digest('hex').slice(0, 12);\n  return `${value.slice(0, 51)}-${digest}`;\n}\n"""
          if text.count(old_fn) != 1:
              raise SystemExit('unexpected entitySlug function shape')
          text = text.replace(old_fn, new_fn, 1)

          old_sql = """      update ${entities} as e\n      set slug = 'merchant-' || l.slug,\n          visibility = 'public'\n      from ${locations} as l\n      where l.entity_id = e.id\n        and e.id in (${entityList})\n        and l.id in (${locationList})\n        and e.visibility in ('hidden', 'public')\n        and length('merchant-' || l.slug) <= 64\n"""
          new_sql = """      update ${entities} as e\n      set slug = case\n            when length('merchant-' || l.slug) <= 64 then 'merchant-' || l.slug\n            else left('merchant-' || l.slug, 51) || '-' || left(md5(l.slug), 12)\n          end,\n          visibility = 'public'\n      from ${locations} as l\n      where l.entity_id = e.id\n        and e.id in (${entityList})\n        and l.id in (${locationList})\n        and e.visibility in ('hidden', 'public')\n"""
          if text.count(old_sql) != 1:
              raise SystemExit('unexpected publication slug SQL shape')
          text = text.replace(old_sql, new_sql, 1)
          path.write_text(text)
          PY
      - name: Commit and push publisher slug fix
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/publish-reviewed-physical-canonical-staging.ts
          git commit -m "FIX: bound reviewed physical publication slugs"
          git push origin HEAD:feat/steak-n-shake-btc-growth
