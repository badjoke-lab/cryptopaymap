name: One-shot Chipotle official Houston physical ingestion

on:
  push:
    branches:
      - feat/physical-source-first-growth
    paths:
      - scripts/ingest-chipotle-official-houston-physical-candidates-staging.ts
      - .github/workflows/one-shot-chipotle-official-houston-ingest.yml

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Patch Houston import batch accounting for this bounded run
        run: >-
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/ingest-chipotle-official-houston-physical-candidates-staging.ts')
          s = p.read_text()
          old = 'inputCount: discovered.length, acceptedCount: fresh.length'
          new = 'inputCount: discovered.length + detailFetchFailures + addressParseFailures + geocodeFailures, acceptedCount: fresh.length'
          if old not in s:
              raise SystemExit('Houston importer count patch target changed unexpectedly')
          p.write_text(s.replace(old, new))
          PY
      - run: npm run check
      - name: Ingest bounded official Chipotle Houston physical Candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/ingest-chipotle-official-houston-physical-candidates-staging.ts
