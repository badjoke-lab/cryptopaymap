name: Crawl latest OSM official Evidence — fixed review staging

on:
  push:
    branches:
      - ops/latest-osm-evidence-crawl

concurrency:
  group: fixed-review-latest-osm-official-evidence-crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve latest bounded OSM acquisition and crawl official Evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: |
          batch_ids="$(npx tsx scripts/resolve-latest-osm-import-batches.ts)"
          batch_count="$(awk -F',' '{print NF}' <<<"$batch_ids")"
          test "$batch_count" -ge 1
          test "$batch_count" -le 20

          summary="$(
            CPM_OFFICIAL_EVIDENCE_BATCH_IDS="$batch_ids" \
            CPM_OFFICIAL_EVIDENCE_MAX_TARGETS=250 \
            npx tsx scripts/crawl-official-payment-evidence-batch.ts
          )"

          jq -e '.target == "fixed-review-staging" and .automaticConfirmedCount == 0 and .candidateStateChanged == false and .evidenceVisibility == "private" and .evidenceReviewStatus == "pending" and .payloadExposed == false' <<<"$summary" >/dev/null
          jq 'del(.batchIds)' <<<"$summary"

          {
            echo '## Latest bounded OSM official Evidence crawl'
            echo
            echo "- import batches: $batch_count"
            echo "- eligible targets before limit: $(jq -r '.eligibleTargetsBeforeLimit' <<<"$summary")"
            echo "- crawled targets: $(jq -r '.targets' <<<"$summary")"
            echo "- landing pages fetched: $(jq -r '.landingPagesFetched' <<<"$summary")"
            echo "- internal pages fetched: $(jq -r '.internalPagesFetched' <<<"$summary")"
            echo "- explicit official Evidence discovered: $(jq -r '.explicitDiscovered' <<<"$summary")"
            echo "- pending private Evidence created: $(jq -r '.pendingEvidenceCreated' <<<"$summary")"
            echo "- automatic Confirmed: $(jq -r '.automaticConfirmedCount' <<<"$summary")"
          } >> "$GITHUB_STEP_SUMMARY"
