name: Bitcoin on-chain registry staging audit

on:
  push:
    branches:
      - ops/europe-west-official-evidence-review
    paths:
      - scripts/audit-bitcoin-onchain-registry-staging.ts
      - .github/workflows/bitcoin-onchain-registry-staging-audit.yml

permissions:
  contents: read

env:
  CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit Bitcoin on-chain registry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          summary="$(npx tsx scripts/audit-bitcoin-onchain-registry-staging.ts)"
          printf '%s\n' "$summary"
          jq -e '.target == "fixed-review-staging" and .mutationPerformed == false and .publicDataChanged == false' <<<"$summary" >/dev/null
