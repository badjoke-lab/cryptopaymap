name: Ensure Bitcoin on-chain registry — fixed review staging

on:
  push:
    branches:
      - ops/europe-west-official-evidence-review
    paths:
      - scripts/ensure-bitcoin-onchain-staging-registry.ts
      - .github/workflows/ensure-bitcoin-onchain-staging-registry.yml

permissions:
  contents: read

env:
  CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging

jobs:
  ensure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Ensure Bitcoin on-chain staging registry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          summary="$(npx tsx scripts/ensure-bitcoin-onchain-staging-registry.ts)"
          printf '%s\n' "$summary"
          jq -e '.target == "fixed-review-staging" and .bitcoinAssetReady == true and .bitcoinNetworkReady == true and .onchainPaymentMethodReady == true and .publicDataChanged == false and .candidateDataExposed == false' <<<"$summary" >/dev/null
          {
            echo '## Bitcoin on-chain staging registry'
            echo
            echo "- bitcoin asset ready: $(jq -r '.bitcoinAssetReady' <<<"$summary")"
            echo "- bitcoin network ready: $(jq -r '.bitcoinNetworkReady' <<<"$summary")"
            echo "- on-chain payment method ready: $(jq -r '.onchainPaymentMethodReady' <<<"$summary")"
            echo "- network created: $(jq -r '.networkCreated' <<<"$summary")"
            echo "- payment method created: $(jq -r '.paymentMethodCreated' <<<"$summary")"
            echo '- public data changed: false'
          } >> "$GITHUB_STEP_SUMMARY"
