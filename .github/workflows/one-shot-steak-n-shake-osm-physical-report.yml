name: One-shot Steak n Shake physical Candidate report

on:
  push:
    branches:
      - feat/physical-source-first-growth
    paths:
      - scripts/report-steak-n-shake-osm-physical-candidates-staging.ts
      - .github/workflows/one-shot-steak-n-shake-osm-physical-report.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check repository
        run: npm run check
      - name: Count existing physical candidates for Steak n Shake
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/report-steak-n-shake-osm-physical-candidates-staging.ts
