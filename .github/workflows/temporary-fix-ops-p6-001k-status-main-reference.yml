name: Temporary fix OPS-P6-001K status main reference

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-fix-ops-p6-001k-status-main-reference.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/ops-p6-001k-project-status'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out status branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001k-project-status
          fetch-depth: 0

      - name: Remove self-invalidating main references
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('docs/PROJECT_STATUS.md')
          text = path.read_text()
          replacements = {
              '- PR #336 merged the scoped-zone remediation. Current main is `9e83dade38ec01ec451ad8591daac3d519d024df`.':
                  '- PR #336 merged the scoped-zone remediation at `9e83dade38ec01ec451ad8591daac3d519d024df`.',
              '- Because main changed after the last configured evidence refresh, deployment, live audit, and P6-01 through P6-05 must be refreshed on `9e83dade38ec01ec451ad8591daac3d519d024df` after the protected configuration is repaired.':
                  '- Because repository work changed main after the last configured evidence refresh, deployment, live audit, and P6-01 through P6-05 must be refreshed on the exact post-merge main after the protected configuration is repaired.',
              '3. refresh the exact-main configured staging deployment and fixed-review live audit on `9e83dade38ec01ec451ad8591daac3d519d024df`;':
                  '3. refresh the configured staging deployment and fixed-review live audit on the exact current main after this status reconciliation merges;',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one status marker: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify status references
        run: |
          grep -F 'PR #336 merged the scoped-zone remediation at `9e83dade38ec01ec451ad8591daac3d519d024df`.' docs/PROJECT_STATUS.md
          grep -F 'exact post-merge main' docs/PROJECT_STATUS.md
          grep -F 'after this status reconciliation merges' docs/PROJECT_STATUS.md

      - name: Commit status correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATUS.md
          git commit -m 'Avoid self-invalidating project status main reference'
          git push origin HEAD:agent/ops-p6-001k-project-status
