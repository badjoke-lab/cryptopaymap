name: Temporary validate cross-batch duplicate group reuse

on:
  push:
    branches:
      - fix/cross-batch-duplicate-group-reuse
    paths:
      - '.github/workflows/tmp-fix-cross-batch-duplicate-group-reuse.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch importer and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          importer = Path('src/importers/osm-overpass-candidate-acquisition.ts')
          text = importer.read_text()

          text = text.replace(
              "  candidateSourceRecords,\n  sourceCandidates,\n  sourceRecords,",
              "  candidateDuplicateGroups,\n  candidateSourceRecords,\n  sourceCandidates,\n  sourceRecords,",
              1,
          )
          text = text.replace(
              "type DuplicateAwareExistingCandidateSnapshot = ExistingCandidateSnapshot & {\n  duplicateGroupId?: string | null;\n};",
              "type DuplicateAwareExistingCandidateSnapshot = ExistingCandidateSnapshot & {\n  duplicateGroupId?: string | null;\n  duplicateGroupStatus?: 'open' | 'resolved' | 'dismissed' | null;\n};",
              1,
          )

          old_group = """    for (const memberId of members) {
              const existingCandidate = existingById.get(memberId);
              if (existingCandidate?.duplicateGroupId != null) {
                throw new CandidateIngestionPersistenceError(
                  'conflict',
                  'A cross-batch duplicate Candidate already belongs to a duplicate group; automatic group merging is not allowed.',
                );
              }
            }

            const groupId = await deterministicUuid(`candidate-duplicate-group:${members.join(':')}`);
            duplicateGroups.push({
              id: groupId,
              status: 'open',
              resolutionNote: null,
              resolvedAt: null,
            });
          """
          new_group = """    const existingGroupMembers = members
              .map((memberId) => existingById.get(memberId))
              .filter(
                (
                  candidate,
                ): candidate is DuplicateAwareExistingCandidateSnapshot & {
                  duplicateGroupId: string;
                } => candidate?.duplicateGroupId != null,
              );
            if (existingGroupMembers.some((candidate) => candidate.duplicateGroupStatus !== 'open')) {
              throw new CandidateIngestionPersistenceError(
                'conflict',
                'A cross-batch duplicate Candidate belongs to a resolved or dismissed duplicate group; automatic extension is not allowed.',
              );
            }
            const existingGroupIds = [
              ...new Set(existingGroupMembers.map((candidate) => candidate.duplicateGroupId)),
            ].sort();
            if (existingGroupIds.length > 1) {
              throw new CandidateIngestionPersistenceError(
                'conflict',
                'A cross-batch duplicate component spans multiple existing duplicate groups; automatic group merging is not allowed.',
              );
            }

            const existingGroupId = existingGroupIds[0] ?? null;
            const groupId =
              existingGroupId ??
              (await deterministicUuid(`candidate-duplicate-group:${members.join(':')}`));
            if (existingGroupId === null) {
              duplicateGroups.push({
                id: groupId,
                status: 'open',
                resolutionNote: null,
                resolvedAt: null,
              });
            }
          """
          if old_group not in text:
              raise SystemExit('duplicate group block not found')
          text = text.replace(old_group, new_group, 1)

          old_assign = """      } else {
                existingAssignments.push({
                  candidateId: memberId,
                  duplicateGroupId: groupId,
                  assignedAt,
                });
              }
          """
          new_assign = """      } else {
                const existingCandidate = existingById.get(memberId);
                if (existingCandidate?.duplicateGroupId === groupId) continue;
                existingAssignments.push({
                  candidateId: memberId,
                  duplicateGroupId: groupId,
                  assignedAt,
                });
              }
          """
          if old_assign not in text:
              raise SystemExit('existing assignment block not found')
          text = text.replace(old_assign, new_assign, 1)

          text = text.replace(
              "  duplicateGroupId: string | null;\n  normalizedName: string;",
              "  duplicateGroupId: string | null;\n  duplicateGroupStatus: 'open' | 'resolved' | 'dismissed' | null;\n  normalizedName: string;",
              1,
          )
          text = text.replace(
              "    duplicateGroupId: row.duplicateGroupId,\n    sourceId: row.sourceId,",
              "    duplicateGroupId: row.duplicateGroupId,\n    duplicateGroupStatus: row.duplicateGroupStatus,\n    sourceId: row.sourceId,",
              1,
          )
          text = text.replace(
              "            duplicateGroupId: sourceCandidates.duplicateGroupId,\n            normalizedName:",
              "            duplicateGroupId: sourceCandidates.duplicateGroupId,\n            duplicateGroupStatus: candidateDuplicateGroups.status,\n            normalizedName:",
          )
          join = ".innerJoin(sourceCandidates, eq(sourceCandidates.id, candidateSourceRecords.candidateId))"
          replacement = join + "\n          .leftJoin(\n            candidateDuplicateGroups,\n            eq(candidateDuplicateGroups.id, sourceCandidates.duplicateGroupId),\n          )"
          if text.count(join) < 3:
              raise SystemExit('expected source candidate joins not found')
          text = text.replace(join, replacement)
          importer.write_text(text)

          test = Path('tests/osm-overpass-candidate-acquisition.test.ts')
          text = test.read_text()
          text = text.replace(
              "type DuplicateAwareExistingCandidateSnapshot = ExistingCandidateSnapshot & {\n  duplicateGroupId?: string | null;\n};",
              "type DuplicateAwareExistingCandidateSnapshot = ExistingCandidateSnapshot & {\n  duplicateGroupId?: string | null;\n  duplicateGroupStatus?: 'open' | 'resolved' | 'dismissed' | null;\n};",
              1,
          )
          text = text.replace(
              "function crossBatchDuplicate(\n  duplicateGroupId: string | null = null,\n): DuplicateAwareExistingCandidateSnapshot {",
              "function crossBatchDuplicate(\n  duplicateGroupId: string | null = null,\n  duplicateGroupStatus: 'open' | 'resolved' | 'dismissed' | null =\n    duplicateGroupId === null ? null : 'open',\n): DuplicateAwareExistingCandidateSnapshot {",
              1,
          )
          text = text.replace(
              "    candidateStatus: 'new',\n    duplicateGroupId,\n  };",
              "    candidateStatus: 'new',\n    duplicateGroupId,\n    duplicateGroupStatus,\n  };",
              1,
          )

          old_test = """  it('fails closed instead of automatically merging a pre-grouped cross-batch Candidate', async () => {
              const existing = crossBatchDuplicate('00000000-0000-4000-8000-000000000203');

              await expect(
                createOsmOverpassCandidateAcquisitionPlan(
                  {
                    ...IDS,
                    requestId: '00000000-0000-4000-8000-000000000111',
                    importBatchId: '00000000-0000-4000-8000-000000000112',
                    fetchedAt: new Date('2026-08-29T03:00:00.000Z'),
                    importerVersion: '1.0.0',
                    elements: [exampleElement],
                  },
                  [existing],
                ),
              ).rejects.toThrowError(CandidateIngestionPersistenceError);
            });
          """
          new_test = """  it('reuses one existing open duplicate group without recreating or reassigning it', async () => {
              const duplicateGroupId = '00000000-0000-4000-8000-000000000203';
              const existing = crossBatchDuplicate(duplicateGroupId, 'open');
              const result = await createOsmOverpassCandidateAcquisitionPlan(
                {
                  ...IDS,
                  requestId: '00000000-0000-4000-8000-000000000111',
                  importBatchId: '00000000-0000-4000-8000-000000000112',
                  fetchedAt: new Date('2026-08-29T03:00:00.000Z'),
                  importerVersion: '1.0.0',
                  elements: [exampleElement],
                },
                [existing],
              );

              expect(result.plan.duplicateGroups).toHaveLength(0);
              expect(result.plan.existingCandidateDuplicateAssignments).toHaveLength(0);
              expect(result.plan.candidates[0]?.duplicateGroupId).toBe(duplicateGroupId);
              expect(result.plan.duplicateSignals?.[0]?.duplicateGroupId).toBe(duplicateGroupId);
              expect(result.plan.batch.duplicateSignalCount).toBe(1);
              expect(result.plan.batch.automaticConfirmedCount).toBe(0);
            });

            it('fails closed when a cross-batch component spans multiple existing duplicate groups', async () => {
              const left = crossBatchDuplicate('00000000-0000-4000-8000-000000000203', 'open');
              const right = {
                ...crossBatchDuplicate('00000000-0000-4000-8000-000000000204', 'open'),
                candidateId: '00000000-0000-4000-8000-000000000205',
                sourceId: '00000000-0000-4000-8000-000000000206',
                externalId: 'node:998',
              };

              await expect(
                createOsmOverpassCandidateAcquisitionPlan(
                  {
                    ...IDS,
                    requestId: '00000000-0000-4000-8000-000000000115',
                    importBatchId: '00000000-0000-4000-8000-000000000116',
                    fetchedAt: new Date('2026-08-29T03:15:00.000Z'),
                    importerVersion: '1.0.0',
                    elements: [exampleElement],
                  },
                  [left, right],
                ),
              ).rejects.toThrowError(CandidateIngestionPersistenceError);
            });

            it('fails closed instead of extending a resolved duplicate group', async () => {
              const existing = crossBatchDuplicate(
                '00000000-0000-4000-8000-000000000203',
                'resolved',
              );

              await expect(
                createOsmOverpassCandidateAcquisitionPlan(
                  {
                    ...IDS,
                    requestId: '00000000-0000-4000-8000-000000000117',
                    importBatchId: '00000000-0000-4000-8000-000000000118',
                    fetchedAt: new Date('2026-08-29T03:30:00.000Z'),
                    importerVersion: '1.0.0',
                    elements: [exampleElement],
                  },
                  [existing],
                ),
              ).rejects.toThrowError(CandidateIngestionPersistenceError);
            });
          """
          if old_test not in text:
              raise SystemExit('pre-grouped test block not found')
          text = text.replace(old_test, new_test, 1)
          test.write_text(text)
          PY
      - name: Format changed files
        run: npx biome format --write src/importers/osm-overpass-candidate-acquisition.ts tests/osm-overpass-candidate-acquisition.test.ts
      - name: Lint changed files
        run: npx biome lint src/importers/osm-overpass-candidate-acquisition.ts tests/osm-overpass-candidate-acquisition.test.ts
      - name: Run focused tests
        run: npx vitest run tests/osm-overpass-candidate-acquisition.test.ts
      - name: Typecheck project
        run: npm run check
      - name: Commit validated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/importers/osm-overpass-candidate-acquisition.ts tests/osm-overpass-candidate-acquisition.test.ts
          if git diff --cached --quiet; then
            echo 'No source changes.'
          else
            git commit -m 'fix: reuse one open duplicate group during acquisition'
            git push origin HEAD:fix/cross-batch-duplicate-group-reuse
          fi
