name: One-shot review all current staging evidence

on:
  push:
    branches:
      - run/staging-review-all-314
    paths:
      - .github/workflows/one-shot-review-all-314.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit --pretty false
      - name: Strict-review up to 400 candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_ADMIN_CANDIDATE_PROMOTE_SUBJECTS: ${{ secrets.CPM_ADMIN_CANDIDATE_PROMOTE_SUBJECTS }}
          CPM_ADMIN_EVIDENCE_REVIEW_SUBJECTS: ${{ secrets.CPM_ADMIN_EVIDENCE_REVIEW_SUBJECTS }}
          CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: '100'
          CPM_OFFICIAL_EVIDENCE_MAX_WINDOWS: '4'
        run: npx tsx scripts/promote-confirm-next-official-evidence-batch.ts
      - name: Publish reviewed canonical staging records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS: ${{ secrets.CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS }}
        run: npx tsx scripts/publish-reviewed-physical-canonical-staging.ts
      - name: Materialize public data from staging DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/materialize-public-data-from-staging-db.ts
      - name: Build staging site
        run: npm run build
      - name: Prepare review artifact
        run: node scripts/prepare-staging-review-artifact.mjs
      - name: Deploy staging review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name cryptopaymap-staging
          --branch review
      - name: Remove one-shot workflow
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git rm .github/workflows/one-shot-review-all-314.yml
          git commit -m "CLEANUP: remove one-shot full-review workflow"
          git push origin HEAD:run/staging-review-all-314
