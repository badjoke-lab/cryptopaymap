name: One-shot cooldown-aware staging growth after 488

on:
  push:
    branches:
      - run/staging-growth-after-488
    paths:
      - .github/workflows/one-shot-staging-growth-after-488.yml

permissions:
  contents: write

jobs:
  mark_failures:
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Crawl current residual partition and persist cooldowns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: '250'
          CPM_OFFICIAL_EVIDENCE_PARTITION_COUNT: '8'
          CPM_OFFICIAL_EVIDENCE_PARTITION_INDEX: ${{ matrix.partition }}
        run: npx tsx scripts/crawl-next-official-payment-evidence-batch.ts

  advance:
    needs: mark_failures
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Crawl beyond cooled-down failures
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: '250'
          CPM_OFFICIAL_EVIDENCE_PARTITION_COUNT: '8'
          CPM_OFFICIAL_EVIDENCE_PARTITION_INDEX: ${{ matrix.partition }}
        run: npx tsx scripts/crawl-next-official-payment-evidence-batch.ts

  finalize:
    needs: advance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check before staging mutation
        run: npx tsc --noEmit --pretty false
      - name: Enrich missing countries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_COUNTRY_ENRICH_MAX_TARGETS: '30'
        run: |
          npx tsx scripts/enrich-next-official-evidence-country-staging.ts
          npx tsx scripts/enrich-next-official-evidence-country-staging.ts
          npx tsx scripts/enrich-next-official-evidence-country-staging.ts
          npx tsx scripts/enrich-next-official-evidence-country-staging.ts
      - name: Strict-review up to 500 candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_ADMIN_CANDIDATE_PROMOTE_SUBJECTS: ${{ secrets.CPM_ADMIN_CANDIDATE_PROMOTE_SUBJECTS }}
          CPM_ADMIN_EVIDENCE_REVIEW_SUBJECTS: ${{ secrets.CPM_ADMIN_EVIDENCE_REVIEW_SUBJECTS }}
          CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: '100'
          CPM_OFFICIAL_EVIDENCE_MAX_WINDOWS: '5'
        run: npx tsx scripts/promote-confirm-next-official-evidence-batch.ts
      - name: Publish reviewed canonical staging records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS: ${{ secrets.CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS }}
        run: npx tsx scripts/publish-reviewed-physical-canonical-staging.ts
      - name: Materialize public data from staging DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/materialize-public-data-from-staging-db.ts
      - run: npm run build
      - run: node scripts/prepare-staging-review-artifact.mjs
      - name: Deploy staging review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name cryptopaymap-staging
          --branch review
      - name: Remove one-shot workflow
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git rm .github/workflows/one-shot-staging-growth-after-488.yml
          git commit -m "CLEANUP: remove cooldown-aware growth workflow"
          git push origin HEAD:run/staging-growth-after-488
