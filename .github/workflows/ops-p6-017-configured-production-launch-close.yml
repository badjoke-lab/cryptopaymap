name: OPS-P6-017 configured production launch close

on:
  pull_request:
    paths:
      - '.github/workflows/ops-p6-017-configured-production-launch-close.yml'
      - 'docs/OPS_P6_017_CONFIGURED_PRODUCTION_LAUNCH_CLOSE.md'
      - 'scripts/check-ops-p6-017-production-launch-close.mjs'
      - 'scripts/run-ops-p6-017-production-launch-close.mjs'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter OBSERVE_AND_CLOSE_CONFIGURED_PRODUCTION exactly.
        required: true
        type: string
      approved_commit:
        description: Exact 40-character current main commit SHA that was launched.
        required: true
        type: string
      observation_owner:
        description: Exact independent-observer identity bound by production authorization.
        required: true
        type: string
      incident_owner:
        description: Exact communication/incident-owner identity bound by production authorization.
        required: true
        type: string
      incident_clearance:
        description: Enter NO_LAUNCH_BLOCKING_INCIDENT exactly after incident review.
        required: true
        type: string
      observation_minutes:
        description: Read-only observation window in minutes (15-60).
        required: true
        default: '30'
        type: string
      sample_interval_minutes:
        description: Observation sample interval in minutes (5-15).
        required: true
        default: '5'
        type: string
      risk_register_json:
        description: Bounded JSON array of open/closed launch risks; [] when none.
        required: true
        default: '[]'
        type: string
      deferred_items_json:
        description: Bounded JSON array of deferred post-launch items; [] when none.
        required: true
        default: '[]'
        type: string
      next_review_at:
        description: ISO-8601 UTC timestamp for the next operational review after the observation window.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ops-p6-017-configured-production-launch-close
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Check production launch-close contract
        run: node scripts/check-ops-p6-017-production-launch-close.mjs

      - name: Run production launch-close self-test
        run: node scripts/run-ops-p6-017-production-launch-close.mjs --self-test

  observe:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      OBSERVATION_OWNER: ${{ inputs.observation_owner }}
      INCIDENT_OWNER: ${{ inputs.incident_owner }}
      INCIDENT_CLEARANCE: ${{ inputs.incident_clearance }}
      OBSERVATION_MINUTES: ${{ inputs.observation_minutes }}
      SAMPLE_INTERVAL_MINUTES: ${{ inputs.sample_interval_minutes }}
      RISK_REGISTER_JSON: ${{ inputs.risk_register_json }}
      DEFERRED_ITEMS_JSON: ${{ inputs.deferred_items_json }}
      NEXT_REVIEW_AT: ${{ inputs.next_review_at }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID: ${{ secrets.P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID }}
    steps:
      - name: Check out exact evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify exact current main and freeze evidence head
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          current_main_commit="$(git -C source rev-parse origin/main)"
          test "$current_main_commit" = "$APPROVED_COMMIT"
          status_head="$(git -C status rev-parse HEAD)"
          echo "STATUS_HEAD_START=$status_head" >> "$GITHUB_ENV"

      - name: Recheck exact-source repository contract
        id: repository_contract
        continue-on-error: true
        working-directory: source
        run: |
          npm run check
          node scripts/check-ops-p6-017-production-launch-close.mjs
          node scripts/run-ops-p6-017-production-launch-close.mjs --self-test

      - name: Verify protected credential-generation marker exists
        run: |
          set -euo pipefail
          test -n "$P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID"

      - name: Observe production through the bounded window
        env:
          REPOSITORY_CONTRACT_OUTCOME: ${{ steps.repository_contract.outcome }}
        working-directory: source
        run: |
          node scripts/run-ops-p6-017-production-launch-close.mjs \
            ../status \
            ../production-launch-close-attempt-receipt.json

      - name: Recheck main and retained evidence head after observation
        if: always()
        run: |
          set -euo pipefail
          test -f production-launch-close-attempt-receipt.json
          git -C source fetch origin main --depth=1
          git -C status fetch origin staging-review --depth=1
          main_now="$(git -C source rev-parse origin/main)"
          status_now="$(git -C status rev-parse origin/staging-review)"
          if [ "$main_now" != "$APPROVED_COMMIT" ] || [ "$status_now" != "$STATUS_HEAD_START" ]; then
            node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'production-launch-close-attempt-receipt.json';
          const receipt = JSON.parse(readFileSync(path, 'utf8'));
          receipt.state = 'verification_failed';
          receipt.blockers = [...new Set([...(receipt.blockers ?? []), 'repository_or_evidence_head:changed_during_observation'])];
          receipt.checks ??= {};
          receipt.checks.productionMutation = false;
          receipt.checks.launchClosed = false;
          writeFileSync(path, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          fi

      - name: Upload bounded production launch-close evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-017-configured-production-launch-close
          path: production-launch-close-attempt-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish launch-close attempt to status branch
        if: always()
        run: |
          set -euo pipefail
          test -f production-launch-close-attempt-receipt.json
          mkdir -p status/config/production-authorization
          cp production-launch-close-attempt-receipt.json \
            status/config/production-authorization/last-launch-close-attempt-receipt.json
          state="$(node -e "const r=require('./production-launch-close-attempt-receipt.json'); process.stdout.write(r.state)")"
          if [ "$state" = closed ]; then
            cp production-launch-close-attempt-receipt.json \
              status/config/production-authorization/launch-close-receipt.json
          fi
          git -C status config user.name 'github-actions[bot]'
          git -C status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C status add config/production-authorization
          if ! git -C status diff --cached --quiet; then
            git -C status commit -m 'Record configured production launch-close attempt'
            git -C status push origin HEAD:staging-review
          fi

      - name: Write production launch-close summary
        if: always()
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync } = require('node:fs');
          if (!existsSync('production-launch-close-attempt-receipt.json')) process.exit(0);
          const receipt = JSON.parse(readFileSync('production-launch-close-attempt-receipt.json', 'utf8'));
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Configured production launch close',
              '',
              `- State: \`${receipt.state}\``,
              `- Commit: \`${receipt.commit}\``,
              `- Observation samples: \`${receipt.observation?.sampleCount ?? 0}/${receipt.observation?.requiredSampleCount ?? 0}\``,
              `- Production mutation: \`${receipt.checks?.productionMutation}\``,
              `- Launch closed: \`${receipt.checks?.launchClosed}\``,
              `- Blockers: ${(receipt.blockers ?? []).length === 0 ? 'none' : receipt.blockers.map((value) => `\`${value}\``).join(', ')}`,
              `- Exceptions: ${(receipt.exceptions ?? []).length === 0 ? 'none' : receipt.exceptions.map((value) => `\`${value}\``).join(', ')}`,
              '',
            ].join('\n'),
          );
          NODE

      - name: Enforce closed read-only launch result
        if: always()
        run: |
          node -e "const r=require('./production-launch-close-attempt-receipt.json'); if(r.state!=='closed') process.exit(1)"
          node -e "const r=require('./production-launch-close-attempt-receipt.json'); if(r.checks.productionMutation!==false||r.checks.launchClosed!==true) process.exit(1)"
