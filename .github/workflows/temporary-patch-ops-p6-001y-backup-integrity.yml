name: Temporary patch OPS-P6-001Y backup integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-patch-ops-p6-001y-backup-integrity.yml'

permissions:
  contents: write

concurrency:
  group: temporary-patch-ops-p6-001y-backup-integrity
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Q3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001y-p6-07-backup-integrity

      - name: Assemble exact executor
        run: |
          set -euo pipefail
          cat tmp/q3-patch/chunk-* > scripts/run-ops-p6-001y-configured-staging-p6-07-backup-integrity.mjs
          echo 'fc6e24218f650169dd2b665e3f05617aa03f750aa2494304ea3650cc128592f9  scripts/run-ops-p6-001y-configured-staging-p6-07-backup-integrity.mjs' | sha256sum --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format and verify Q3 implementation
        run: |
          npm run format
          npm run check
          node scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js
          node scripts/check-ops-p6-001y-configured-staging-p6-07-backup-integrity.mjs
          node scripts/run-ops-p6-001y-configured-staging-p6-07-backup-integrity.mjs --self-test

      - name: Publish implementation and remove staging chunks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r tmp/q3-patch
          git add \
            .github/workflows/ops-p6-001y-configured-staging-p6-07-backup-integrity.yml \
            docs/OPS_P6_001Y_CONFIGURED_STAGING_P6_07_BACKUP_INTEGRITY.md \
            scripts/run-ops-p6-001y-configured-staging-p6-07-backup-integrity.mjs \
            scripts/check-ops-p6-001y-configured-staging-p6-07-backup-integrity.mjs
          git commit -m 'Implement configured staging P6-07 backup integrity evidence'
          git push origin HEAD:agent/ops-p6-001y-p6-07-backup-integrity
