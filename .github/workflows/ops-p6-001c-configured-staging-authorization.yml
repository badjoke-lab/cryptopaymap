name: OPS-P6-001C configured staging authorization

on:
  pull_request:
    paths:
      - '.github/workflows/ops-p6-001c-configured-staging-authorization.yml'
      - 'docs/OPS_P6_001C_CONFIGURED_STAGING_AUTHORIZATION.md'
      - 'docs/.ops-exact-main-refresh-trigger.md'
      - 'scripts/evaluate-ops-p6-001c-staging-authorization.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001c-configured-staging-authorization.yml'
      - 'docs/OPS_P6_001C_CONFIGURED_STAGING_AUTHORIZATION.md'
      - 'scripts/evaluate-ops-p6-001c-staging-authorization.mjs'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows:
      - P5-02R fixed review live audit
      - OPS-P6-001D configured staging P6-01 data QA
      - OPS-P6-001E configured staging P6-02 identity and Admin
      - OPS-P6-001G configured staging P6-03 Neon transaction
      - OPS-P6-001H configured staging P6-04 Media lifecycle
    types:
      - completed
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter AUTHORIZE_CONFIGURED_STAGING exactly.
        required: true
        type: string
      approved_commit:
        description: Exact 40-character main commit SHA to authorize.
        required: true
        type: string
      launch_owner:
        description: Bounded launch-owner identity.
        required: true
        type: string
      observer:
        description: Bounded independent-observer identity.
        required: true
        type: string
      rollback_owner:
        description: Bounded rollback-owner identity.
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: ops-p6-001c-configured-staging-authorization
  cancel-in-progress: false

jobs:
  refresh_exact_main:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'ops/trigger-exact-main-refresh'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      OPERATIONS_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Resolve exact current main
        shell: bash
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          current_main="$(git -C source rev-parse origin/main)"
          echo "TARGET_COMMIT=$current_main" >> "$GITHUB_ENV"

      - name: Determine whether exact-main evidence needs refresh
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const { resolve } = require('node:path');

          const target = process.env.TARGET_COMMIT;
          const now = Date.now();
          const paths = [
            'config/staging-authorization/p6-01-data-qa-receipt.json',
            'config/staging-authorization/p6-02-identity-admin-receipt.json',
            'config/staging-authorization/p6-03-neon-transaction-receipt.json',
            'config/staging-authorization/p6-04-r2-media-lifecycle-receipt.json',
            'config/staging-authorization/p6-05-public-export-release-receipt.json',
          ];

          let current = true;
          for (const path of paths) {
            try {
              const receipt = JSON.parse(readFileSync(resolve('status', path), 'utf8'));
              const expiresAt = Date.parse(receipt.expiresAt ?? '');
              if (
                receipt.state !== 'accepted' ||
                receipt.commit !== target ||
                !Number.isFinite(expiresAt) ||
                expiresAt <= now
              ) {
                current = false;
                break;
              }
            } catch {
              current = false;
              break;
            }
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `needs_refresh=${current ? 'false' : 'true'}\n`);
          NODE

      - name: Refresh P6-01 through P6-05 for exact main
        if: steps.freshness.outputs.needs_refresh == 'true'
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            local workflow="$1"
            local confirmation="$2"
            local owner_field="$3"
            local label="$4"
            local previous_run=""
            local run_id=""

            previous_run="$(
              gh run list \
                --workflow "$workflow" \
                --event workflow_dispatch \
                --branch main \
                --limit 30 \
                --json databaseId,headSha,createdAt \
                --jq "map(select(.headSha == \"$TARGET_COMMIT\")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty"
            )"

            echo "Dispatching $label for $TARGET_COMMIT"
            gh workflow run "$workflow" \
              --ref main \
              -f "confirmation=$confirmation" \
              -f "approved_commit=$TARGET_COMMIT" \
              -f "$owner_field=$OPERATIONS_OWNER"

            for _ in $(seq 1 60); do
              run_id="$(
                gh run list \
                  --workflow "$workflow" \
                  --event workflow_dispatch \
                  --branch main \
                  --limit 30 \
                  --json databaseId,headSha,createdAt \
                  --jq "map(select(.headSha == \"$TARGET_COMMIT\")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty"
              )"
              if [ -n "$run_id" ] && [ "$run_id" != "$previous_run" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "$run_id" ] || [ "$run_id" = "$previous_run" ]; then
              echo "Unable to locate newly dispatched $label run" >&2
              exit 1
            fi

            echo "$label run: $run_id"
            gh run watch "$run_id" --exit-status
          }

          dispatch_and_wait \
            ops-p6-001d-configured-staging-p6-01-data-qa.yml \
            EXECUTE_CONFIGURED_STAGING_P6_01 \
            data_owner \
            P6-01

          dispatch_and_wait \
            ops-p6-001e-configured-staging-p6-02-identity-admin.yml \
            EXECUTE_CONFIGURED_STAGING_P6_02 \
            identity_owner \
            P6-02

          dispatch_and_wait \
            ops-p6-001g-configured-staging-p6-03-neon-transaction.yml \
            EXECUTE_CONFIGURED_STAGING_P6_03 \
            transaction_owner \
            P6-03

          dispatch_and_wait \
            ops-p6-001h-configured-staging-p6-04-media-lifecycle.yml \
            EXECUTE_CONFIGURED_STAGING_P6_04 \
            media_owner \
            P6-04

          dispatch_and_wait \
            ops-p6-001i-configured-staging-p6-05-public-export-release.yml \
            EXECUTE_CONFIGURED_STAGING_P6_05 \
            release_owner \
            P6-05

      - name: Write exact-main refresh summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Exact-main configured-staging refresh

          - Exact main: \`$TARGET_COMMIT\`
          - Refresh required at start: \`${{ steps.freshness.outputs.needs_refresh }}\`
          - Trigger: \`${{ github.event_name }}\`

          This bounded refresh can only dispatch the existing configured-staging P6-01 through P6-05 workflows. It does not approve the GitHub production Environment, deploy production Pages, mutate production DNS, write the production database, mutate production R2, or perform cutover.
          EOF

  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run fail-closed authorization self-test
        run: node scripts/evaluate-ops-p6-001c-staging-authorization.mjs --self-test

  evaluate:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    needs: contract
    runs-on: ubuntu-24.04
    env:
      APPROVED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_commit || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'AUTHORIZE_CONFIGURED_STAGING' }}
      LAUNCH_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.launch_owner || format('inventory:{0}', github.actor) }}
      OBSERVER: ${{ github.event_name == 'workflow_dispatch' && inputs.observer || 'inventory:unassigned-observer' }}
      ROLLBACK_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_owner || 'inventory:unassigned-rollback-owner' }}
      EVALUATION_MODE: ${{ github.event_name == 'workflow_dispatch' && 'authorization' || 'inventory' }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_commit || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Evaluate configured staging authorization
        run: |
          node source/scripts/evaluate-ops-p6-001c-staging-authorization.mjs \
            status \
            configured-staging-authorization-receipt.json

      - name: Upload bounded authorization receipt
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-001c-configured-staging-authorization
          path: configured-staging-authorization-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish authorization receipt to status branch
        run: |
          set -euo pipefail
          mkdir -p status/config/staging-authorization
          cp configured-staging-authorization-receipt.json \
            status/config/staging-authorization/authorization-receipt.json
          git -C status config user.name 'github-actions[bot]'
          git -C status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C status add config/staging-authorization/authorization-receipt.json
          if git -C status diff --cached --quiet; then
            echo 'Configured staging authorization receipt is unchanged.'
            exit 0
          fi
          git -C status commit -m 'Record configured staging authorization receipt'
          git -C status push origin HEAD:staging-review

      - name: Write authorization summary
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const receipt = JSON.parse(
            readFileSync('configured-staging-authorization-receipt.json', 'utf8'),
          );
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Configured staging authorization',
              '',
              `- State: \`${receipt.state}\``,
              `- Mode: \`${receipt.mode}\``,
              `- Approved commit: \`${receipt.approvedCommit}\``,
              `- Blockers: ${receipt.blockers.length === 0 ? 'none' : receipt.blockers.map((value) => `\`${value}\``).join(', ')}`,
              '',
            ].join('\n'),
          );
          NODE

      - name: Enforce explicit authorization result
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "const r=require('./configured-staging-authorization-receipt.json'); if(r.state!=='authorized') process.exit(1)"
