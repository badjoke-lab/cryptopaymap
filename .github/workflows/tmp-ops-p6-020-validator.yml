name: Temporary OPS-P6-020 validator

on:
  push:
    branches:
      - ops-p6-020-production-credential-generation
    paths:
      - '.github/workflows/tmp-ops-p6-020-validator.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-020-production-credential-generation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch credential generation binding
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          def append_once(path, marker, block):
              p = Path(path)
              text = p.read_text()
              if marker not in text:
                  p.write_text(text.rstrip() + '\n\n' + block.strip() + '\n')

          # P6-014 workflow: generation marker is protected evidence input, not an app runtime secret.
          replace_one(
              '.github/workflows/ops-p6-014-configured-production-candidate-bootstrap.yml',
              '      P6_08_PRODUCTION_CF_ACCESS_AUD: ${{ secrets.P6_08_PRODUCTION_CF_ACCESS_AUD }}\n    steps:',
              '      P6_08_PRODUCTION_CF_ACCESS_AUD: ${{ secrets.P6_08_PRODUCTION_CF_ACCESS_AUD }}\n      P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID: ${{ secrets.P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID }}\n    steps:',
          )
          replace_one(
              '.github/workflows/ops-p6-014-configured-production-candidate-bootstrap.yml',
              '            P6_08_PRODUCTION_CF_ACCESS_AUD\n          )',
              '            P6_08_PRODUCTION_CF_ACCESS_AUD\n            P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID\n          )',
          )

          # P6-013 workflow.
          replace_one(
              '.github/workflows/ops-p6-013-configured-production-readiness-diagnostic.yml',
              '      P6_08_PRODUCTION_CF_ACCESS_AUD: ${{ secrets.P6_08_PRODUCTION_CF_ACCESS_AUD }}\n    steps:',
              '      P6_08_PRODUCTION_CF_ACCESS_AUD: ${{ secrets.P6_08_PRODUCTION_CF_ACCESS_AUD }}\n      P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID: ${{ secrets.P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID }}\n    steps:',
          )

          # P6-016 workflow: current generation must be rechecked immediately before mutation.
          replace_one(
              '.github/workflows/ops-p6-016-configured-production-go-live.yml',
              '      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}\n    steps:',
              '      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}\n      P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID: ${{ secrets.P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID }}\n    steps:',
          )
          replace_one(
              '.github/workflows/ops-p6-016-configured-production-go-live.yml',
              '          test -n "$CLOUDFLARE_ACCOUNT_ID"\n\n      - name: Execute separately authorized production cutover and rollback drill',
              '          test -n "$CLOUDFLARE_ACCOUNT_ID"\n          test -n "$P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID"\n\n      - name: Execute separately authorized production cutover and rollback drill',
          )

          # P6-014 candidate receipt: retain only a digest of the generation marker.
          replace_one(
              'scripts/run-ops-p6-014-production-candidate-bootstrap.mjs',
              "function isObject(value) {\n  return value !== null && typeof value === 'object' && !Array.isArray(value);\n}\n",
              "function isObject(value) {\n  return value !== null && typeof value === 'object' && !Array.isArray(value);\n}\n\nfunction credentialGenerationDigest(value) {\n  const normalized = typeof value === 'string' ? value.trim() : '';\n  if (normalized.length < 8 || normalized.length > 200) return null;\n  return boundedHash(normalized);\n}\n",
          )
          replace_one(
              'scripts/run-ops-p6-014-production-candidate-bootstrap.mjs',
              "  const topology = await verifyProjectTopology();\n  if (!topology.safe) throw new Error('production_candidate_project_topology_unsafe');",
              "  const generationDigest = credentialGenerationDigest(\n    process.env.P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID ?? '',\n  );\n  if (generationDigest === null) throw new Error('credential_generation_missing_or_invalid');\n\n  const topology = await verifyProjectTopology();\n  if (!topology.safe) throw new Error('production_candidate_project_topology_unsafe');",
          )
          replace_one(
              'scripts/run-ops-p6-014-production-candidate-bootstrap.mjs',
              '    schemaVersion: plan.schemaVersion,\n    checks: {',
              '    schemaVersion: plan.schemaVersion,\n    credentialGenerationDigest: generationDigest,\n    checks: {',
          )
          replace_one(
              'scripts/run-ops-p6-014-production-candidate-bootstrap.mjs',
              "    assert(first.version.canonicalOnly === true, 'version must remain canonical-only');",
              "    assert(first.version.canonicalOnly === true, 'version must remain canonical-only');\n    assert(\n      validDigest(credentialGenerationDigest('production-generation-v1')),\n      'credential generation marker must reduce to a bounded digest',\n    );\n    assert(\n      credentialGenerationDigest('short') === null,\n      'short credential generation marker must fail closed',\n    );",
          )

          # P6-013 readiness receipt and self-test.
          replace_one(
              'scripts/run-ops-p6-013-production-readiness-diagnostic.mjs',
              "  'P6_08_PRODUCTION_CF_ACCESS_AUD',\n];",
              "  'P6_08_PRODUCTION_CF_ACCESS_AUD',\n  'P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID',\n];",
          )
          replace_one(
              'scripts/run-ops-p6-013-production-readiness-diagnostic.mjs',
              "  const p605 = p605Evidence(options.statusRoot, commit, now);\n  const secrets = options.runtimeSecrets ?? runtimeSecrets();\n  const blockers = [];",
              "  const p605 = p605Evidence(options.statusRoot, commit, now);\n  const secrets = options.runtimeSecrets ?? runtimeSecrets();\n  const credentialGenerationId = String(\n    options.credentialGenerationId ?? process.env.P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID ?? '',\n  ).trim();\n  const generationValid =\n    credentialGenerationId.length >= 8 && credentialGenerationId.length <= 200;\n  const blockers = [];",
          )
          replace_one(
              'scripts/run-ops-p6-013-production-readiness-diagnostic.mjs',
              "  if (repositoryContractOutcome !== 'success') blockers.push('repository_contract:failed');\n  if (p605.state !== 'current') blockers.push('p6_05_release:not_current');",
              "  if (repositoryContractOutcome !== 'success') blockers.push('repository_contract:failed');\n  if (p605.state !== 'current') blockers.push('p6_05_release:not_current');\n  if (!generationValid) blockers.push('credential_generation:invalid');",
          )
          replace_one(
              'scripts/run-ops-p6-013-production-readiness-diagnostic.mjs',
              '    ownerDigest: validOwner(readinessOwner) ? digest(readinessOwner) : null,\n    checks: {',
              '    ownerDigest: validOwner(readinessOwner) ? digest(readinessOwner) : null,\n    credentialGenerationDigest: generationValid ? digest(credentialGenerationId) : null,\n    checks: {',
          )
          replace_one(
              'scripts/run-ops-p6-013-production-readiness-diagnostic.mjs',
              "    workflowRunId: '3003',\n    now,",
              "    workflowRunId: '3003',\n    credentialGenerationId: 'production-generation-v1',\n    now,",
          )
          replace_one(
              'scripts/run-ops-p6-013-production-readiness-diagnostic.mjs',
              "    assert(receipt.decision === 'ready', 'complete readiness must pass');",
              "    assert(receipt.decision === 'ready', 'complete readiness must pass');\n    assert(\n      receipt.credentialGenerationDigest === digest('production-generation-v1'),\n      'readiness must bind production credential generation',\n    );\n    receipt = await executeProductionReadiness({ ...base, credentialGenerationId: 'short' });\n    assert(\n      receipt.blockers.includes('credential_generation:invalid'),\n      'invalid credential generation must block readiness',\n    );\n    receipt = await executeProductionReadiness(base);",
          )

          # P6-012 authorization: candidate + readiness generation must match and be bound.
          replace_one(
              'scripts/evaluate-ops-p6-012-production-authorization.mjs',
              '    validDigest(receipt?.candidateArtifactId) &&\n    typeof receipt?.publicTreeDigest',
              '    validDigest(receipt?.candidateArtifactId) &&\n    validDigest(receipt?.credentialGenerationDigest) &&\n    typeof receipt?.publicTreeDigest',
          )
          replace_one(
              'scripts/evaluate-ops-p6-012-production-authorization.mjs',
              '    candidateArtifactId: current ? receipt.candidateArtifactId : null,\n    publicTreeDigest:',
              '    candidateArtifactId: current ? receipt.candidateArtifactId : null,\n    credentialGenerationDigest: current ? receipt.credentialGenerationDigest : null,\n    publicTreeDigest:',
          )
          replace_one(
              'scripts/evaluate-ops-p6-012-production-authorization.mjs',
              '    validDigest(expectedReleaseDigest) &&\n    receipt?.checks?.productionMutation === false',
              '    validDigest(expectedReleaseDigest) &&\n    validDigest(receipt?.credentialGenerationDigest) &&\n    receipt?.checks?.productionMutation === false',
          )
          replace_one(
              'scripts/evaluate-ops-p6-012-production-authorization.mjs',
              '    expectedReleaseDigest: current ? expectedReleaseDigest : null,\n    receiptDigest:',
              '    expectedReleaseDigest: current ? expectedReleaseDigest : null,\n    credentialGenerationDigest: current ? receipt.credentialGenerationDigest : null,\n    receiptDigest:',
          )
          replace_one(
              'scripts/evaluate-ops-p6-012-production-authorization.mjs',
              "  if (p605.state === 'current' && readiness.state === 'current_ready') {",
              "  if (candidate.state === 'current_accepted' && readiness.state === 'current_ready') {\n    if (candidate.credentialGenerationDigest !== readiness.credentialGenerationDigest)\n      blockers.push('production_credential_generation:mismatch');\n  }\n  if (p605.state === 'current' && readiness.state === 'current_ready') {",
          )
          replace_one(
              'scripts/evaluate-ops-p6-012-production-authorization.mjs',
              '          schemaVersion: candidate.schemaVersion,\n          candidateReceiptDigest:',
              '          schemaVersion: candidate.schemaVersion,\n          credentialGenerationDigest: candidate.credentialGenerationDigest,\n          candidateReceiptDigest:',
          )
          replace_one(
              'scripts/evaluate-ops-p6-012-production-authorization.mjs',
              "    candidateArtifactId: digest('candidate-artifact'),\n    datasetVersion:",
              "    candidateArtifactId: digest('candidate-artifact'),\n    credentialGenerationDigest: digest('production-generation-v1'),\n    datasetVersion:",
          )
          replace_one(
              'scripts/evaluate-ops-p6-012-production-authorization.mjs',
              "    expiresAt: new Date(now.getTime() + 45 * 60_000).toISOString(),\n    checks: {",
              "    expiresAt: new Date(now.getTime() + 45 * 60_000).toISOString(),\n    credentialGenerationDigest: digest('production-generation-v1'),\n    checks: {",
          )
          replace_one(
              'scripts/evaluate-ops-p6-012-production-authorization.mjs',
              "      'authorization must bind candidate artifact',\n    );",
              "      'authorization must bind candidate artifact',\n    );\n    assert(\n      receipt.productionEvidenceBinding?.credentialGenerationDigest ===\n        candidateFixture.credentialGenerationDigest,\n      'authorization must bind credential generation',\n    );\n\n    writeFileSync(\n      readinessFile,\n      `${JSON.stringify({ ...readinessFixture, credentialGenerationDigest: digest('production-generation-v2') }, null, 2)}\\n`,\n    );\n    receipt = evaluateProductionAuthorization(base);\n    assert(\n      receipt.blockers.includes('production_credential_generation:mismatch'),\n      'credential generation mismatch must fail',\n    );\n    writeFileSync(readinessFile, `${JSON.stringify(readinessFixture, null, 2)}\\n`);",
          )

          # P6-016: evidence receipts and current protected marker must all match authorization binding.
          replace_one(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              '    validDigest(candidate?.candidateArtifactId) &&\n    typeof candidate?.publicTreeDigest',
              '    validDigest(candidate?.candidateArtifactId) &&\n    validDigest(candidate?.credentialGenerationDigest) &&\n    typeof candidate?.publicTreeDigest',
          )
          replace_one(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              '    readiness?.checks?.productionMutation === false &&\n    Array.isArray(readiness?.blockers)',
              '    readiness?.checks?.productionMutation === false &&\n    validDigest(readiness?.credentialGenerationDigest) &&\n    Array.isArray(readiness?.blockers)',
          )
          replace_one(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              "    if (binding?.candidateReceiptDigest !== digest(JSON.stringify(candidate)))\n      blockers.push('evidence_binding:candidate_receipt_mismatch');",
              "    if (binding?.candidateReceiptDigest !== digest(JSON.stringify(candidate)))\n      blockers.push('evidence_binding:candidate_receipt_mismatch');\n    if (binding?.credentialGenerationDigest !== candidate.credentialGenerationDigest)\n      blockers.push('evidence_binding:credential_generation_mismatch');",
          )
          replace_one(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              "    if (binding?.readinessReceiptDigest !== digest(JSON.stringify(readiness)))\n      blockers.push('evidence_binding:readiness_receipt_mismatch');",
              "    if (binding?.readinessReceiptDigest !== digest(JSON.stringify(readiness)))\n      blockers.push('evidence_binding:readiness_receipt_mismatch');\n    if (binding?.credentialGenerationDigest !== readiness.credentialGenerationDigest)\n      blockers.push('evidence_binding:credential_generation_mismatch');",
          )
          replace_one(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              "  if (repositoryContractOutcome !== 'success') blockers.push('repository_contract:failed');\n\n  const evidence = readEvidenceBundle(",
              "  if (repositoryContractOutcome !== 'success') blockers.push('repository_contract:failed');\n  const credentialGenerationId = String(\n    process.env.P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID ?? '',\n  ).trim();\n  if (credentialGenerationId.length < 8 || credentialGenerationId.length > 200)\n    blockers.push('credential_generation:missing_or_invalid');\n\n  const evidence = readEvidenceBundle(",
          )
          replace_one(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              '  blockers.push(...evidence.blockers);\n  const uniqueBlockers = [...new Set(blockers)];',
              "  blockers.push(...evidence.blockers);\n  if (\n    credentialGenerationId.length >= 8 &&\n    credentialGenerationId.length <= 200 &&\n    evidence.authorization?.productionEvidenceBinding?.credentialGenerationDigest !==\n      digest(credentialGenerationId)\n  )\n    blockers.push('credential_generation:changed');\n  const uniqueBlockers = [...new Set(blockers)];",
          )
          replace_one(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              "      candidateArtifactId: digest('candidate'),\n      datasetVersion:",
              "      candidateArtifactId: digest('candidate'),\n      credentialGenerationDigest: digest('production-generation-v1'),\n      datasetVersion:",
          )
          replace_one(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              "      expiresAt: new Date(now.getTime() + 45 * 60_000).toISOString(),\n      checks: { productionMutation: false },",
              "      expiresAt: new Date(now.getTime() + 45 * 60_000).toISOString(),\n      credentialGenerationDigest: digest('production-generation-v1'),\n      checks: { productionMutation: false },",
          )
          replace_one(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              '      schemaVersion: candidateReceipt.schemaVersion,\n      candidateReceiptDigest:',
              '      schemaVersion: candidateReceipt.schemaVersion,\n      credentialGenerationDigest: candidateReceipt.credentialGenerationDigest,\n      candidateReceiptDigest:',
          )
          replace_one(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              "    assert(evidence.blockers.length === 0, 'valid evidence bundle must pass');",
              "    assert(evidence.blockers.length === 0, 'valid evidence bundle must pass');\n    const changedGenerationReadiness = {\n      ...readinessReceipt,\n      credentialGenerationDigest: digest('production-generation-v2'),\n    };\n    writeJson(resolve(statusRoot, readinessPath), changedGenerationReadiness);\n    evidence = readEvidenceBundle(\n      statusRoot,\n      commit,\n      authorizationId,\n      executionOwner,\n      rollbackOwner,\n      now,\n    );\n    assert(\n      evidence.blockers.includes('evidence_binding:credential_generation_mismatch'),\n      'changed credential generation evidence must fail closed',\n    );\n    writeJson(resolve(statusRoot, readinessPath), readinessReceipt);",
          )

          # Extend repository contract checkers.
          for path, label, markers in [
              ('scripts/check-ops-p6-014-production-candidate-bootstrap.mjs', 'runner', ['p6_08_production_credential_generation_id', 'credentialgenerationdigest']),
              ('scripts/check-ops-p6-013-production-readiness-diagnostic.mjs', 'runner', ['p6_08_production_credential_generation_id', 'credentialgenerationdigest', 'credential_generation:invalid']),
              ('scripts/check-ops-p6-012-production-authorization.mjs', 'evaluator', ['credentialgenerationdigest', 'production_credential_generation:mismatch']),
              ('scripts/check-ops-p6-016-production-go-live-executor.mjs', 'runner', ['credential_generation:changed', 'evidence_binding:credential_generation_mismatch']),
          ]:
              p = Path(path)
              text = p.read_text()
              sentinel = "console.log('"
              idx = text.rfind(sentinel)
              if idx < 0:
                  raise SystemExit(f'{path}: console sentinel missing')
              block = f"expectIncludes('{label}', files.{label}, {markers!r});\n\n"
              if markers[0].lower() not in text.lower():
                  p.write_text(text[:idx] + block + text[idx:])

          # Workflow-specific checker markers.
          for path, marker in [
              ('scripts/check-ops-p6-014-production-candidate-bootstrap.mjs', 'p6_08_production_credential_generation_id'),
              ('scripts/check-ops-p6-013-production-readiness-diagnostic.mjs', 'p6_08_production_credential_generation_id'),
              ('scripts/check-ops-p6-016-production-go-live-executor.mjs', 'p6_08_production_credential_generation_id'),
          ]:
              p = Path(path)
              text = p.read_text()
              idx = text.rfind("console.log('")
              stmt = f"expectIncludes('workflow', files.workflow, ['{marker}']);\n\n"
              if stmt not in text:
                  p.write_text(text[:idx] + stmt + text[idx:])

          # Documentation: explicit generation/revocation contract.
          section = '''
          ## Production credential generation binding

          The protected `P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID` is an opaque generation marker for the complete configured-production credential and security-configuration set. Raw marker and credential values are never retained or logged; only a SHA-256 digest is retained as evidence.

          Any rotation or material change to production database credentials, review-secret seed, Turnstile credentials, Cloudflare Access configuration, or other bound production credentials requires a new generation marker. Candidate bootstrap, readiness, configured-production authorization, and go-live must all bind the same credential-generation digest. A changed generation fails closed and requires a new readiness and authorization chain before any production mutation.
          '''
          for path in [
              'docs/OPS_P6_014_CONFIGURED_PRODUCTION_CANDIDATE_BOOTSTRAP.md',
              'docs/OPS_P6_013_CONFIGURED_PRODUCTION_READINESS_DIAGNOSTIC.md',
              'docs/OPS_P6_012_CONFIGURED_PRODUCTION_AUTHORIZATION.md',
              'docs/OPS_P6_016_CONFIGURED_PRODUCTION_GO_LIVE.md',
          ]:
              append_once(path, 'Production credential generation binding', section)
          PY

          npx biome check --write \
            scripts/run-ops-p6-014-production-candidate-bootstrap.mjs \
            scripts/check-ops-p6-014-production-candidate-bootstrap.mjs \
            scripts/run-ops-p6-013-production-readiness-diagnostic.mjs \
            scripts/check-ops-p6-013-production-readiness-diagnostic.mjs \
            scripts/evaluate-ops-p6-012-production-authorization.mjs \
            scripts/check-ops-p6-012-production-authorization.mjs \
            scripts/run-ops-p6-016-production-go-live-executor.mjs \
            scripts/check-ops-p6-016-production-go-live-executor.mjs

          npm run check
          node scripts/check-ops-p6-014-production-candidate-bootstrap.mjs
          node scripts/run-ops-p6-014-production-candidate-bootstrap.mjs --self-test
          node scripts/check-ops-p6-013-production-readiness-diagnostic.mjs
          node scripts/run-ops-p6-013-production-readiness-diagnostic.mjs --self-test
          node scripts/check-ops-p6-012-production-authorization.mjs
          node scripts/evaluate-ops-p6-012-production-authorization.mjs --self-test
          node scripts/check-ops-p6-016-production-go-live-executor.mjs
          node scripts/run-ops-p6-016-production-go-live-executor.mjs --self-test

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-ops-p6-020-validator.yml
          git add \
            .github/workflows/ops-p6-012-configured-production-authorization.yml \
            .github/workflows/ops-p6-013-configured-production-readiness-diagnostic.yml \
            .github/workflows/ops-p6-014-configured-production-candidate-bootstrap.yml \
            .github/workflows/ops-p6-016-configured-production-go-live.yml \
            docs/OPS_P6_012_CONFIGURED_PRODUCTION_AUTHORIZATION.md \
            docs/OPS_P6_013_CONFIGURED_PRODUCTION_READINESS_DIAGNOSTIC.md \
            docs/OPS_P6_014_CONFIGURED_PRODUCTION_CANDIDATE_BOOTSTRAP.md \
            docs/OPS_P6_016_CONFIGURED_PRODUCTION_GO_LIVE.md \
            scripts/evaluate-ops-p6-012-production-authorization.mjs \
            scripts/check-ops-p6-012-production-authorization.mjs \
            scripts/run-ops-p6-013-production-readiness-diagnostic.mjs \
            scripts/check-ops-p6-013-production-readiness-diagnostic.mjs \
            scripts/run-ops-p6-014-production-candidate-bootstrap.mjs \
            scripts/check-ops-p6-014-production-candidate-bootstrap.mjs \
            scripts/run-ops-p6-016-production-go-live-executor.mjs \
            scripts/check-ops-p6-016-production-go-live-executor.mjs
          git commit -m 'OPS-P6-020: bind production credential generation'
          git push origin HEAD:ops-p6-020-production-credential-generation
