name: One-time P6-06 expiry recovery formatter

on:
  push:
    branches:
      - agent/ops-p6-06-expiry-deadlock-recovery
    paths:
      - '.github/workflows/one-time-p6-06-expiry-recovery-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-06-expiry-deadlock-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format final recovery patch
        run: |
          npx prettier --write \
            docs/OPS_P6_001I_CONFIGURED_STAGING_P6_05_PUBLIC_EXPORT_RELEASE.md \
            docs/OPS_P6_001R_CONFIGURED_STAGING_P6_06_CONTINUITY_REVALIDATION.md \
            scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs \
            scripts/check-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs \
            scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs \
            scripts/run-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs
      - name: Commit formatting and remove formatter
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-p6-06-expiry-recovery-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Format P6-05 P6-06 expiry recovery'
          git push origin HEAD:agent/ops-p6-06-expiry-deadlock-recovery