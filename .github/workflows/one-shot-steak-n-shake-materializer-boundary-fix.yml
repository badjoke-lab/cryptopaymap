name: One-shot Steak n Shake materializer boundary fix

on:
  push:
    branches:
      - feat/steak-n-shake-btc-growth
    paths:
      - .github/workflows/one-shot-steak-n-shake-materializer-boundary-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steak-n-shake-btc-growth
      - name: Bound update keys and exclude non-public social links
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/materialize-public-data-from-staging-db.ts')
          text = path.read_text()

          marker = """function publicSlug(value: string): string {\n  const normalized = value\n    .trim()\n    .toLowerCase()\n    .replace(/[^a-z0-9]+/g, '-')\n    .replace(/^-+|-+$/g, '')\n    .slice(0, 64)\n    .replace(/-+$/g, '');\n  return normalized.length > 0 ? normalized : 'merchant';\n}\n"""
          addition = marker + """\nfunction boundedPublicIdentifier(prefix: string, value: string): string {\n  const candidate = `${prefix}-${value}`;\n  if (candidate.length <= 64) return candidate;\n  const head = candidate.slice(0, 51).replace(/-+$/g, '');\n  return `${head}-${sha256(candidate).slice(0, 12)}`;\n}\n\nfunction publishableSocialLinks(\n  links: Array<{ platform: string; url: string; handle: string | null }> | null,\n) {\n  return (links ?? []).filter((link) => {\n    const platform = link.platform.trim();\n    if (!/^[a-z0-9][a-z0-9_-]*$/.test(platform) || platform.length > 40) return false;\n    if (link.handle !== null) {\n      const handle = link.handle.trim();\n      if (handle.length < 1 || handle.length > 120) return false;\n    }\n    try {\n      return new URL(link.url).protocol === 'https:';\n    } catch {\n      return false;\n    }\n  });\n}\n"""
          if text.count(marker) != 1:
              raise SystemExit('unexpected publicSlug helper shape')
          text = text.replace(marker, addition, 1)

          old_social = "      socialLinks: row.socialLinks ?? [],\n"
          new_social = "      socialLinks: publishableSocialLinks(row.socialLinks),\n"
          if text.count(old_social) != 1:
              raise SystemExit('unexpected socialLinks materialization shape')
          text = text.replace(old_social, new_social, 1)

          old_update = "    updateKey: `confirmed-${place.placeSlug}`,\n"
          new_update = "    updateKey: boundedPublicIdentifier('confirmed', place.placeSlug),\n"
          if text.count(old_update) != 1:
              raise SystemExit('unexpected updateKey materialization shape')
          text = text.replace(old_update, new_update, 1)

          path.write_text(text)
          PY
      - name: Commit and push materializer boundary fix
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/materialize-public-data-from-staging-db.ts
          git commit -m "FIX: enforce public materializer identifier and URL bounds"
          git push origin HEAD:feat/steak-n-shake-btc-growth
