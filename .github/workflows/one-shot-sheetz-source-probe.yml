name: One-shot Sheetz official-directory source probe

on:
  push:
    branches:
      - feat/sheetz-flexa-growth
    paths:
      - scripts/probe-sheetz-official-directory.ts
      - scripts/probe-sheetz-live-bundle-api.ts
      - scripts/probe-sheetz-browser-directory.mjs
      - scripts/probe-sheetz-staging-overlap.mjs
      - .github/workflows/one-shot-sheetz-source-probe.yml

permissions:
  contents: read

concurrency:
  group: one-shot-sheetz-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Extract live Sheetz bundle API configuration
        run: |
          set -o pipefail
          npx tsx scripts/probe-sheetz-live-bundle-api.ts 2>&1 | tee sheetz-bundle-api.log

      - name: Install browser probe runtime
        run: npm install --no-save --no-package-lock playwright-core

      - name: Resolve runner Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Probe current official Sheetz directory through live browser
        run: |
          set -o pipefail
          node scripts/probe-sheetz-browser-directory.mjs 2>&1 | tee sheetz-browser-source-probe.log

      - name: Assert official-source identity, profile, and crypto coverage
        run: |
          node --input-type=module <<'NODE' 2>&1 | tee sheetz-source-probe-guard.log
          import { readFile } from 'node:fs/promises';
          const lines = (await readFile('sheetz-browser-source-probe.log', 'utf8')).trim().split(/\r?\n/);
          const result = JSON.parse(lines.at(-1));
          const total = result.officialDirectoryFetched;
          if (total < 800 || total > 950) throw new Error(`Directory count outside guard range: ${total}`);
          if (total !== result.uniqueStoreNumbers || result.duplicateStoreNumbers !== 0) {
            throw new Error(`Store-number identity is not unique: rows=${total}, unique=${result.uniqueStoreNumbers}`);
          }
          if (result.validCoordinates !== total || result.uniqueCoordinates !== total || result.duplicateCoordinates !== 0) {
            throw new Error(`Coordinate coverage/identity invalid: valid=${result.validCoordinates}, unique=${result.uniqueCoordinates}, rows=${total}`);
          }
          if (result.withAddress !== total || result.withCity !== total || result.withPostalCode !== total || result.withPhone !== total) {
            throw new Error(`Profile coverage incomplete: address=${result.withAddress}, city=${result.withCity}, postal=${result.withPostalCode}, phone=${result.withPhone}, rows=${total}`);
          }
          if (result.cryptoFlexaPayMissing !== 0 || result.cryptoFlexaPayTrue + result.cryptoFlexaPayFalse !== total) {
            throw new Error(`cryptoFlexaPay coverage invalid: true=${result.cryptoFlexaPayTrue}, false=${result.cryptoFlexaPayFalse}, missing=${result.cryptoFlexaPayMissing}, rows=${total}`);
          }
          if (result.cryptoFlexaPayTrue < 500) {
            throw new Error(`Current merchant-owned Pay with Crypto coverage unexpectedly small: ${result.cryptoFlexaPayTrue}/${total}`);
          }
          if (result.cryptoCurrencyAcceptanceMissing !== 0 || result.cryptoCurrencyAcceptanceTrue + result.cryptoCurrencyAcceptanceFalse !== total) {
            throw new Error(`cryptoCurrencyAcceptance coverage invalid: true=${result.cryptoCurrencyAcceptanceTrue}, false=${result.cryptoCurrencyAcceptanceFalse}, missing=${result.cryptoCurrencyAcceptanceMissing}, rows=${total}`);
          }
          if (result.cryptoFlagCrossTab.anyMissing !== 0) {
            throw new Error(`Crypto feature cross-tab has missing flags: ${result.cryptoFlagCrossTab.anyMissing}`);
          }
          console.log(JSON.stringify({
            officialDirectoryFetched: total,
            uniqueStoreNumbers: result.uniqueStoreNumbers,
            uniqueCoordinates: result.uniqueCoordinates,
            profileCoverage: {
              address: result.withAddress,
              city: result.withCity,
              postalCode: result.withPostalCode,
              phone: result.withPhone,
            },
            cryptoFlexaPayTrue: result.cryptoFlexaPayTrue,
            cryptoFlexaPayFalse: result.cryptoFlexaPayFalse,
            cryptoCurrencyAcceptanceTrue: result.cryptoCurrencyAcceptanceTrue,
            cryptoCurrencyAcceptanceFalse: result.cryptoCurrencyAcceptanceFalse,
            cryptoFlagCrossTab: result.cryptoFlagCrossTab,
            operatingStates: result.operatingStates,
            stateCounts: result.stateCounts,
          }));
          NODE

      - name: Audit current reviewed staging overlap without mutation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: |
          set -o pipefail
          npx tsx scripts/probe-sheetz-staging-overlap.mjs 2>&1 | tee sheetz-staging-overlap.log

      - name: Upload source proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheetz-source-probe
          path: |
            sheetz-bundle-api.log
            sheetz-browser-source-probe.log
            sheetz-source-probe-guard.log
            sheetz-staging-overlap.log
          if-no-files-found: warn
          retention-days: 7
