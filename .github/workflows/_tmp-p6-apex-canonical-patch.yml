name: temporary P6 apex canonical patch

on:
  push:
    branches:
      - ops/p6-apex-canonical
    paths:
      - .github/workflows/_tmp-p6-apex-canonical-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/p6-apex-canonical
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply apex-canonical production topology patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace(path, old, new, count=None):
              text = read(path)
              actual = text.count(old)
              if actual == 0:
                  raise SystemExit(f'missing literal in {path}: {old[:120]!r}')
              if count is not None and actual != count:
                  raise SystemExit(f'unexpected literal count in {path}: {actual} != {count}: {old[:120]!r}')
              write(path, text.replace(old, new))

          def sub(path, pattern, replacement, count=1):
              text = read(path)
              result, actual = re.subn(pattern, lambda _m: replacement, text, count=count, flags=re.S)
              if actual != count:
                  raise SystemExit(f'unexpected regex count in {path}: {actual} != {count}: {pattern[:120]!r}')
              write(path, result)

          # Canonical public origin and production candidate runtime hostname.
          replace(
              'scripts/materialize-production-machine-files.mjs',
              "export const canonicalOrigin = 'https://www.cryptopaymap.com';",
              "export const canonicalOrigin = 'https://cryptopaymap.com';",
              1,
          )
          replace(
              '.github/workflows/ops-p6-014-configured-production-candidate-bootstrap.yml',
              "CPM_TURNSTILE_EXPECTED_HOSTNAME: 'www.cryptopaymap.com'",
              "CPM_TURNSTILE_EXPECTED_HOSTNAME: 'cryptopaymap.com'",
              1,
          )
          replace(
              'scripts/check-ops-p6-014-production-candidate-bootstrap.mjs',
              '"cpm_turnstile_expected_hostname: \'www.cryptopaymap.com\'",',
              '"cpm_turnstile_expected_hostname: \'cryptopaymap.com\'",',
              1,
          )
          replace(
              'scripts/check-ops-p6-014-production-candidate-bootstrap.mjs',
              "'canonical `www.cryptopaymap.com`',",
              "'canonical `cryptopaymap.com`',",
              1,
          )
          replace(
              'docs/OPS_P6_014_CONFIGURED_PRODUCTION_CANDIDATE_BOOTSTRAP.md',
              'The intended Turnstile hostname is the canonical `www.cryptopaymap.com`. The apex `cryptopaymap.com` is the redirect host and must not be accepted as the server-side Turnstile hostname; the candidate pages.dev hostname is also not treated as the canonical live hostname.',
              'The intended Turnstile hostname is the canonical `cryptopaymap.com`. The `www.cryptopaymap.com` hostname is the redirect host and must not be accepted as the server-side Turnstile hostname; the candidate pages.dev hostname is also not treated as the canonical live hostname.',
              1,
          )
          replace(
              'docs/OPS_P6_021_PRODUCTION_MACHINE_READABLE_FILES.md',
              'https://www.cryptopaymap.com/sitemap.xml',
              'https://cryptopaymap.com/sitemap.xml',
              1,
          )

          # Pages middleware owns WWW -> apex after both production custom domains are active.
          write('functions/_middleware.ts', """import { applyPagesResponseHeaders } from '../src/http/pages-response-headers';

interface PagesMiddlewareContext {
  request: Request;
  next(): Promise<Response>;
}

const canonicalHost = 'cryptopaymap.com';
const redirectHost = 'www.cryptopaymap.com';

export async function onRequest(context: PagesMiddlewareContext): Promise<Response> {
  const url = new URL(context.request.url);
  if (url.hostname.toLowerCase() === redirectHost) {
    url.protocol = 'https:';
    url.hostname = canonicalHost;
    url.port = '';
    const response = new Response(null, {
      status: 308,
      headers: { location: url.toString() },
    });
    return applyPagesResponseHeaders(context.request, response);
  }
  return applyPagesResponseHeaders(context.request, await context.next());
}
""")

          # P6-016: switch from legacy-apex + new-WWW to new-apex + WWW redirect.
          p16 = 'scripts/run-ops-p6-016-production-go-live-executor.mjs'
          replace(
              p16,
              "const apexHost = 'cryptopaymap.com';\nconst canonicalHost = 'www.cryptopaymap.com';",
              "const apexHost = 'cryptopaymap.com';\nconst redirectHost = 'www.cryptopaymap.com';\nconst canonicalHost = apexHost;",
              1,
          )

          sub(
              p16,
              r"export function classifyProviderSnapshot\(snapshot\) \{.*?\n\}\n\nfunction safeSnapshot",
              """export function classifyProviderSnapshot(snapshot) {
  if (!snapshot?.projectSafe || !snapshot?.zoneSafe || !snapshot?.stagingProjectSafe)
    return 'conflict';
  if (!Array.isArray(snapshot.apexRecords) || !Array.isArray(snapshot.wwwRecords))
    return 'conflict';
  if (
    !Array.isArray(snapshot.customDomains) ||
    !Array.isArray(snapshot.apexDomains) ||
    !Array.isArray(snapshot.wwwDomains)
  )
    return 'conflict';

  const legacyARecords = snapshot.apexRecords.filter((record) =>
    exactDnsRecord(record, {
      type: 'A',
      name: apexHost,
      content: legacyA,
      proxied: false,
      ttl: 1,
    }),
  );
  const candidateApexRecords = snapshot.apexRecords.filter((record) =>
    exactDnsRecord(record, {
      type: 'CNAME',
      name: apexHost,
      content: platformDomain,
      proxied: true,
      ttl: 1,
    }),
  );
  const verificationRecords = snapshot.apexRecords.filter(exactTxtRecord);
  const legacyApexExact =
    snapshot.apexRecords.length === 2 &&
    legacyARecords.length === 1 &&
    verificationRecords.length === 1;
  const candidateApexExact =
    snapshot.apexRecords.length === 2 &&
    candidateApexRecords.length === 1 &&
    verificationRecords.length === 1;

  const legacyWww =
    snapshot.wwwRecords.length === 1 &&
    exactDnsRecord(snapshot.wwwRecords[0], {
      type: 'CNAME',
      name: redirectHost,
      content: legacyWwwCname,
      proxied: false,
      ttl: 1,
    });
  const candidateWww =
    snapshot.wwwRecords.length === 1 &&
    exactDnsRecord(snapshot.wwwRecords[0], {
      type: 'CNAME',
      name: redirectHost,
      content: platformDomain,
      proxied: true,
      ttl: 1,
    });

  const noCustomDomains =
    snapshot.customDomains.length === 0 &&
    snapshot.apexDomains.length === 0 &&
    snapshot.wwwDomains.length === 0;
  const exactCandidateDomains =
    snapshot.customDomains.length === 2 &&
    snapshot.apexDomains.length === 1 &&
    snapshot.wwwDomains.length === 1 &&
    normalizeHostname(snapshot.apexDomains[0]?.name) === apexHost &&
    normalizeHostname(snapshot.wwwDomains[0]?.name) === redirectHost;

  if (legacyApexExact && legacyWww && noCustomDomains) return 'legacy_v1';
  if (candidateApexExact && candidateWww && exactCandidateDomains) {
    return snapshot.apexDomains[0]?.status === 'active' && snapshot.wwwDomains[0]?.status === 'active'
      ? 'candidate_active'
      : 'candidate_pending';
  }
  return 'conflict';
}

function safeSnapshot""",
          )

          sub(
              p16,
              r"function safeSnapshot\(snapshot\) \{.*?\n\}\n\nfunction readEvidenceBundle",
              """function safeSnapshot(snapshot) {
  return {
    classification: classifyProviderSnapshot(snapshot),
    projectSafe: snapshot.projectSafe,
    zoneSafe: snapshot.zoneSafe,
    stagingProjectSafe: snapshot.stagingProjectSafe,
    apexRecordCount: snapshot.apexRecords.length,
    apexRecordDigest: stableRecordDigest(snapshot.apexRecords),
    wwwRecordCount: snapshot.wwwRecords.length,
    wwwRecordDigest: stableRecordDigest(snapshot.wwwRecords),
    customDomainCount: snapshot.customDomains.length,
    apexDomainCount: snapshot.apexDomains.length,
    wwwDomainCount: snapshot.wwwDomains.length,
    apexDomainStatuses: snapshot.apexDomains
      .map((item) => (typeof item?.status === 'string' ? item.status : 'unknown'))
      .sort(),
    wwwDomainStatuses: snapshot.wwwDomains
      .map((item) => (typeof item?.status === 'string' ? item.status : 'unknown'))
      .sort(),
    projectIdDigest: snapshot.projectIdDigest,
    zoneIdDigest: snapshot.zoneIdDigest,
    stagingProjectDigest: snapshot.stagingProjectDigest,
  };
}

function readEvidenceBundle""",
          )

          replace(
              p16,
              "const wwwRecords = records.filter((record) => normalizeHostname(record?.name) === canonicalHost);",
              "const wwwRecords = records.filter((record) => normalizeHostname(record?.name) === redirectHost);",
