          replace(c16, "'apex_redirect_location_mismatch',", "'www_redirect_location_mismatch',", 1)
          replace(c16, "'apexmutation: false',", "'apexmutation: mutationstarted',", 1)
          replace(c16, "'apex is not mutated',", "'apex is the canonical production host',", 1)
          replace(c16, "'exact retained vercel `www` cname',", "'exact retained legacy vercel topology',", 1)

          write('docs/OPS_P6_016_CONFIGURED_PRODUCTION_GO_LIVE.md', """# OPS-P6-016 — Configured production go-live

## Purpose

OPS-P6-016 performs the separately authorized production cutover only after the protected production environment, production candidate, readiness receipt, and configured-production authorization are current on the exact `main` commit.

The canonical production origin is `https://cryptopaymap.com`. `https://www.cryptopaymap.com` is a redirect host and must return a permanent 308 redirect to the same apex path and query after cutover.

## Exact pre-state

The executor fails closed unless the observed legacy topology is exact:

- apex `cryptopaymap.com` has the retained Vercel A record `216.198.79.1` plus the retained Google verification TXT;
- `www.cryptopaymap.com` has the exact retained Vercel CNAME `02eeaa61ea1e3365.vercel-dns-017.com`;
- the dedicated `cryptopaymap-production` Pages project has no custom domains;
- the configured staging Pages project remains unchanged.

Unknown records, unknown custom domains, wrong provider targets, changed evidence, or a changed credential generation fail closed before mutation.

## Candidate cutover topology

The bounded cutover deliberately mutates the apex because the apex is the canonical production host. It:

1. removes only the exact legacy apex A and exact legacy WWW CNAME;
2. preserves the Google verification TXT;
3. creates a proxied apex CNAME to `cryptopaymap-production.pages.dev`;
4. creates a proxied WWW CNAME to the same Pages project;
5. attaches both `cryptopaymap.com` and `www.cryptopaymap.com` to the dedicated Pages project;
6. waits for both Pages custom domains to become active;
7. externally verifies the apex release and the WWW-to-apex redirect.

The Pages middleware owns the WWW redirect, preserving the same path and query. No unrelated DNS record may be changed.

## External verification

The candidate phase requires:

- public DNS convergence for both hostnames;
- apex no longer resolving through the retained legacy Vercel A target;
- `www` no longer resolving through the retained legacy Vercel CNAME;
- apex public pages, machine-readable files, and immutable candidate artifact identity;
- unauthenticated Admin remains fail-closed with HTTP 403 and the required private/no-store, noindex, and nosniff headers;
- `www` returns HTTP 308 to `https://cryptopaymap.com` with the same path/query;
- the staging project remains unchanged.

## Mandatory rollback drill

The first successful candidate cutover is rolled back before the final cutover. Rollback:

- detaches only the two expected production Pages custom domains;
- removes only the exact candidate apex/WWW records;
- restores the exact retained Vercel apex A and WWW CNAME;
- preserves the Google verification TXT;
- externally verifies the restored legacy 307 apex-to-WWW behavior and Vercel WWW service.

Any unexpected DNS or custom-domain state fails closed rather than being deleted.

After rollback proof, the executor performs the same candidate cutover again and externally verifies it as the final serving topology.

## Evidence and boundaries

The receipt binds the authorization, candidate artifact, release authority, dataset/schema identity, public-tree digest, credential-generation digest, launch owner, rollback owner, provider-state digests, rollback proof, and final external proof.

`apexMutation` is true for an accepted go-live because apex cutover is intentional. `unrelatedDnsMutation` and `stagingMutation` remain false. This workflow does not close launch; OPS-P6-017 owns the observation window and launch-close receipt.

Raw credentials, provider tokens, unrestricted responses, private canonical payloads, and protected Admin session material are never retained.

Parent: #293.
""")

          # P6-017 observes apex as canonical and WWW as redirect host.
          p17 = 'scripts/run-ops-p6-017-production-launch-close.mjs'
          replace(
              p17,
              "const apexHost = 'cryptopaymap.com';\nconst canonicalHost = 'www.cryptopaymap.com';\nconst canonicalOrigin = `https://${canonicalHost}`;",
              "const apexHost = 'cryptopaymap.com';\nconst redirectHost = 'www.cryptopaymap.com';\nconst canonicalHost = apexHost;\nconst canonicalOrigin = `https://${canonicalHost}`;",
              1,
          )
          replace(p17, '    goLive?.checks?.apexMutation === false &&', '    goLive?.checks?.apexMutation === true &&', 1)

          sub(
              p17,
              r"  const apex = await fetch\(`https://\$\{apexHost\}\$\{probePath\}\?\$\{query\}`, \{.*?  const tlsObservation = await observeTls\(canonicalHost\);",
              """  const redirect = await fetch(`https://${redirectHost}${probePath}?${query}`, {
    cache: 'no-store',
    redirect: 'manual',
    signal: AbortSignal.timeout(20_000),
  });
  const expectedLocation = `${canonicalOrigin}${probePath}?${query}`;
  if (redirect.status !== 308 || redirect.headers.get('location') !== expectedLocation)
    throw new Error('www_redirect_mismatch');

  const apexAddresses = (await dns.resolve4(apexHost)).sort();
  if (apexAddresses.length === 0 || apexAddresses.includes(legacyA))
    throw new Error('canonical_apex_dns_not_converged');
  const redirectAddresses = (await dns.resolve4(redirectHost)).sort();
  if (redirectAddresses.length === 0) throw new Error('redirect_dns_missing');
  let redirectCnames = [];
  try {
    redirectCnames = (await dns.resolveCname(redirectHost)).map((value) =>
      value.toLowerCase().replace(/\\.$/, ''),
    );
  } catch {}
  if (redirectCnames.includes(legacyWwwCname)) throw new Error('redirect_dns_returned_to_legacy');

  const tlsObservation = await observeTls(canonicalHost);
  const redirectTlsObservation = await observeTls(redirectHost);""",
          )
          replace(
              p17,
              "    apexRedirect: { status: 307, locationDigest: digest(expectedLocation) },\n    dns: {\n      apexDigest: digest(apexAddresses),\n      canonicalAddressCount: canonicalAddresses.length,\n      canonicalDigest: digest(canonicalAddresses),\n      legacyCnamePresent: false,\n    },\n    tls: tlsObservation,",
              "    wwwRedirect: { status: 308, locationDigest: digest(expectedLocation) },\n    dns: {\n      apexAddressCount: apexAddresses.length,\n      apexDigest: digest(apexAddresses),\n      redirectAddressCount: redirectAddresses.length,\n      redirectDigest: digest(redirectAddresses),\n      legacyCnamePresent: false,\n    },\n    tls: { canonical: tlsObservation, redirect: redirectTlsObservation },",
              1,
          )

          c17 = 'scripts/check-ops-p6-017-production-launch-close.mjs'
          replace(c17, "'apex_redirect_mismatch',", "'www_redirect_mismatch',", 1)

          d17 = 'docs/OPS_P6_017_CONFIGURED_PRODUCTION_LAUNCH_CLOSE.md'
          replace(d17, '- apex DNS was not mutated;', '- the apex was deliberately moved to the approved production Pages target;', 1)
          replace(
              d17,
              '- `cryptopaymap.com` preserves the approved 307 path/query redirect to `www.cryptopaymap.com`;\n- the apex remains on the approved legacy A target used by the cutover plan;\n- the canonical host resolves publicly and has not reverted to the legacy WWW CNAME;',
              '- `cryptopaymap.com` is the canonical production host and resolves publicly through the production Pages path;\n- the apex has not reverted to the approved legacy Vercel A target;\n- `www.cryptopaymap.com` returns the approved 308 path/query-preserving redirect to `cryptopaymap.com`;\n- the WWW redirect host has not reverted to the legacy Vercel CNAME;',
              1,
          )

          # Contract markers reflect the new topology.
          replace(
              'scripts/check-ops-p6-017-production-launch-close.mjs',
              "'canonical_dns_returned_to_legacy',",
              "'redirect_dns_returned_to_legacy',",
              1,
          )

          # The production machine-file docs should state the apex canonical origin explicitly.
          replace(
              'docs/OPS_P6_021_PRODUCTION_MACHINE_READABLE_FILES.md',
              'advertises the canonical sitemap at `https://cryptopaymap.com/sitemap.xml`.',
              'advertises the canonical sitemap at `https://cryptopaymap.com/sitemap.xml`; the apex is the canonical production origin and `www` is redirect-only.',
              1,
          )

          # Guard against accidentally retaining the old canonical statement in Phase 6 launch files.
          forbidden = []
          for path in [
              '.github/workflows/ops-p6-014-configured-production-candidate-bootstrap.yml',
              'scripts/materialize-production-machine-files.mjs',
              'docs/OPS_P6_014_CONFIGURED_PRODUCTION_CANDIDATE_BOOTSTRAP.md',
              'docs/OPS_P6_016_CONFIGURED_PRODUCTION_GO_LIVE.md',
              'docs/OPS_P6_017_CONFIGURED_PRODUCTION_LAUNCH_CLOSE.md',
              'docs/OPS_P6_021_PRODUCTION_MACHINE_READABLE_FILES.md',
          ]:
              text = read(path).lower()
              if 'canonical `www.cryptopaymap.com`' in text or 'https://www.cryptopaymap.com/sitemap.xml' in text:
                  forbidden.append(path)
          if forbidden:
              raise SystemExit(f'old canonical semantics remain: {forbidden}')
          PY

