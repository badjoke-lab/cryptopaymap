name: One-shot high-density Bitcoin candidate report

on:
  push:
    branches:
      - feat/bulk-official-directory-evidence
    paths:
      - scripts/report-high-density-bitcoin-candidate-groups-staging.ts
      - .github/workflows/one-shot-high-density-candidate-report.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Report high-density location-scoped groups
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/report-high-density-bitcoin-candidate-groups-staging.ts
