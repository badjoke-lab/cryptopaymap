name: P6-08 final launch authorization go-live and launch-close evidence

on:
  pull_request:
    paths:
      - 'docs/P6_08_FINAL_LAUNCH_AUTHORIZATION_GO_LIVE_CLOSE_EVIDENCE.md'
      - 'docs/P6_07_CONFIGURED_OPERATIONAL_MONITORING_BACKUP_RESTORE_INCIDENT_EVIDENCE.md'
      - 'docs/P6_06_CONFIGURED_DOMAIN_CUTOVER_ROLLBACK_EVIDENCE.md'
      - 'docs/P6_05_CONFIGURED_PUBLIC_EXPORT_RELEASE_EVIDENCE.md'
      - 'docs/PROJECT_STATUS.md'
      - 'scripts/check-p6-08-final-launch-authorization-go-live-close-evidence.js'
      - '.github/workflows/p6-08-final-launch-authorization-go-live-close-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'docs/P6_08_FINAL_LAUNCH_AUTHORIZATION_GO_LIVE_CLOSE_EVIDENCE.md'
      - 'docs/P6_07_CONFIGURED_OPERATIONAL_MONITORING_BACKUP_RESTORE_INCIDENT_EVIDENCE.md'
      - 'docs/P6_06_CONFIGURED_DOMAIN_CUTOVER_ROLLBACK_EVIDENCE.md'
      - 'docs/P6_05_CONFIGURED_PUBLIC_EXPORT_RELEASE_EVIDENCE.md'
      - 'docs/PROJECT_STATUS.md'
      - 'scripts/check-p6-08-final-launch-authorization-go-live-close-evidence.js'
      - '.github/workflows/p6-08-final-launch-authorization-go-live-close-evidence.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-p6-08-final-launch-authorization-go-live-close-evidence.js