name: Temporary fix OPS-P6-001Z public wording

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-fix-ops-p6-001z-public-wording.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out status branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001z-reconcile-project-status

      - name: Remove tool-specific wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/PROJECT_STATUS.md')
          text = path.read_text()
          old = 'The current GitHub connector can read and modify repository content, Issues, pull requests, and workflow runs, but it does not expose repository-secret creation. Protected values must therefore be configured outside public repository content. Production remains untouched and unauthorized.'
          new = 'Protected repository secrets must be configured through the repository secret-management surface and must never be committed to public repository content. Production remains untouched and unauthorized.'
          if text.count(old) != 1:
              raise SystemExit(f'public wording marker mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          ! grep -F 'GitHub connector' docs/PROJECT_STATUS.md
          grep -F 'repository secret-management surface' docs/PROJECT_STATUS.md

      - name: Publish wording correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATUS.md
          git commit -m 'Keep Phase 6 status wording public-safe'
          git push origin HEAD:agent/ops-p6-001z-reconcile-project-status
