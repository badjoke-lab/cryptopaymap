name: OPS-P6-001F apply derived staging auth once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/ops-p6-001f-derived-staging-service-auth'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001f-derived-staging-service-auth

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Preserve regex replacement literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_ops_p6_001f.py')
          content = path.read_text(encoding='utf-8')
          old = "updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, content, count=1, flags=re.S)"
          if old not in content:
              raise SystemExit('Expected replace_regex implementation not found')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply bounded migration
        run: python3 scripts/apply_ops_p6_001f.py

      - name: Format changed source
        run: |
          npx biome check --write \
            src/admin/access/config.ts \
            src/admin/access/identity.ts \
            src/admin/access/verification.ts \
            src/admin/dashboard/identity-context.ts \
            scripts/check-admin-access.ts \
            scripts/derive-suggest-review-secrets.mjs \
            scripts/run-ops-p6-001e-configured-staging-identity-admin.ts \
            tests/admin-access-verification.test.ts \
            tests/admin-derived-service-auth.test.ts

      - name: Run bounded contract checks
        run: |
          npx tsx scripts/check-admin-access.ts
          node scripts/check-p6-02-configured-identity-admin-evidence.js
          npx tsx scripts/run-ops-p6-001e-configured-staging-identity-admin.ts --self-test
          npx vitest run \
            tests/admin-access-identity.test.ts \
            tests/admin-access-verification.test.ts \
            tests/admin-derived-service-auth.test.ts

      - name: Commit validated non-workflow changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/ADMIN_ACCESS_CONFIGURATION.md \
            docs/OPS_P6_001E_CONFIGURED_STAGING_P6_02_IDENTITY_ADMIN.md \
            docs/P6_02_CONFIGURED_IDENTITY_ADMIN_EVIDENCE.md \
            docs/PROJECT_STATUS.md \
            scripts/check-admin-access.ts \
            scripts/derive-suggest-review-secrets.mjs \
            scripts/run-ops-p6-001e-configured-staging-identity-admin.ts \
            src/admin/access/config.ts \
            src/admin/access/identity.ts \
            src/admin/access/verification.ts \
            src/admin/dashboard/identity-context.ts \
            tests/admin-access-verification.test.ts \
            tests/admin-derived-service-auth.test.ts
          git rm -f scripts/apply_ops_p6_001f.py
          git commit -m 'OPS-P6-001F add validated staging service authentication'
          git push origin HEAD:agent/ops-p6-001f-derived-staging-service-auth
