name: OPS-P6-017 post-cutover observation and launch close

on:
  pull_request:
    paths:
      - '.github/workflows/ops-p6-017-post-cutover-launch-close.yml'
      - 'docs/OPS_P6_017_POST_CUTOVER_LAUNCH_CLOSE.md'
      - 'scripts/check-ops-p6-017-post-cutover-launch-close.mjs'
      - 'scripts/run-ops-p6-017-post-cutover-launch-close.mjs'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter OBSERVE_AND_CLOSE_CONFIGURED_PRODUCTION_LAUNCH exactly.
        required: true
        type: string
      approved_commit:
        description: Exact launched 40-character current main commit SHA.
        required: true
        type: string
      close_owner:
        description: Bounded launch-close owner identity.
        required: true
        type: string
      observation_minutes:
        description: Observation window in minutes (15-120).
        required: true
        default: '30'
        type: string
      sample_interval_minutes:
        description: Observation sample interval in minutes (1-15).
        required: true
        default: '5'
        type: string
      open_risk_register_json:
        description: JSON array of bounded non-launch-blocking open risks.
        required: true
        default: '[]'
        type: string
      deferred_items_json:
        description: JSON array of bounded non-launch-blocking deferred items.
        required: true
        default: '[]'
        type: string
      incident_issue_numbers:
        description: Comma-separated known launch-linked GitHub issue numbers; empty only when none are known.
        required: false
        default: ''
        type: string
      next_operational_review_date:
        description: Next operational review date in YYYY-MM-DD.
        required: true
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: ops-p6-017-post-cutover-launch-close
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Check post-cutover launch-close contract
        run: node scripts/check-ops-p6-017-post-cutover-launch-close.mjs

      - name: Run post-cutover launch-close self-test
        run: node scripts/run-ops-p6-017-post-cutover-launch-close.mjs --self-test

  observe:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CLOSE_OWNER: ${{ inputs.close_owner }}
      OBSERVATION_MINUTES: ${{ inputs.observation_minutes }}
      SAMPLE_INTERVAL_MINUTES: ${{ inputs.sample_interval_minutes }}
      OPEN_RISK_REGISTER_JSON: ${{ inputs.open_risk_register_json }}
      DEFERRED_ITEMS_JSON: ${{ inputs.deferred_items_json }}
      NEXT_OPERATIONAL_REVIEW_DATE: ${{ inputs.next_operational_review_date }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify exact current main
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          current_main_commit="$(git -C source rev-parse origin/main)"
          test "$current_main_commit" = "$APPROVED_COMMIT"

      - name: Recheck exact-source repository contract
        id: repository_contract
        continue-on-error: true
        working-directory: source
        run: |
          npm run check
          node scripts/check-ops-p6-017-post-cutover-launch-close.mjs
          node scripts/run-ops-p6-017-post-cutover-launch-close.mjs --self-test

      - name: Verify read-only provider credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Observe incident issues read-only
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_ISSUE_NUMBERS: ${{ inputs.incident_issue_numbers }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const token = process.env.GH_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const raw = process.env.INCIDENT_ISSUE_NUMBERS ?? '';
          const numbers = raw.trim().length === 0
            ? []
            : raw.split(',').map((value) => value.trim()).filter(Boolean).map((value) => Number(value));
          if (numbers.some((value) => !Number.isInteger(value) || value < 1)) {
            throw new Error('incident_issue_numbers_invalid');
          }
          const incidents = [];
          for (const issueNumber of [...new Set(numbers)]) {
            const response = await fetch(`https://api.github.com/repos/${repository}/issues/${issueNumber}`, {
              method: 'GET',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!response.ok) throw new Error(`incident_issue_lookup_failed:${issueNumber}:${response.status}`);
            const issue = await response.json();
            incidents.push({ issueNumber, state: issue?.state ?? 'unknown' });
          }
          writeFileSync('incident-observation.json', `${JSON.stringify({ incidents }, null, 2)}\n`);
          NODE

      - name: Observe post-cutover window and evaluate launch close
        env:
          REPOSITORY_CONTRACT_OUTCOME: ${{ steps.repository_contract.outcome }}
        working-directory: source
        run: |
          node scripts/run-ops-p6-017-post-cutover-launch-close.mjs \
            ../status \
            ../incident-observation.json \
            ../production-launch-close-attempt-receipt.json

      - name: Upload bounded launch-close attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-017-post-cutover-launch-close
          path: production-launch-close-attempt-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish bounded launch-close attempt and immutable close evidence
        if: always()
        run: |
          set -euo pipefail
          test -f production-launch-close-attempt-receipt.json
          mkdir -p status/config/production-authorization
          cp production-launch-close-attempt-receipt.json \
            status/config/production-authorization/launch-close-attempt-receipt.json
          state="$(node -e "const r=require('./production-launch-close-attempt-receipt.json'); process.stdout.write(r.state)")"
          if [ "$state" = closed ]; then
            if [ -f status/config/production-authorization/launch-close-receipt.json ]; then
              existing="$(node -e "const r=require('./status/config/production-authorization/launch-close-receipt.json'); process.stdout.write(r.closeId||'')")"
              proposed="$(node -e "const r=require('./production-launch-close-attempt-receipt.json'); process.stdout.write(r.closeId||'')")"
              test "$existing" = "$proposed" || { echo immutable_launch_close_conflict; exit 1; }
            else
              cp production-launch-close-attempt-receipt.json \
                status/config/production-authorization/launch-close-receipt.json
            fi
          fi
          git -C status config user.name 'github-actions[bot]'
          git -C status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C status add config/production-authorization/launch-close-attempt-receipt.json
          if [ "$state" = closed ]; then
            git -C status add config/production-authorization/launch-close-receipt.json
          fi
          if ! git -C status diff --cached --quiet; then
            git -C status commit -m 'Record post-cutover launch-close evidence'
            git -C status push origin HEAD:staging-review
          fi

      - name: Write launch-close summary
        if: always()
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync } = require('node:fs');
          if (!existsSync('production-launch-close-attempt-receipt.json')) process.exit(0);
          const receipt = JSON.parse(readFileSync('production-launch-close-attempt-receipt.json', 'utf8'));
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Post-cutover launch close',
              '',
              `- State: \`${receipt.state}\``,
              `- Commit: \`${receipt.commit}\``,
              `- Observation samples: \`${receipt.observation.sampleCount}\``,
              `- All samples passed: \`${receipt.observation.allPassed}\``,
              `- Identity stable: \`${receipt.observation.identityStable}\``,
              `- Production mutation: \`${receipt.checks.productionMutation}\``,
              `- Blockers: ${receipt.blockers.length === 0 ? 'none' : receipt.blockers.map((value) => `\`${value}\``).join(', ')}`,
              '',
            ].join('\n'),
          );
          NODE

      - name: Enforce launch close
        if: always()
        run: |
          node -e "const r=require('./production-launch-close-attempt-receipt.json'); if(r.state!=='closed') process.exit(1)"
          node -e "const r=require('./production-launch-close-attempt-receipt.json'); if(r.checks.productionMutation!==false||r.checks.launchCloseMutation!==false) process.exit(1)"
