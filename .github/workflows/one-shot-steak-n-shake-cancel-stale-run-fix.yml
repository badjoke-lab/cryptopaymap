name: One-shot Steak n Shake stale-run cancellation fix

on:
  push:
    branches:
      - feat/steak-n-shake-btc-growth
    paths:
      - .github/workflows/one-shot-steak-n-shake-cancel-stale-run-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steak-n-shake-btc-growth
      - name: Enable cancellation of stale serial growth run
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/one-shot-steak-n-shake-btc-growth.yml')
          text = path.read_text()
          old = '  cancel-in-progress: false\n'
          new = '  cancel-in-progress: true\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one cancel-in-progress false, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and push cancellation behavior
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add .github/workflows/one-shot-steak-n-shake-btc-growth.yml
          git commit -m "OPS: cancel stale Steak n Shake growth runs"
          git push origin HEAD:feat/steak-n-shake-btc-growth
