name: Temporary fix OPS-P6-001Z self-reference

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-fix-ops-p6-001z-self-reference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out status branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001z-reconcile-project-status

      - name: Make exact-main instructions merge-stable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/PROJECT_STATUS.md')
          text = path.read_text()
          replacements = {
            'Latest verified `main` is `f1482a3e45ea45855f563720c494af798b9ac053`, produced by PR #365.':
              'Latest verified implementation baseline before this status-only reconciliation is `f1482a3e45ea45855f563720c494af798b9ac053`, produced by PR #365.',
            'The merge to `f1482a3e45ea45855f563720c494af798b9ac053` changed exact main after the retained P6-01 through P6-06, Q1, and Q2 receipts. Those configured receipts remain historical evidence but must be refreshed before a Q3 execution can be accepted on current main.':
              'PR #365 changed exact main after the retained P6-01 through P6-06, Q1, and Q2 receipts. This status-only reconciliation creates a later documentation commit, so those configured receipts remain historical evidence and must be refreshed on the exact post-reconciliation main before Q3 can be accepted.',
            'refresh configured staging deployment and fixed-review live audit on exact current main `f1482a3e45ea45855f563720c494af798b9ac053`;':
              'refresh configured staging deployment and fixed-review live audit on the exact current main after this status reconciliation merges;',
            'P6-01 through P6-06, Q1, and Q2 receipts not yet refreshed on `f1482a3e45ea45855f563720c494af798b9ac053`.':
              'P6-01 through P6-06, Q1, and Q2 receipts not yet refreshed on the exact current main after this status reconciliation.'
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'self-reference marker mismatch: {old} => {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          grep -F 'exact post-reconciliation main' docs/PROJECT_STATUS.md
          grep -F 'after this status reconciliation merges' docs/PROJECT_STATUS.md

      - name: Publish self-reference correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATUS.md
          git commit -m 'Keep Phase 6 exact-main instructions merge-stable'
          git push origin HEAD:agent/ops-p6-001z-reconcile-project-status
