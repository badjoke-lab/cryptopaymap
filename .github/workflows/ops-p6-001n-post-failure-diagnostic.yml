name: OPS-P6-001N post-failure P6-06 diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001n-post-failure-diagnostic.yml'

permissions:
  actions: write
  contents: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APPROVED_COMMIT: 6420b69b103f587c9f11dbbd77c89a316dfdfce7
      DISPATCHER_BRANCH: agent/ops-p6-001n-post-failure-diagnostic
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out dispatcher branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001n-post-failure-diagnostic

      - name: Verify unchanged exact main
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$APPROVED_COMMIT"

      - name: Run read-only P6-06 diagnostic
        run: |
          set -euo pipefail
          workflow=ops-p6-001j-configured-staging-p6-06-domain-topology-diagnostic.yml
          previous="$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run "$workflow" --ref main \
            -f confirmation=DIAGNOSE_CONFIGURED_STAGING_P6_06 \
            -f approved_commit="$APPROVED_COMMIT" \
            -f domain_owner=ops-p6-001n:post-failure-diagnostic
          run_id=''
          for attempt in $(seq 1 60); do
            candidate="$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$candidate" ] && [ "$candidate" != "$previous" ]; then
              run_id="$candidate"
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

      - name: Remove one-time diagnostic workflow
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/ops-p6-001n-post-failure-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ops-p6-001n-post-failure-diagnostic.yml
          if ! git diff --cached --quiet; then
            git commit -m 'OPS-P6-001N remove post-failure diagnostic workflow'
            git push origin HEAD:"$DISPATCHER_BRANCH"
          fi
