name: One-time P6-07 Q4 constraint expression eb5aa

on:
  pull_request:
    paths:
      - '.github/workflows/one-time-p6-07-q4-constraint-expression-eb5aa.yml'

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: eb5aa45676ad18c28c3a16fc00b46432050fc2a2
      EXPECTED_TARGET: cpm_p6_07_restore_20260808
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESTORE_URL: ${{ secrets.P6_07_RESTORE_DATABASE_URL }}
      BACKUP_KEY: ${{ secrets.P6_07_BACKUP_ENCRYPTION_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact main
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -r '.sha')"
          test "$actual" = "$EXPECTED_MAIN"

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install --yes curl ca-certificates >/dev/null
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          arch="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: ${arch}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update >/dev/null
          sudo apt-get install --yes postgresql-client-17 >/dev/null
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Download exact Q3 artifact
        uses: actions/download-artifact@v4
        with:
          name: ops-p6-001y-configured-staging-p6-07-encrypted-backup-31470200394
          run-id: 31470200394
          github-token: ${{ github.token }}
          path: q3-artifact

      - name: Restore, print bounded constraint definitions, and always dispose
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createDecipheriv, createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const { readFileSync, writeFileSync, rmSync } = require('node:fs');
          const sourceUrl = process.env.DATABASE_URL;
          const targetUrl = process.env.RESTORE_URL;
          const expectedTarget = process.env.EXPECTED_TARGET;
          const secret = process.env.BACKUP_KEY;
          function envFor(raw) {
            const u = new URL(raw); const e = { ...process.env };
            e.PGHOST=u.hostname; e.PGPORT=u.port||'5432'; e.PGUSER=decodeURIComponent(u.username); e.PGPASSWORD=decodeURIComponent(u.password); e.PGDATABASE=decodeURIComponent(u.pathname.replace(/^\/+/,''));
            if (u.searchParams.get('sslmode')) e.PGSSLMODE=u.searchParams.get('sslmode'); return e;
          }
          function q(raw, sql) { return execFileSync('psql',['-X','-v','ON_ERROR_STOP=1','-Atq','-c',sql],{env:envFor(raw),encoding:'utf8',stdio:['ignore','pipe','pipe']}).trim(); }
          const objectCountSql="select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname not in ('pg_catalog','information_schema') and n.nspname !~ '^pg_toast' and c.relkind in ('r','p','v','m','S','f')";
          if (q(targetUrl,'select current_database()') !== expectedTarget) throw new Error('target_name_mismatch');
          if (Number(q(targetUrl,objectCountSql)) !== 0) throw new Error('target_not_empty');
          const envelope=JSON.parse(readFileSync('q3-artifact/p6-07-q3-backup.enc.json','utf8'));
          const key=createHash('sha256').update(secret,'utf8').digest();
          const decipher=createDecipheriv('aes-256-gcm',key,Buffer.from(envelope.iv,'base64')); decipher.setAAD(Buffer.from(JSON.stringify(envelope.metadata),'utf8')); decipher.setAuthTag(Buffer.from(envelope.tag,'base64'));
          writeFileSync('q4.dump',Buffer.concat([decipher.update(Buffer.from(envelope.ciphertext,'base64')),decipher.final()]));
          let code=0;
          try {
            execFileSync('pg_restore',['--exit-on-error','--single-transaction','--no-owner','--no-privileges','--dbname',expectedTarget,'q4.dump'],{env:envFor(targetUrl),stdio:['ignore','ignore','pipe']});
            const sql="select pg_get_constraintdef(c.oid,true) from pg_constraint c join pg_class t on t.oid=c.conrelid join pg_namespace n on n.oid=t.relnamespace where n.nspname='public' and t.relname='media_files' and c.conname='media_files_public_format'";
            const s=q(sourceUrl,sql); const t=q(targetUrl,sql);
            if (!s || !t) throw new Error('constraint_missing');
            console.log(`source_constraint=${s}`);
            console.log(`restored_constraint=${t}`);
            console.log(`constraint_equal=${s===t}`);
          } catch (e) { code=1; console.error(`diagnostic_failure=${e instanceof Error?e.message:String(e)}`); }
          finally {
            try { q(targetUrl,'drop schema if exists drizzle cascade; drop schema if exists public cascade; create schema public'); const n=Number(q(targetUrl,objectCountSql)); console.log(`isolated_target_user_objects_after=${n}`); if(n!==0) code=1; } catch { code=1; console.error('diagnostic_cleanup_failed'); }
            rmSync('q4.dump',{force:true});
          }
          process.exit(code);
          NODE
