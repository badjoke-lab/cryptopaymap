name: OPS-P6-001H type diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001h-type-diagnostic.yml'
      - 'functions/admin/api/staging-media-object.ts'
      - 'functions/media/staging/[[path]].ts'
      - 'src/admin/media-review/durable-object-storage.ts'
      - 'src/admin/media-review/http-decision-writer.ts'
      - 'workers/submission-rate-limit/index.ts'
      - 'wrangler.jsonc'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Astro and TypeScript check
        run: npm run check
