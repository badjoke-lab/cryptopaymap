name: Staging Candidate count audit

on:
  push:
    branches:
      - ops/staging-candidate-count-audit
    paths:
      - scripts/audit-staging-candidate-count.ts
      - .github/workflows/staging-candidate-count-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Count private staging Candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: |
          summary="$(npx tsx scripts/audit-staging-candidate-count.ts)"
          jq -e '.target == "fixed-review-staging" and .mutationPerformed == false and .payloadExposed == false' <<<"$summary" >/dev/null
          {
            echo '## Staging Candidate count audit'
            echo
            echo "- Candidate total: $(jq -r '.candidateTotal' <<<"$summary")"
            echo '- mutation performed: false'
            echo '- Candidate payload exposed: false'
          } >> "$GITHUB_STEP_SUMMARY"
