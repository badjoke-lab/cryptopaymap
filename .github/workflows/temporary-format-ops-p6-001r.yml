name: Temporary format OPS-P6-001R

on:
  push:
    branches:
      - agent/ops-p6-001r-p6-06-continuity-revalidation
    paths:
      - '.github/workflows/temporary-format-ops-p6-001r.yml'

permissions:
  contents: write

concurrency:
  group: temporary-format-ops-p6-001r
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001r-p6-06-continuity-revalidation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format repository
        run: npm run format

      - name: Remove one-time formatter and publish normalization
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-format-ops-p6-001r.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git commit -m 'Format OPS-P6-001R continuity revalidation'
          git push origin HEAD:agent/ops-p6-001r-p6-06-continuity-revalidation
