name: Patch strict review window starvation

on:
  push:
    branches:
      - fix/strict-review-window-starvation
    paths:
      - .github/workflows/patch-strict-review-window-starvation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Expand bounded strict-review window
        run: |
          python - <<'PY'
          from pathlib import Path

          strict = Path('scripts/promote-confirm-official-evidence-batch.ts')
          text = strict.read_text()

          old = """const DEFAULT_MAX_TARGETS = 50;\nconst HARD_MAX_TARGETS = 100;\nconst MAX_BATCH_IDS = 50;"""
          new = """const DEFAULT_MAX_TARGETS = 50;\nconst HARD_MAX_TARGETS = 100;\nconst DEFAULT_MAX_WINDOWS = 1;\nconst HARD_MAX_WINDOWS = 5;\nconst MAX_BATCH_IDS = 200;"""
          if old not in text:
              raise SystemExit('strict constants marker missing')
          text = text.replace(old, new, 1)

          old = """function maxTargetsFromEnvironment(): number {\n  const raw = process.env.CPM_OFFICIAL_EVIDENCE_MAX_TARGETS?.trim();\n  const value = raw ? Number(raw) : DEFAULT_MAX_TARGETS;\n  if (!Number.isInteger(value) || value < 1 || value > HARD_MAX_TARGETS) {\n    throw new Error(`CPM_OFFICIAL_EVIDENCE_MAX_TARGETS must be 1-${HARD_MAX_TARGETS}.`);\n  }\n  return value;\n}\n"""
          new = old + """\nfunction maxWindowsFromEnvironment(): number {\n  const raw = process.env.CPM_OFFICIAL_EVIDENCE_MAX_WINDOWS?.trim();\n  const value = raw ? Number(raw) : DEFAULT_MAX_WINDOWS;\n  if (!Number.isInteger(value) || value < 1 || value > HARD_MAX_WINDOWS) {\n    throw new Error(`CPM_OFFICIAL_EVIDENCE_MAX_WINDOWS must be 1-${HARD_MAX_WINDOWS}.`);\n  }\n  return value;\n}\n"""
          if old not in text:
              raise SystemExit('strict maxTargets function marker missing')
          text = text.replace(old, new, 1)

          old = """  const batchIds = batchIdsFromEnvironment();\n  const maxTargets = maxTargetsFromEnvironment();\n  const db = createDatabase(databaseUrl);"""
          new = """  const batchIds = batchIdsFromEnvironment();\n  const maxTargets = maxTargetsFromEnvironment();\n  const maxWindows = maxWindowsFromEnvironment();\n  const maxReviewTargets = maxTargets * maxWindows;\n  const db = createDatabase(databaseUrl);"""
          if old not in text:
              raise SystemExit('strict main env marker missing')
          text = text.replace(old, new, 1)

          old = "for (const candidate of candidates.slice(0, maxTargets)) {"
          new = "for (const candidate of candidates.slice(0, maxReviewTargets)) {"
          if old not in text:
              raise SystemExit('strict slice marker missing')
          text = text.replace(old, new, 1)

          old = """      batchIds,\n      maxTargets,\n      evidenceKind: 'official_payment_page',"""
          new = """      batchIds,\n      maxTargets,\n      maxWindows,\n      maxReviewTargets,\n      evidenceKind: 'official_payment_page',"""
          if old not in text:
              raise SystemExit('strict output marker missing')
          text = text.replace(old, new, 1)
          strict.write_text(text)

          wrapper = Path('scripts/promote-confirm-next-official-evidence-batch.ts')
          text = wrapper.read_text()
          old = "const MAX_BATCH_IDS = 50;"
          new = "const MAX_BATCH_IDS = 200;"
          if old not in text:
              raise SystemExit('wrapper batch limit marker missing')
          wrapper.write_text(text.replace(old, new, 1))
          PY
      - name: Commit durable fix and remove patch helper
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git rm .github/workflows/patch-strict-review-window-starvation.yml
          git add scripts/promote-confirm-official-evidence-batch.ts scripts/promote-confirm-next-official-evidence-batch.ts
          git commit -m "FIX: advance strict review beyond the first hundred candidates"
          git push origin HEAD:fix/strict-review-window-starvation
