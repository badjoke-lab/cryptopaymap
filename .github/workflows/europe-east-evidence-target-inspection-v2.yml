name: Europe-east Evidence target inspection v2

on:
  push:
    branches:
      - ops/europe-east-official-evidence-review-v2
    paths:
      - scripts/inspect-europe-east-evidence-targets.ts
      - .github/workflows/europe-east-evidence-target-inspection-v2.yml

permissions:
  contents: read

env:
  CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Inspect targets privately
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          review_file="${RUNNER_TEMP}/europe-east-evidence-target-inspection-v2.json"
          npx tsx scripts/inspect-europe-east-evidence-targets.ts > "$review_file"
          jq -e '.target == "fixed-review-staging" and .mutationPerformed == false and .publicDataChanged == false and .payloadExposedInLogs == false' "$review_file" >/dev/null
          {
            echo '## Europe-east private target inspection v2'
            echo
            echo "- Evidence rows: $(jq -r '.evidenceRows' "$review_file")"
            echo '- Candidate names/addresses/URLs/raw payload in public logs: 0'
            echo '- mutation performed: false'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived private inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: europe-east-evidence-target-inspection-v2-private
          path: ${{ runner.temp }}/europe-east-evidence-target-inspection-v2.json
          retention-days: 1
          if-no-files-found: error
