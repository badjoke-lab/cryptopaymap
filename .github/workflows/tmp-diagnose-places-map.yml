name: Temporary places map runtime diagnostic

on:
  push:
    branches:
      - fix/places-map-runtime
    paths:
      - '.github/workflows/tmp-diagnose-places-map.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser diagnostic runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Diagnose deployed Places map
        env:
          TARGET_URL: https://real-data-review.cryptopaymap-staging.pages.dev/places
        run: |
          cat > /tmp/diagnose-map.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-webgl'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const consoleMessages = [];
          const pageErrors = [];
          const failedRequests = [];
          const badResponses = [];

          page.on('console', (message) => {
            consoleMessages.push({ type: message.type(), text: message.text() });
          });
          page.on('pageerror', (error) => pageErrors.push(error.message));
          page.on('requestfailed', (request) => {
            failedRequests.push({ url: request.url(), failure: request.failure()?.errorText ?? null });
          });
          page.on('response', (response) => {
            if (response.status() >= 400) badResponses.push({ status: response.status(), url: response.url() });
          });

          const response = await page.goto(process.env.TARGET_URL, {
            waitUntil: 'domcontentloaded',
            timeout: 60_000,
          });
          await page.waitForTimeout(18_000);
          const state = await page.evaluate(() => ({
            httpTitle: document.title,
            errorVisible: document.body.innerText.includes('Map could not be loaded'),
            unsupportedVisible: document.body.innerText.includes('Map is unavailable in this browser'),
            loadingVisible: document.body.innerText.includes('Loading map...'),
            canvases: document.querySelectorAll('.maplibregl-canvas').length,
            controls: document.querySelectorAll('.maplibregl-ctrl').length,
            webgl1: Boolean(document.createElement('canvas').getContext('webgl')),
            webgl2: Boolean(document.createElement('canvas').getContext('webgl2')),
          }));
          console.log(JSON.stringify({
            navigationStatus: response?.status() ?? null,
            state,
            consoleMessages,
            pageErrors,
            failedRequests,
            badResponses,
          }, null, 2));
          await browser.close();
          NODE
          node /tmp/diagnose-map.mjs
