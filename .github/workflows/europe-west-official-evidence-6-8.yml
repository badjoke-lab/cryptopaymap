name: Europe-west official Evidence batches 6-8

on:
  push:
    branches:
      - ops/europe-west-official-evidence-6-8
    paths:
      - .github/workflows/europe-west-official-evidence-6-8.yml

permissions:
  contents: read

concurrency:
  group: fixed-review-official-evidence-crawl
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Crawl batch 6
        env:
          CPM_OFFICIAL_EVIDENCE_BATCH_IDS: eaf3d4d7-76e8-435e-bc9a-d2cb2988552c
          CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: '250'
        run: |
          summary="$(npx tsx scripts/crawl-official-payment-evidence-batch.ts)"
          jq -e '.target == "fixed-review-staging" and .automaticConfirmedCount == 0 and .candidateStateChanged == false and .evidenceVisibility == "private" and .evidenceReviewStatus == "pending" and .payloadExposed == false' <<<"$summary" >/dev/null
          {
            echo '## Europe-west batch 6'
            echo "- eligible targets before limit: $(jq -r '.eligibleTargetsBeforeLimit' <<<"$summary")"
            echo "- crawled targets: $(jq -r '.targets' <<<"$summary")"
            echo "- explicit official Evidence discovered: $(jq -r '.explicitDiscovered' <<<"$summary")"
            echo "- pending private Evidence created: $(jq -r '.pendingEvidenceCreated' <<<"$summary")"
            echo "- automatic Confirmed: $(jq -r '.automaticConfirmedCount' <<<"$summary")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Crawl batch 7
        env:
          CPM_OFFICIAL_EVIDENCE_BATCH_IDS: 5d664655-8225-414e-b9ba-4c525993d944
          CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: '250'
        run: |
          summary="$(npx tsx scripts/crawl-official-payment-evidence-batch.ts)"
          jq -e '.target == "fixed-review-staging" and .automaticConfirmedCount == 0 and .candidateStateChanged == false and .evidenceVisibility == "private" and .evidenceReviewStatus == "pending" and .payloadExposed == false' <<<"$summary" >/dev/null
          {
            echo '## Europe-west batch 7'
            echo "- eligible targets before limit: $(jq -r '.eligibleTargetsBeforeLimit' <<<"$summary")"
            echo "- crawled targets: $(jq -r '.targets' <<<"$summary")"
            echo "- explicit official Evidence discovered: $(jq -r '.explicitDiscovered' <<<"$summary")"
            echo "- pending private Evidence created: $(jq -r '.pendingEvidenceCreated' <<<"$summary")"
            echo "- automatic Confirmed: $(jq -r '.automaticConfirmedCount' <<<"$summary")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Crawl batch 8
        env:
          CPM_OFFICIAL_EVIDENCE_BATCH_IDS: 99216a90-069f-47d0-804f-dca1116f89dd
          CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: '250'
        run: |
          summary="$(npx tsx scripts/crawl-official-payment-evidence-batch.ts)"
          jq -e '.target == "fixed-review-staging" and .automaticConfirmedCount == 0 and .candidateStateChanged == false and .evidenceVisibility == "private" and .evidenceReviewStatus == "pending" and .payloadExposed == false' <<<"$summary" >/dev/null
          {
            echo '## Europe-west batch 8'
            echo "- eligible targets before limit: $(jq -r '.eligibleTargetsBeforeLimit' <<<"$summary")"
            echo "- crawled targets: $(jq -r '.targets' <<<"$summary")"
            echo "- explicit official Evidence discovered: $(jq -r '.explicitDiscovered' <<<"$summary")"
            echo "- pending private Evidence created: $(jq -r '.pendingEvidenceCreated' <<<"$summary")"
            echo "- automatic Confirmed: $(jq -r '.automaticConfirmedCount' <<<"$summary")"
          } >> "$GITHUB_STEP_SUMMARY"
