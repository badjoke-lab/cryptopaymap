name: OPS-P6-014 configured production candidate bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/ops-p6-014-configured-production-candidate-bootstrap.yml'
      - 'docs/OPS_P6_014_CONFIGURED_PRODUCTION_CANDIDATE_BOOTSTRAP.md'
      - 'scripts/check-ops-p6-014-production-candidate-bootstrap.mjs'
      - 'scripts/run-ops-p6-014-production-candidate-bootstrap.mjs'
      - 'scripts/materialize-production-machine-files.mjs'
      - 'docs/OPS_P6_021_PRODUCTION_MACHINE_READABLE_FILES.md'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter BOOTSTRAP_CONFIGURED_PRODUCTION_CANDIDATE exactly.
        required: true
        type: string
      approved_commit:
        description: Exact 40-character current main commit SHA.
        required: true
        type: string
      bootstrap_owner:
        description: Bounded production candidate bootstrap owner identity.
        required: true
        type: string

permissions:
  contents: write

env:
  PRODUCTION_PROJECT: cryptopaymap-production
  PRODUCTION_BRANCH: main
  PRODUCTION_PLATFORM_HOST: cryptopaymap-production.pages.dev
  LIVE_HOST: cryptopaymap.com

concurrency:
  group: ops-p6-014-configured-production-candidate-bootstrap
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Check production candidate bootstrap contract
        run: node scripts/check-ops-p6-014-production-candidate-bootstrap.mjs

      - name: Run production candidate bootstrap self-test
        run: node scripts/run-ops-p6-014-production-candidate-bootstrap.mjs --self-test

      - name: Run production machine-readable files self-test
        run: node scripts/materialize-production-machine-files.mjs --self-test

  preflight:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      BOOTSTRAP_OWNER: ${{ inputs.bootstrap_owner }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify exact current main
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          current_main_commit="$(git -C source rev-parse origin/main)"
          test "$current_main_commit" = "$APPROVED_COMMIT"

      - name: Recheck exact-source repository contract
        id: repository_contract
        continue-on-error: true
        working-directory: source
        run: |
          npm run check
          node scripts/check-ops-p6-014-production-candidate-bootstrap.mjs
          node scripts/run-ops-p6-014-production-candidate-bootstrap.mjs --self-test
          node scripts/materialize-production-machine-files.mjs --self-test

      - name: Inspect protected production environment before mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const response = await fetch(`https://api.github.com/repos/${repository}/environments/production`, {
            method: 'GET',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (response.status !== 200) {
            console.error(`production_environment_missing_or_inaccessible:${response.status}`);
            process.exit(1);
          }
          const payload = await response.json();
          const protections = Array.isArray(payload?.protection_rules) ? payload.protection_rules : [];
          if (protections.length < 1) {
            console.error('production_environment_unprotected');
            process.exit(1);
          }
          console.log(`Protected production environment observed with ${protections.length} protection rule(s).`);
          NODE

      - name: Prepare deterministic production candidate artifact
        env:
          REPOSITORY_CONTRACT_OUTCOME: ${{ steps.repository_contract.outcome }}
        working-directory: source
        run: |
          node scripts/run-ops-p6-014-production-candidate-bootstrap.mjs \
            prepare \
            ../status \
            ../production-candidate-plan.json

      - name: Stage candidate artifact for protected mutation job
        run: |
          set -euo pipefail
          mv source/dist candidate-dist
          test -f candidate-dist/p6-05-release.json
          test -f candidate-dist/version.json
          test -f candidate-dist/data/manifest.json

      - name: Upload prepared candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-014-prepared-production-candidate
          path: |
            candidate-dist
            production-candidate-plan.json
          if-no-files-found: error
          retention-days: 1

  bootstrap:
    if: github.event_name == 'workflow_dispatch'
    needs: [contract, preflight]
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      P6_08_PRODUCTION_DATABASE_URL: ${{ secrets.P6_08_PRODUCTION_DATABASE_URL }}
      P6_08_PRODUCTION_REVIEW_SECRET_SEED_BASE64URL: ${{ secrets.P6_08_PRODUCTION_REVIEW_SECRET_SEED_BASE64URL }}
      P6_08_PRODUCTION_TURNSTILE_SECRET_KEY: ${{ secrets.P6_08_PRODUCTION_TURNSTILE_SECRET_KEY }}
      P6_08_PRODUCTION_TURNSTILE_SITE_KEY: ${{ secrets.P6_08_PRODUCTION_TURNSTILE_SITE_KEY }}
      P6_08_PRODUCTION_ADMIN_OWNER_SECRET_BASE64URL: ${{ secrets.P6_08_PRODUCTION_ADMIN_OWNER_SECRET_BASE64URL }}
      P6_08_PRODUCTION_ADMIN_OWNER_SUBJECT: ${{ secrets.P6_08_PRODUCTION_ADMIN_OWNER_SUBJECT }}
      P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID: ${{ secrets.P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID }}
    steps:
      - name: Check out exact evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Download prepared candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ops-p6-014-prepared-production-candidate
          path: prepared

      - name: Reverify exact current main immediately before mutation
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          current_main_commit="$(git -C source rev-parse origin/main)"
          test "$current_main_commit" = "$APPROVED_COMMIT"
          test -f prepared/production-candidate-plan.json
          test -f prepared/candidate-dist/p6-05-release.json

      - name: Verify protected production inputs
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            P6_08_PRODUCTION_DATABASE_URL
            P6_08_PRODUCTION_REVIEW_SECRET_SEED_BASE64URL
            P6_08_PRODUCTION_TURNSTILE_SECRET_KEY
            P6_08_PRODUCTION_TURNSTILE_SITE_KEY
            P6_08_PRODUCTION_ADMIN_OWNER_SECRET_BASE64URL
            P6_08_PRODUCTION_ADMIN_OWNER_SUBJECT
            P6_08_PRODUCTION_CREDENTIAL_GENERATION_ID
          )
          for key in "${required[@]}"; do
            test -n "${!key:-}" || { echo "Missing protected production input: $key"; exit 1; }
          done

      - name: Inspect or safely create dedicated production candidate project
        id: project_preflight
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const project = process.env.PRODUCTION_PROJECT;
          const host = process.env.PRODUCTION_PLATFORM_HOST;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/pages/projects/${encodeURIComponent(project)}`, {
            method: 'GET',
            headers: { Authorization: `Bearer ${token}` },
          });
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'project_state=missing\n');
            process.exit(0);
          }
          const body = await response.json().catch(() => null);
          if (!response.ok || body?.success !== true) {
            console.error(`project_lookup_failed:${response.status}`);
            process.exit(1);
          }
          const value = body.result;
          const domains = Array.isArray(value?.domains) ? value.domains.filter((item) => typeof item === 'string') : [];
          const custom = domains.filter((item) => item !== host);
          const safe = value?.name === project && value?.production_branch === 'main' && value?.subdomain === host && custom.length === 0;
          if (!safe) {
            console.error('existing_production_candidate_project_topology_unsafe');
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'project_state=safe_existing\n');
          NODE

      - name: Create dedicated production candidate Pages project when absent
        if: steps.project_preflight.outputs.project_state == 'missing'
        working-directory: source
        run: |
          npx wrangler pages project create "$PRODUCTION_PROJECT" --production-branch "$PRODUCTION_BRANCH"

      - name: Reverify dedicated project topology and do not attach live domain
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const project = process.env.PRODUCTION_PROJECT;
          const host = process.env.PRODUCTION_PLATFORM_HOST;
          const live = process.env.LIVE_HOST;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/pages/projects/${encodeURIComponent(project)}`, {
            method: 'GET',
            headers: { Authorization: `Bearer ${token}` },
          });
          const body = await response.json().catch(() => null);
          if (!response.ok || body?.success !== true) process.exit(1);
          const value = body.result;
          const domains = Array.isArray(value?.domains) ? value.domains.filter((item) => typeof item === 'string') : [];
          const custom = domains.filter((item) => item !== host);
          if (value?.name !== project || value?.production_branch !== 'main' || value?.subdomain !== host) process.exit(1);
          if (custom.length !== 0 || domains.includes(live)) {
            console.error('do not attach live domain');
            process.exit(1);
          }
          NODE

      - name: Prepare bounded production candidate runtime secrets
        working-directory: source
        env:
          CPM_REVIEW_SECRET_SEED_BASE64URL: ${{ secrets.P6_08_PRODUCTION_REVIEW_SECRET_SEED_BASE64URL }}
        run: |
          set -euo pipefail
          trap 'rm -f production-derived-secrets.json ../production-candidate-secrets.json' EXIT
          node scripts/derive-suggest-review-secrets.mjs production-derived-secrets.json
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const derived = JSON.parse(readFileSync('production-derived-secrets.json', 'utf8'));
          for (const value of Object.values(derived)) console.log(`::add-mask::${value}`);
          const {
            CPM_STAGING_ADMIN_REVIEWER_HMAC_KEY_BASE64URL: _reviewerKey,
            CPM_STAGING_ADMIN_PUBLISHER_HMAC_KEY_BASE64URL: _publisherKey,
            ...productionDerived
          } = derived;
          const ownerSubject = process.env.P6_08_PRODUCTION_ADMIN_OWNER_SUBJECT;
          if (typeof ownerSubject !== 'string' || !/^[A-Za-z0-9._:-]{3,100}$/.test(ownerSubject)) {
            throw new Error('invalid_production_owner_subject');
          }
          const ownerActorId = `cryptopaymap-owner:${ownerSubject}`;
          const ownerSubjects = JSON.stringify([ownerSubject]);
          const ownerActorIds = JSON.stringify([ownerActorId]);
          const values = {
            DATABASE_URL: process.env.P6_08_PRODUCTION_DATABASE_URL,
            CPM_REVIEW_SECRET_SEED_BASE64URL: process.env.P6_08_PRODUCTION_REVIEW_SECRET_SEED_BASE64URL,
            ...productionDerived,
            CPM_SUBMISSION_CONTACT_ENCRYPTION_KEY_ID: 'production-v1',
            CPM_SUBMISSION_CONTACT_RETENTION_DAYS: '180',
            CPM_SUBMISSION_RATE_LIMIT_MAX_REQUESTS: '5',
            CPM_SUBMISSION_RATE_LIMIT_WINDOW_SECONDS: '600',
            CPM_TURNSTILE_SECRET_KEY: process.env.P6_08_PRODUCTION_TURNSTILE_SECRET_KEY,
            PUBLIC_TURNSTILE_SITE_KEY: process.env.P6_08_PRODUCTION_TURNSTILE_SITE_KEY,
            CPM_TURNSTILE_EXPECTED_HOSTNAME: 'cryptopaymap.com',
            CPM_TURNSTILE_EXPECTED_ACTION: 'submission_intake',
            PUBLIC_TURNSTILE_ACTION: 'submission_intake',
            CPM_ADMIN_AUTH_MODE: 'owner_session',
            CPM_ADMIN_OWNER_SECRET_BASE64URL: process.env.P6_08_PRODUCTION_ADMIN_OWNER_SECRET_BASE64URL,
            CPM_ADMIN_OWNER_SUBJECT: ownerSubject,
            CPM_ADMIN_OWNER_SESSION_TTL_SECONDS: '14400',
            CPM_ADMIN_CANDIDATE_SUBJECTS: ownerSubjects,
            CPM_ADMIN_CANDIDATE_RESOLVE_SUBJECTS: ownerSubjects,
            CPM_ADMIN_CANDIDATE_PROMOTE_SUBJECTS: ownerSubjects,
            CPM_ADMIN_EVIDENCE_REVIEW_SUBJECTS: ownerSubjects,
            CPM_ADMIN_LOCATION_CORRECT_SUBJECTS: ownerSubjects,
            CPM_ADMIN_RECONFIRMATION_SUBJECTS: ownerSubjects,
            CPM_ADMIN_AUDIT_READ_ACTOR_IDS: ownerActorIds,
            CPM_ADMIN_EXPORT_RELEASE_ACTOR_IDS: ownerActorIds,
            CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS: ownerActorIds,
            CPM_ADMIN_MEDIA_REVIEW_ACTOR_IDS: ownerActorIds,
          };
          for (const [key, value] of Object.entries(values)) {
            if (typeof value !== 'string' || value.length === 0) throw new Error(`missing_runtime_value:${key}`);
          }
          writeFileSync('../production-candidate-secrets.json', `${JSON.stringify(values)}\n`, { mode: 0o600 });
          NODE
          npx wrangler pages secret bulk ../production-candidate-secrets.json \
            --project-name "$PRODUCTION_PROJECT" \
            --env production

      - name: Deploy exact prepared candidate to dedicated Pages project
        working-directory: source
        run: |
          npx wrangler pages deploy ../prepared/candidate-dist \
            --project-name "$PRODUCTION_PROJECT" \
            --branch main

      - name: Verify candidate externally and write bounded receipt
        working-directory: source
        run: |
          node scripts/run-ops-p6-014-production-candidate-bootstrap.mjs \
            verify \
            ../prepared/production-candidate-plan.json \
            ../production-candidate-bootstrap-receipt.json

      - name: Upload bounded production candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-014-configured-production-candidate-bootstrap
          path: production-candidate-bootstrap-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish production candidate receipt to status branch
        if: always()
        run: |
          set -euo pipefail
          test -f production-candidate-bootstrap-receipt.json
          mkdir -p status/config/production-authorization
          cp production-candidate-bootstrap-receipt.json \
            status/config/production-authorization/production-candidate-bootstrap-receipt.json
          git -C status config user.name 'github-actions[bot]'
          git -C status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C status add config/production-authorization/production-candidate-bootstrap-receipt.json
          if ! git -C status diff --cached --quiet; then
            git -C status commit -m 'Record configured production candidate bootstrap receipt'
            git -C status push origin HEAD:staging-review
          fi

      - name: Write production candidate summary
        if: always()
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync } = require('node:fs');
          if (!existsSync('production-candidate-bootstrap-receipt.json')) process.exit(0);
          const receipt = JSON.parse(readFileSync('production-candidate-bootstrap-receipt.json', 'utf8'));
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Configured production candidate bootstrap',
              '',
              `- State: \`${receipt.state}\``,
              `- Commit: \`${receipt.commit}\``,
              `- Dedicated project: \`${process.env.PRODUCTION_PROJECT}\``,
              `- Live domain mutation: \`${receipt.checks.liveDomainMutation}\``,
              `- DNS mutation: \`${receipt.checks.dnsMutation}\``,
              `- Candidate artifact: \`${receipt.candidateArtifactId}\``,
              '',
            ].join('\n'),
          );
          NODE

      - name: Enforce accepted candidate without live-domain mutation
        if: always()
        run: |
          node -e "const r=require('./production-candidate-bootstrap-receipt.json'); if(r.state!=='accepted'||r.checks.liveDomainMutation!==false||r.checks.dnsMutation!==false||r.checks.canonicalHostMutation!==false) process.exit(1)"
