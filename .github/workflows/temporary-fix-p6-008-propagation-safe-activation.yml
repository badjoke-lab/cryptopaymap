name: Temporary fix P6-008 propagation-safe activation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-fix-p6-008-propagation-safe-activation.yml'

permissions:
  contents: write

concurrency:
  group: temporary-fix-p6-008-propagation-safe-activation
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FIX-P6-008 branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-p6-008-propagation-safe-activation

      - name: Patch P6-05 activation convergence
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs')
          text = script_path.read_text()

          rollback_marker = """async function rollbackTo(deploymentId) {
            return cloudflareRequest(`/deployments/${deploymentId}/rollback`, { method: 'POST' });
          }
          """
          helpers = """async function rollbackTo(deploymentId) {
            return cloudflareRequest(`/deployments/${deploymentId}/rollback`, { method: 'POST' });
          }

          async function markerVisible(baseUrl, expectedReleaseId, attempts = 5) {
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              const marker = await fetchMarker(baseUrl);
              if (marker?.releaseId === expectedReleaseId) return true;
              await sleep(1_000);
            }
            return false;
          }

          async function activateRelease(
            deploymentId,
            expectedReleaseId,
            {
              markerVisibleImpl = markerVisible,
              rollbackImpl = rollbackTo,
              waitForMarkerImpl = waitForMarker,
            } = {},
          ) {
            if (await markerVisibleImpl(productionBaseUrl, expectedReleaseId, 5)) {
              return { status: 'passed', mode: 'already_visible' };
            }
            try {
              await rollbackImpl(deploymentId);
            } catch (error) {
              const errorClass = safeException(error);
              if (
                errorClass === 'cloudflare_api_400_8000039' &&
                (await markerVisibleImpl(productionBaseUrl, expectedReleaseId, 10))
              ) {
                return { status: 'passed', mode: 'race_converged' };
              }
              throw error;
            }
            await waitForMarkerImpl(productionBaseUrl, expectedReleaseId);
            return { status: 'passed', mode: 'rollback' };
          }
          """
          if text.count(rollback_marker) != 1:
            raise SystemExit(f'rollback helper marker mismatch: {text.count(rollback_marker)}')
          text = text.replace(rollback_marker, helpers)

          activation_old = """      const activeBefore = await fetchMarker(productionBaseUrl);
                if (activeBefore?.releaseId !== candidateMarker.releaseId) {
                  await rollbackTo(candidate.deployment.id);
                }
                await waitForMarker(productionBaseUrl, candidateMarker.releaseId);
                checks.activation = { status: 'passed', candidateVisible: true };"""
          activation_new = """      const candidateActivation = await activateRelease(
                  candidate.deployment.id,
                  candidateMarker.releaseId,
                );
                checks.activation = {
                  status: 'passed',
                  candidateVisible: true,
                  mode: candidateActivation.mode,
                };"""
          if text.count(activation_old) != 1:
            raise SystemExit(f'candidate activation marker mismatch: {text.count(activation_old)}')
          text = text.replace(activation_old, activation_new)

          rollback_old = """      await rollbackTo(baseline.deployment.id);
                await waitForMarker(productionBaseUrl, baselineMarker.releaseId);
                checks.rollback = { status: 'running', baselineVisible: true, candidateRestored: false };

                await rollbackTo(candidate.deployment.id);
                await waitForMarker(productionBaseUrl, candidateMarker.releaseId);
                checks.rollback = { status: 'passed', baselineVisible: true, candidateRestored: true };"""
          rollback_new = """      const baselineActivation = await activateRelease(
                  baseline.deployment.id,
                  baselineMarker.releaseId,
                );
                checks.rollback = {
                  status: 'running',
                  baselineVisible: true,
                  candidateRestored: false,
                  baselineMode: baselineActivation.mode,
                  candidateRestoreMode: null,
                };

                const candidateRestoration = await activateRelease(
                  candidate.deployment.id,
                  candidateMarker.releaseId,
                );
                checks.rollback = {
                  status: 'passed',
                  baselineVisible: true,
                  candidateRestored: true,
                  baselineMode: baselineActivation.mode,
                  candidateRestoreMode: candidateRestoration.mode,
                };"""
          if text.count(rollback_old) != 1:
            raise SystemExit(f'rollback sequence marker mismatch: {text.count(rollback_old)}')
          text = text.replace(rollback_old, rollback_new)

          self_test_marker = """    if (extraDomainTopology.status !== 'failed') {
              throw new Error('extra_custom_domain_not_rejected');
            }

            console.log('OPS-P6-001I configured staging public export/release self-test passed.');"""
          self_test_new = """    if (extraDomainTopology.status !== 'failed') {
              throw new Error('extra_custom_domain_not_rejected');
            }

            let rollbackCalls = 0;
            let waitCalls = 0;
            const alreadyVisible = await activateRelease('already-visible', candidate.releaseId, {
              markerVisibleImpl: async () => true,
              rollbackImpl: async () => {
                rollbackCalls += 1;
              },
              waitForMarkerImpl: async () => {
                waitCalls += 1;
              },
            });
            if (alreadyVisible.mode !== 'already_visible' || rollbackCalls !== 0 || waitCalls !== 0) {
              throw new Error('already_visible_activation_failed');
            }

            const normalRollback = await activateRelease('normal-rollback', candidate.releaseId, {
              markerVisibleImpl: async () => false,
              rollbackImpl: async () => {
                rollbackCalls += 1;
              },
              waitForMarkerImpl: async () => {
                waitCalls += 1;
              },
            });
            if (normalRollback.mode !== 'rollback' || rollbackCalls !== 1 || waitCalls !== 1) {
              throw new Error('normal_rollback_activation_failed');
            }

            let raceChecks = 0;
            const raceConverged = await activateRelease('race-converged', candidate.releaseId, {
              markerVisibleImpl: async () => {
                raceChecks += 1;
                return raceChecks > 1;
              },
              rollbackImpl: async () => {
                throw new Error('cloudflare_api_400_8000039');
              },
              waitForMarkerImpl: async () => {
                throw new Error('race_convergence_must_not_wait_after_marker');
              },
            });
            if (raceConverged.mode !== 'race_converged' || raceChecks !== 2) {
              throw new Error('race_converged_activation_failed');
            }

            let rejected = false;
            try {
              await activateRelease('race-rejected', candidate.releaseId, {
                markerVisibleImpl: async () => false,
                rollbackImpl: async () => {
                  throw new Error('cloudflare_api_400_8000039');
                },
                waitForMarkerImpl: async () => {},
              });
            } catch (error) {
              rejected = safeException(error) === 'cloudflare_api_400_8000039';
            }
            if (!rejected) throw new Error('unconverged_8000039_not_rejected');

            console.log('OPS-P6-001I configured staging public export/release self-test passed.');"""
          if text.count(self_test_marker) != 1:
            raise SystemExit(f'self-test marker mismatch: {text.count(self_test_marker)}')
          text = text.replace(self_test_marker, self_test_new)
          script_path.write_text(text)

          checker_path = Path('scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs')
          checker = checker_path.read_text()
          expectation_anchor = """  [files.executor, 'cloudflareRequest(`/deployments/${deploymentId}/rollback`'],"""
          expectation_new = """  [files.executor, 'cloudflareRequest(`/deployments/${deploymentId}/rollback`'],
            [files.executor, 'async function markerVisible(baseUrl, expectedReleaseId, attempts = 5)'],
            [files.executor, 'async function activateRelease('],
            [files.executor, "mode: 'already_visible'"],
            [files.executor, "mode: 'race_converged'"],
            [files.executor, "mode: 'rollback'"],
            [files.executor, "errorClass === 'cloudflare_api_400_8000039'"],
            [files.executor, 'const candidateActivation = await activateRelease('],
            [files.executor, 'const baselineActivation = await activateRelease('],
            [files.executor, 'const candidateRestoration = await activateRelease('],"""
          if checker.count(expectation_anchor) != 1:
            raise SystemExit(f'checker expectation anchor mismatch: {checker.count(expectation_anchor)}')
          checker = checker.replace(expectation_anchor, expectation_new)
          final_anchor = """if (/['\"]cryptopaymap\\.com['\"]/.test(files.executor)) {"""
          new_checks = """if (!files.executor.includes("throw new Error('unconverged_8000039_not_rejected')")) {
            throw new Error('OPS-P6-001I must reject 8000039 without exact-marker convergence.');
          }
          if (!files.executor.includes("alreadyVisible.mode !== 'already_visible'")) {
            throw new Error('OPS-P6-001I self-test must cover already-visible activation.');
          }
          if (!files.executor.includes("normalRollback.mode !== 'rollback'")) {
            throw new Error('OPS-P6-001I self-test must cover normal rollback activation.');
          }
          if (!files.executor.includes("raceConverged.mode !== 'race_converged'")) {
            throw new Error('OPS-P6-001I self-test must cover propagation-race convergence.');
          }

          if (/['\"]cryptopaymap\\.com['\"]/.test(files.executor)) {"""
          if checker.count(final_anchor) != 1:
            raise SystemExit(f'checker final anchor mismatch: {checker.count(final_anchor)}')
          checker_path.write_text(checker.replace(final_anchor, new_checks))

          docs_path = Path('docs/OPS_P6_001I_CONFIGURED_STAGING_P6_05_PUBLIC_EXPORT_RELEASE.md')
          docs = docs_path.read_text()
          sequence_anchor = """11. Leave the exact candidate active for the P6-06 handoff.

          Cloudflare Pages rollback is used only with successful production deployments. Preview deployments are never rollback targets."""
          sequence_new = """11. Leave the exact candidate active for the P6-06 handoff.

          Before each activation or rollback call, the executor polls for the exact target release marker. If the target is already externally visible, no rollback request is sent. If Cloudflare returns `400 / 8000039`, the executor accepts the operation only when a bounded recheck proves that the exact requested release marker became active; otherwise the original failure is preserved. This handles control-plane and public-marker propagation races without accepting a wrong release.

          Cloudflare Pages rollback is used only with successful production deployments. Preview deployments are never rollback targets."""
          if docs.count(sequence_anchor) != 1:
            raise SystemExit(f'docs sequence anchor mismatch: {docs.count(sequence_anchor)}')
          docs_path.write_text(docs.replace(sequence_anchor, sequence_new))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format and verify FIX-P6-008
        run: |
          npm run format
          npm run check
          node scripts/check-p6-05-configured-public-export-release-evidence.js
          node scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs
          node scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs --self-test

      - name: Publish implementation without modifying workflow files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs \
            scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs \
            docs/OPS_P6_001I_CONFIGURED_STAGING_P6_05_PUBLIC_EXPORT_RELEASE.md
          git commit -m 'Make P6-05 deployment activation propagation-safe'
          git push origin HEAD:agent/fix-p6-008-propagation-safe-activation
