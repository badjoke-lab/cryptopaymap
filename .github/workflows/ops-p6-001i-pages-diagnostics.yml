name: OPS-P6-001I Pages release topology

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001i-pages-diagnostics.yml'

permissions:
  contents: write

concurrency:
  group: ops-p6-001i-pages-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPROVED_COMMIT: 91c61ee4198079b9f97e1e022a97c6d7342134f2
      PROJECT_NAME: cryptopaymap-staging
      DIAGNOSTIC_BRANCH: agent/ops-p6-001i-pages-diagnostics
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001i-pages-diagnostics

      - name: Verify exact main and credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$APPROVED_COMMIT"

      - name: Read project and deployment topology
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME"
          curl --fail-with-body --silent --show-error --header "$auth" "$base" > project.json
          curl --fail-with-body --silent --show-error --header "$auth" "$base/deployments" > all.json
          curl --fail-with-body --silent --show-error --header "$auth" "$base/deployments?env=production" > production.json
          curl --fail-with-body --silent --show-error --header "$auth" "$base/deployments?env=preview" > preview.json

      - name: Produce bounded topology diagnostic
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, writeFileSync } = require('node:fs');
          const envelope = (path) => {
            const value = JSON.parse(readFileSync(path, 'utf8'));
            if (value.success !== true) throw new Error(`${path} API request failed`);
            return value;
          };
          const project = envelope('project.json').result ?? {};
          const allEnvelope = envelope('all.json');
          const productionEnvelope = envelope('production.json');
          const previewEnvelope = envelope('preview.json');
          const all = Array.isArray(allEnvelope.result) ? allEnvelope.result : [];
          const production = Array.isArray(productionEnvelope.result) ? productionEnvelope.result : [];
          const preview = Array.isArray(previewEnvelope.result) ? previewEnvelope.result : [];
          const hash = (value) =>
            value == null
              ? null
              : `sha256:${createHash('sha256').update(String(value)).digest('hex')}`;
          const branchOf = (deployment) => deployment?.deployment_trigger?.metadata?.branch ?? null;
          const commitOf = (deployment) => deployment?.deployment_trigger?.metadata?.commit_hash ?? null;
          const statusOf = (deployment) => deployment?.latest_stage?.status ?? null;
          const summarize = (deployment) =>
            deployment
              ? {
                  id: hash(deployment.id),
                  environment: deployment.environment ?? null,
                  branch: branchOf(deployment),
                  commit: hash(commitOf(deployment)),
                  status: statusOf(deployment),
                  createdOn: deployment.created_on ?? null,
                  aliases: Array.isArray(deployment.aliases) ? deployment.aliases.length : 0,
                }
              : null;
          const successfulProduction = production.filter((item) => statusOf(item) === 'success');
          const successfulPreview = preview.filter((item) => statusOf(item) === 'success');
          const canonical = project.canonical_deployment ?? null;
          const currentProduction = successfulProduction[0] ?? canonical;
          const currentReview = successfulPreview.find((item) => branchOf(item) === 'review') ?? null;
          const priorProduction = successfulProduction.filter(
            (item) => currentProduction == null || item.id !== currentProduction.id,
          );
          const diagnostic = {
            version: 1,
            projectName: project.name ?? process.env.PROJECT_NAME,
            productionBranch:
              project.production_branch ?? project.source?.config?.production_branch ?? null,
            pagesSubdomainPresent: typeof project.subdomain === 'string' && project.subdomain.length > 0,
            apiPageInfo: {
              all: allEnvelope.result_info ?? null,
              production: productionEnvelope.result_info ?? null,
              preview: previewEnvelope.result_info ?? null,
            },
            deploymentCountsOnReturnedPages: {
              all: all.length,
              production: production.length,
              preview: preview.length,
              successfulProduction: successfulProduction.length,
              successfulPreview: successfulPreview.length,
              successfulReviewPreview: successfulPreview.filter((item) => branchOf(item) === 'review').length,
            },
            canonicalDeployment: summarize(canonical),
            currentProduction: summarize(currentProduction),
            currentReviewPreview: summarize(currentReview),
            rollback: {
              priorSuccessfulProductionCountOnReturnedPage: priorProduction.length,
              hasRollbackTargetOnReturnedPage: priorProduction.length > 0,
              targetIds: priorProduction.slice(0, 5).map((item) => hash(item.id)),
            },
            conclusions: {
              reviewIsPreview: currentReview?.environment === 'preview',
              productionDeploymentExists: currentProduction !== null,
              productionBranchMatchesReview:
                (project.production_branch ?? project.source?.config?.production_branch ?? null) === 'review',
              isolatedProductionStyleTargetRequired:
                currentProduction === null ||
                (project.production_branch ?? project.source?.config?.production_branch ?? null) === 'review',
            },
          };
          writeFileSync('p6-05-pages-topology.json', `${JSON.stringify(diagnostic, null, 2)}\n`);
          console.log(JSON.stringify(diagnostic, null, 2));
          NODE

      - name: Upload bounded topology diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-001i-pages-topology
          path: p6-05-pages-topology.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-time diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ops-p6-001i-pages-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ops-p6-001i-pages-diagnostics.yml
          if ! git diff --cached --quiet; then
            git commit -m 'OPS-P6-001I remove one-time Pages topology diagnostic'
            git push origin HEAD:"$DIAGNOSTIC_BRANCH"
          fi
