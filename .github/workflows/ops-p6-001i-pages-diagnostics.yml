name: OPS-P6-001I Pages release diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001i-pages-diagnostics.yml'

permissions:
  contents: write

concurrency:
  group: ops-p6-001i-pages-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPROVED_COMMIT: 91c61ee4198079b9f97e1e022a97c6d7342134f2
      PROJECT_NAME: cryptopaymap-staging
      DIAGNOSTIC_BRANCH: agent/ops-p6-001i-pages-diagnostics
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001i-pages-diagnostics

      - name: Verify exact main and configured credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$APPROVED_COMMIT"

      - name: Read Cloudflare Pages project and deployment inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            "$base" > pages-project.json
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            "$base/deployments?per_page=50" > pages-deployments.json

      - name: Produce bounded diagnostic
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, writeFileSync } = require('node:fs');
          const projectEnvelope = JSON.parse(readFileSync('pages-project.json', 'utf8'));
          const deploymentsEnvelope = JSON.parse(readFileSync('pages-deployments.json', 'utf8'));
          if (projectEnvelope.success !== true || deploymentsEnvelope.success !== true) {
            throw new Error('Cloudflare Pages diagnostics API request failed.');
          }
          const project = projectEnvelope.result ?? {};
          const deployments = Array.isArray(deploymentsEnvelope.result)
            ? deploymentsEnvelope.result
            : [];
          const hash = (value) =>
            value == null
              ? null
              : `sha256:${createHash('sha256').update(String(value)).digest('hex')}`;
          const branchOf = (deployment) =>
            deployment?.deployment_trigger?.metadata?.branch ??
            deployment?.source?.config?.production_branch ??
            null;
          const statusOf = (deployment) => deployment?.latest_stage?.status ?? null;
          const successful = deployments.filter((item) => statusOf(item) === 'success');
          const production = successful.filter((item) => item.environment === 'production');
          const preview = successful.filter((item) => item.environment === 'preview');
          const currentProduction = production[0] ?? null;
          const currentReview = preview.find((item) => branchOf(item) === 'review') ?? null;
          const priorProduction = production.filter(
            (item) => currentProduction === null || item.id !== currentProduction.id,
          );
          const diagnostic = {
            version: 1,
            projectName: project.name ?? process.env.PROJECT_NAME,
            productionBranch: project.production_branch ?? project.source?.config?.production_branch ?? null,
            deploymentCounts: {
              total: deployments.length,
              successful: successful.length,
              production: production.length,
              preview: preview.length,
              successfulReviewPreview: preview.filter((item) => branchOf(item) === 'review').length,
            },
            currentProduction: currentProduction
              ? {
                  id: hash(currentProduction.id),
                  branch: branchOf(currentProduction),
                  environment: currentProduction.environment,
                  status: statusOf(currentProduction),
                  createdOn: currentProduction.created_on ?? null,
                  aliasCount: Array.isArray(currentProduction.aliases)
                    ? currentProduction.aliases.length
                    : 0,
                }
              : null,
            currentReviewPreview: currentReview
              ? {
                  id: hash(currentReview.id),
                  branch: branchOf(currentReview),
                  environment: currentReview.environment,
                  status: statusOf(currentReview),
                  createdOn: currentReview.created_on ?? null,
                  aliasCount: Array.isArray(currentReview.aliases) ? currentReview.aliases.length : 0,
                }
              : null,
            rollback: {
              priorSuccessfulProductionCount: priorProduction.length,
              hasRollbackTarget: priorProduction.length > 0,
              targetIds: priorProduction.slice(0, 5).map((item) => hash(item.id)),
            },
            conclusions: {
              reviewIsPreview: currentReview?.environment === 'preview',
              productionTargetExists: currentProduction !== null,
              isolatedProductionStyleTargetRequired:
                currentProduction === null || branchOf(currentProduction) === 'review',
            },
          };
          writeFileSync('p6-05-pages-diagnostic.json', `${JSON.stringify(diagnostic, null, 2)}\n`);
          console.log(JSON.stringify(diagnostic, null, 2));
          NODE

      - name: Upload bounded diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-001i-pages-release-diagnostic
          path: p6-05-pages-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-time diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ops-p6-001i-pages-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ops-p6-001i-pages-diagnostics.yml
          if ! git diff --cached --quiet; then
            git commit -m 'OPS-P6-001I remove one-time Pages diagnostics'
            git push origin HEAD:"$DIAGNOSTIC_BRANCH"
          fi
