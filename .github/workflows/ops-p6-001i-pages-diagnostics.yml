name: OPS-P6-001I Pages API diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001i-pages-diagnostics.yml'

permissions:
  contents: write

concurrency:
  group: ops-p6-001i-pages-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPROVED_COMMIT: 91c61ee4198079b9f97e1e022a97c6d7342134f2
      PROJECT_NAME: cryptopaymap-staging
      DIAGNOSTIC_BRANCH: agent/ops-p6-001i-pages-diagnostics
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001i-pages-diagnostics

      - name: Verify exact main and credential shapes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$APPROVED_COMMIT"
          ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" TOKEN="$CLOUDFLARE_API_TOKEN" node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const account = process.env.ACCOUNT_ID ?? '';
          const token = process.env.TOKEN ?? '';
          writeFileSync(
            'credential-shape.json',
            `${JSON.stringify({
              accountIdLength: account.length,
              accountIdHex32: /^[a-f0-9]{32}$/i.test(account),
              accountIdHasWhitespace: /\s/.test(account),
              tokenLengthBucket:
                token.length < 20 ? 'lt20' : token.length < 40 ? '20to39' : token.length < 80 ? '40to79' : 'ge80',
              tokenHasWhitespace: /\s/.test(token),
            }, null, 2)}\n`,
          );
          NODE

      - name: Probe Cloudflare API endpoints without mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          account_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          project_base="$account_base/pages/projects/$PROJECT_NAME"

          probe() {
            name="$1"
            url="$2"
            code="$(curl --silent --show-error \
              --output "$name.json" \
              --write-out '%{http_code}' \
              --header "$auth" \
              --header 'Content-Type: application/json' \
              "$url")"
            printf '%s' "$code" > "$name.status"
          }

          probe token_verify 'https://api.cloudflare.com/client/v4/user/tokens/verify'
          probe account "$account_base"
          probe project "$project_base"
          probe deployments "$project_base/deployments?per_page=50"

      - name: Produce safe API diagnostic
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const credentialShape = JSON.parse(readFileSync('credential-shape.json', 'utf8'));
          const names = ['token_verify', 'account', 'project', 'deployments'];
          const probes = {};
          for (const name of names) {
            const httpStatus = Number(readFileSync(`${name}.status`, 'utf8'));
            let body = null;
            try {
              body = JSON.parse(readFileSync(`${name}.json`, 'utf8'));
            } catch {}
            probes[name] = {
              httpStatus,
              success: body?.success === true,
              errorCodes: Array.isArray(body?.errors)
                ? body.errors
                    .map((error) => Number(error?.code))
                    .filter((code) => Number.isFinite(code))
                    .slice(0, 10)
                : [],
              resultPresent: body != null && Object.hasOwn(body, 'result'),
            };
          }
          const diagnostic = { version: 1, credentialShape, probes };
          writeFileSync('p6-05-pages-api-diagnostic.json', `${JSON.stringify(diagnostic, null, 2)}\n`);
          console.log(JSON.stringify(diagnostic, null, 2));
          NODE

      - name: Upload safe API diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-001i-pages-api-diagnostic
          path: p6-05-pages-api-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-time diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ops-p6-001i-pages-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ops-p6-001i-pages-diagnostics.yml
          if ! git diff --cached --quiet; then
            git commit -m 'OPS-P6-001I remove one-time Pages API diagnostics'
            git push origin HEAD:"$DIAGNOSTIC_BRANCH"
          fi
