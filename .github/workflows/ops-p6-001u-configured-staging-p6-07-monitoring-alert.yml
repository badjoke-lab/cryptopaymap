name: OPS-P6-001U configured staging P6-07 monitoring and alert evidence

on:
  pull_request:
    paths:
      - '.github/workflows/ops-p6-001u-configured-staging-p6-07-monitoring-alert.yml'
      - 'docs/OPS_P6_001U_CONFIGURED_STAGING_P6_07_MONITORING_ALERT.md'
      - 'docs/P6_07_CONFIGURED_OPERATIONAL_MONITORING_BACKUP_RESTORE_INCIDENT_EVIDENCE.md'
      - 'scripts/run-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs'
      - 'scripts/check-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs'
      - 'scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001u-configured-staging-p6-07-monitoring-alert.yml'
      - 'docs/OPS_P6_001U_CONFIGURED_STAGING_P6_07_MONITORING_ALERT.md'
      - 'docs/P6_07_CONFIGURED_OPERATIONAL_MONITORING_BACKUP_RESTORE_INCIDENT_EVIDENCE.md'
      - 'scripts/run-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs'
      - 'scripts/check-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs'
      - 'scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter EXECUTE_CONFIGURED_STAGING_P6_07_Q2 exactly.
        required: true
        type: string
      approved_commit:
        description: Exact 40-character current main commit SHA.
        required: true
        type: string
      monitoring_owner:
        description: Bounded configured-staging monitoring owner identity.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ops-p6-001u-configured-staging-p6-07-monitoring-alert
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Check repository P6-07 evidence contract
        run: node scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js

      - name: Check P6-07 monitoring and alert contract
        run: node scripts/check-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs

      - name: Run P6-07 monitoring and alert self-test
        run: node scripts/run-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs --self-test

  execute:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      MONITORING_OWNER: ${{ inputs.monitoring_owner }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify exact current main
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          current_main_commit="$(git -C source rev-parse origin/main)"
          test "$current_main_commit" = "$APPROVED_COMMIT"

      - name: Recheck exact-source repository contract
        id: repository_contract
        continue-on-error: true
        working-directory: source
        run: |
          npm run check
          node scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js
          node scripts/check-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs
          node scripts/run-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs --self-test

      - name: Verify configured staging monitoring and pre-delivered alert evidence
        env:
          REPOSITORY_CONTRACT_OUTCOME: ${{ steps.repository_contract.outcome }}
        working-directory: source
        run: |
          node scripts/run-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs \
            ../status \
            ../p6-07-monitoring-alert-receipt.json

      - name: Upload bounded P6-07 monitoring and alert receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-001u-configured-staging-p6-07-monitoring-alert
          path: p6-07-monitoring-alert-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish P6-07 monitoring and alert receipt
        if: always()
        run: |
          set -euo pipefail
          test -f p6-07-monitoring-alert-receipt.json
          mkdir -p status/config/staging-authorization
          cp p6-07-monitoring-alert-receipt.json \
            status/config/staging-authorization/p6-07-monitoring-alert-receipt.json
          git -C status config user.name 'github-actions[bot]'
          git -C status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C status add config/staging-authorization/p6-07-monitoring-alert-receipt.json
          if ! git -C status diff --cached --quiet; then
            git -C status commit -m 'Record configured staging P6-07 monitoring and alert evidence'
            git -C status push origin HEAD:staging-review
          fi

      - name: Write P6-07 monitoring and alert summary
        if: always()
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync } = require('node:fs');
          if (!existsSync('p6-07-monitoring-alert-receipt.json')) process.exit(0);
          const receipt = JSON.parse(readFileSync('p6-07-monitoring-alert-receipt.json', 'utf8'));
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Configured staging P6-07 monitoring and alert evidence',
              '',
              `- State: \`${receipt.state}\``,
              `- Commit: \`${receipt.commit}\``,
              `- Prerequisite: \`${receipt.checks.prerequisite.state}\``,
              `- Live monitoring: \`${receipt.checks.liveMonitoring.status}\``,
              `- Synthetic failures: \`${receipt.checks.syntheticFailures.status}\``,
              `- Alert exercise: \`${receipt.checks.alertExercise.status}\``,
              `- Duplicate convergence: \`${receipt.checks.alertExercise.wrongRelease?.deduplicated ?? false}\``,
              `- Escalation deadline missed: \`${receipt.checks.alertExercise.blindState?.deadlineMissed ?? false}\``,
              `- Exceptions: ${receipt.exceptions.length === 0 ? 'none' : receipt.exceptions.map((value) => `\`${value}\``).join(', ')}`,
              '',
            ].join('\n'),
          );
          NODE

      - name: Enforce accepted monitoring and alert receipt
        if: always()
        run: |
          node -e "const r=require('./p6-07-monitoring-alert-receipt.json'); if(r.state!=='accepted'||r.exceptions.length!==0) process.exit(1)"
