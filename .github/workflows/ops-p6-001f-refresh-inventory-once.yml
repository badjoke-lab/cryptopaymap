name: OPS-P6-001F refresh exact-main inventory once

on:
  push:
    branches:
      - agent/ops-p6-001f-run-exact-main-evidence
    paths:
      - '.github/workflows/ops-p6-001f-refresh-inventory-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      APPROVED_COMMIT: 09c2e377fcfbd65273497bfb2297a7543361fd15
      CONFIRMATION: AUTHORIZE_CONFIGURED_STAGING
      LAUNCH_OWNER: inventory:badjoke-lab
      OBSERVER: inventory:independent-observer
      ROLLBACK_OWNER: inventory:rollback-owner
      EVALUATION_MODE: inventory
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out exact main source
        uses: actions/checkout@v4
        with:
          ref: 09c2e377fcfbd65273497bfb2297a7543361fd15
          path: source

      - name: Check out retained status
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Evaluate exact-main inventory
        run: |
          node source/scripts/evaluate-ops-p6-001c-staging-authorization.mjs \
            status \
            configured-staging-authorization-receipt.json

      - name: Publish refreshed inventory
        run: |
          set -euo pipefail
          cp configured-staging-authorization-receipt.json \
            status/config/staging-authorization/authorization-receipt.json
          git -C status config user.name 'github-actions[bot]'
          git -C status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C status add config/staging-authorization/authorization-receipt.json
          git -C status commit -m 'Refresh configured staging authorization inventory'
          git -C status push origin HEAD:staging-review
