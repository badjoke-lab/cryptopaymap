name: Temporary fix OPS-P6-001R self-test

on:
  push:
    branches:
      - agent/ops-p6-001r-p6-06-continuity-revalidation
    paths:
      - '.github/workflows/temporary-fix-ops-p6-001r-self-test.yml'

permissions:
  contents: write

concurrency:
  group: temporary-fix-ops-p6-001r-self-test
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001r-p6-06-continuity-revalidation

      - name: Replace invalid fixture bindings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs')
          text = path.read_text()
          old_current = """  const binding = Object.fromEntries(\n    bindingKeys.map((key) => [key, `sha256:${key.padEnd(64, 'c').slice(0, 64)}`]),\n  );"""
          new_current = """  const binding = {\n    releaseId: `sha256:${'1'.repeat(64)}`,\n    dataSnapshotId: `sha256:${'2'.repeat(64)}`,\n    configurationId: `sha256:${'3'.repeat(64)}`,\n    environmentId: `sha256:${'4'.repeat(64)}`,\n  };"""
          old_prior = """      binding: Object.fromEntries(\n        bindingKeys.map((key) => [key, `sha256:${key.padEnd(64, 'd').slice(0, 64)}`]),\n      ),"""
          new_prior = """      binding: {\n        releaseId: `sha256:${'5'.repeat(64)}`,\n        dataSnapshotId: `sha256:${'6'.repeat(64)}`,\n        configurationId: `sha256:${'7'.repeat(64)}`,\n        environmentId: `sha256:${'8'.repeat(64)}`,\n      },"""
          if text.count(old_current) != 1:
              raise SystemExit('current fixture binding marker mismatch')
          if text.count(old_prior) != 1:
              raise SystemExit('prior fixture binding marker mismatch')
          path.write_text(text.replace(old_current, new_current).replace(old_prior, new_prior))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format and verify self-test
        run: |
          npm run format
          node scripts/check-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs
          node scripts/run-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs --self-test

      - name: Remove one-time patch and publish fix
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-fix-ops-p6-001r-self-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix OPS-P6-001R self-test bindings'
          git push origin HEAD:agent/ops-p6-001r-p6-06-continuity-revalidation
