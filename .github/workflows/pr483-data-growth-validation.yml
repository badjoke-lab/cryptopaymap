name: PR483 data growth validation

on:
  push:
    branches:
      - fix/connect-reviewed-real-data-export

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Biome formatting
        run: npx biome check --write scripts/promote-confirm-official-evidence-batch.ts .github/workflows/promote-confirm-official-evidence-staging.yml
      - name: Commit formatter output when needed
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add scripts/promote-confirm-official-evidence-batch.ts .github/workflows/promote-confirm-official-evidence-staging.yml
            git commit -m "STYLE: format batch real-data promotion"
            git push
          fi
      - run: npx tsc --noEmit --pretty false
