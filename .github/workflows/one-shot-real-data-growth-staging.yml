name: One-shot real-data growth staging

on:
  push:
    branches:
      - fix/auto-select-official-evidence-batch
    paths:
      - .github/workflows/one-shot-real-data-growth-staging.yml

permissions:
  contents: read

concurrency:
  group: one-shot-real-data-growth-staging
  cancel-in-progress: false

jobs:
  grow-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check before staging mutation
        run: npx tsc --noEmit --pretty false

      - name: Auto-select and promote up to 50 strict official-Evidence Candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_ADMIN_CANDIDATE_PROMOTE_SUBJECTS: ${{ secrets.CPM_ADMIN_CANDIDATE_PROMOTE_SUBJECTS }}
          CPM_ADMIN_EVIDENCE_REVIEW_SUBJECTS: ${{ secrets.CPM_ADMIN_EVIDENCE_REVIEW_SUBJECTS }}
          CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: '50'
        run: npx tsx scripts/promote-confirm-next-official-evidence-batch.ts

      - name: Publish reviewed canonical staging records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS: ${{ secrets.CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS }}
        run: npx tsx scripts/publish-reviewed-physical-canonical-staging.ts

      - name: Materialize public data from staging DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/materialize-public-data-from-staging-db.ts

      - name: Build staging site
        run: npm run build

      - name: Prepare review artifact
        run: node scripts/prepare-staging-review-artifact.mjs

      - name: Deploy staging review to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name cryptopaymap-staging
          --branch review
