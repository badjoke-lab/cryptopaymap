name: Europe-west official Evidence batches 6-10

on:
  push:
    branches:
      - ops/europe-west-official-evidence-6-10
    paths:
      - .github/workflows/europe-west-official-evidence-6-10.yml

concurrency:
  group: fixed-review-official-evidence-crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Crawl batches 6-10 sequentially
        shell: bash
        run: |
          set -euo pipefail
          batches=(
            eaf3d4d7-76e8-435e-bc9a-d2cb2988552c
            5d664655-8225-414e-b9ba-4c525993d944
            99216a90-069f-47d0-804f-dca1116f89dd
            312d3526-3438-47c5-8351-5c2fc242d3c6
            20983068-031d-492b-ac0c-b9a0d93a5e70
          )
          index=6
          for batch in "${batches[@]}"; do
            export CPM_OFFICIAL_EVIDENCE_BATCH_IDS="$batch"
            export CPM_OFFICIAL_EVIDENCE_MAX_TARGETS='250'
            summary="$(npx tsx scripts/crawl-official-payment-evidence-batch.ts)"
            jq -e '.target == "fixed-review-staging" and .automaticConfirmedCount == 0 and .candidateStateChanged == false and .evidenceVisibility == "private" and .evidenceReviewStatus == "pending" and .payloadExposed == false' <<<"$summary" >/dev/null
            {
              echo "## Europe-west batch $index"
              echo "- eligible targets before limit: $(jq -r '.eligibleTargetsBeforeLimit' <<<"$summary")"
              echo "- crawled targets: $(jq -r '.targets' <<<"$summary")"
              echo "- landing pages fetched: $(jq -r '.landingPagesFetched' <<<"$summary")"
              echo "- internal pages fetched: $(jq -r '.internalPagesFetched' <<<"$summary")"
              echo "- explicit official Evidence discovered: $(jq -r '.explicitDiscovered' <<<"$summary")"
              echo "- pending private Evidence created: $(jq -r '.pendingEvidenceCreated' <<<"$summary")"
              echo "- automatic Confirmed: $(jq -r '.automaticConfirmedCount' <<<"$summary")"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            index=$((index + 1))
          done
