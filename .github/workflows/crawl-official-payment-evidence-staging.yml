name: Crawl official payment Evidence — fixed review staging

on:
  workflow_dispatch:
    inputs:
      batch_ids:
        description: Comma-separated Candidate import batch UUIDs
        required: true
        type: string
      max_targets:
        description: Maximum eligible Candidates to crawl
        required: true
        default: '200'
        type: choice
        options:
          - '50'
          - '100'
          - '150'
          - '200'
          - '250'

concurrency:
  group: fixed-review-official-evidence-crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Crawl same-domain official payment Evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_OFFICIAL_EVIDENCE_BATCH_IDS: ${{ inputs.batch_ids }}
          CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: ${{ inputs.max_targets }}
        run: |
          summary="$(npx tsx scripts/crawl-official-payment-evidence-batch.ts)"
          printf '%s\n' "$summary"
          jq -e '.target == "fixed-review-staging" and .automaticConfirmedCount == 0 and .candidateStateChanged == false and .evidenceVisibility == "private" and .evidenceReviewStatus == "pending" and .payloadExposed == false' <<<"$summary" >/dev/null
          {
            echo '## Bounded official payment Evidence crawl'
            echo
            echo "- import batches: $(jq -r '.batchIds | length' <<<"$summary")"
            echo "- eligible targets before limit: $(jq -r '.eligibleTargetsBeforeLimit' <<<"$summary")"
            echo "- crawled targets: $(jq -r '.targets' <<<"$summary")"
            echo "- landing pages fetched: $(jq -r '.landingPagesFetched' <<<"$summary")"
            echo "- internal pages fetched: $(jq -r '.internalPagesFetched' <<<"$summary")"
            echo "- explicit official Evidence discovered: $(jq -r '.explicitDiscovered' <<<"$summary")"
            echo "- pending private Evidence created: $(jq -r '.pendingEvidenceCreated' <<<"$summary")"
            echo "- automatic Confirmed: $(jq -r '.automaticConfirmedCount' <<<"$summary")"
          } >> "$GITHUB_STEP_SUMMARY"
