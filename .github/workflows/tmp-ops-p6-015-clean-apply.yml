name: Temporary OPS-P6-015 clean apply

on:
  push:
    branches:
      - ops-p6-015-bind-production-authorization-clean
    paths:
      - '.github/workflows/tmp-ops-p6-015-clean-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-015-bind-production-authorization-clean
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply validated non-workflow patch and push
        run: |
          set -euo pipefail
          git fetch origin ops-p6-015-bind-production-authorization --depth=1
          git show origin/ops-p6-015-bind-production-authorization:tmp-ops-p6-015-patch.py > /tmp/p6-015-patch.py
          python /tmp/p6-015-patch.py
          git checkout -- .github/workflows/ops-p6-012-configured-production-authorization.yml
          npx biome check --write \
            scripts/evaluate-ops-p6-012-production-authorization.mjs \
            scripts/check-ops-p6-012-production-authorization.mjs
          node scripts/check-ops-p6-012-production-authorization.mjs
          node scripts/evaluate-ops-p6-012-production-authorization.mjs --self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/evaluate-ops-p6-012-production-authorization.mjs \
            scripts/check-ops-p6-012-production-authorization.mjs \
            docs/OPS_P6_012_CONFIGURED_PRODUCTION_AUTHORIZATION.md
          git commit -m 'OPS-P6-015: bind production authorization to candidate readiness'
          git push origin HEAD:ops-p6-015-bind-production-authorization-clean
