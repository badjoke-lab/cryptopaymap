name: Temporary P6-016 live topology diagnostic

on:
  push:
    branches:
      - temp/p6-016-live-topology-diagnostic-890199
    paths:
      - '.github/workflows/tmp-p6-016-live-topology-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read live topology without mutation
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { promises as dns } from 'node:dns';
          import { writeFileSync } from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('cloudflare_credentials_missing');
          const live = 'cryptopaymap.com';
          const candidateProject = 'cryptopaymap-production';
          const stagingProject = 'cryptopaymap-staging';
          const digest = (v) => `sha256:${createHash('sha256').update(String(v)).digest('hex')}`;
          async function cf(path, allow404 = false) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method: 'GET',
              headers: { Authorization: `Bearer ${token}` },
            });
            if (allow404 && response.status === 404) return null;
            const body = await response.json().catch(() => null);
            if (!response.ok || body?.success !== true) throw new Error(`cloudflare_get_failed:${response.status}`);
            return body.result;
          }

          const zones = await cf(`/zones?name=${encodeURIComponent(live)}&status=active&per_page=50`);
          const exactZones = Array.isArray(zones) ? zones.filter((z) => z?.name === live && z?.status === 'active') : [];
          if (exactZones.length !== 1) throw new Error(`active_zone_count:${exactZones.length}`);
          const zone = exactZones[0];
          const records = await cf(`/zones/${encodeURIComponent(zone.id)}/dns_records?name=${encodeURIComponent(live)}&per_page=100`);
          const exactRecords = Array.isArray(records) ? records.filter((r) => String(r?.name ?? '').replace(/\.$/, '') === live) : [];

          async function project(name) {
            const value = await cf(`/accounts/${encodeURIComponent(accountId)}/pages/projects/${encodeURIComponent(name)}`, true);
            if (!value) return { name, exists: false };
            const domains = Array.isArray(value.domains) ? value.domains.filter((d) => typeof d === 'string').sort() : [];
            return {
              name,
              exists: true,
              productionBranch: value.production_branch ?? null,
              subdomain: value.subdomain ?? null,
              domains,
              idDigest: typeof value.id === 'string' ? digest(value.id) : null,
            };
          }

          const publicDns = { cname: [], a: [], aaaa: [] };
          try { publicDns.cname = await dns.resolveCname(live); } catch {}
          try { publicDns.a = await dns.resolve4(live); } catch {}
          try { publicDns.aaaa = await dns.resolve6(live); } catch {}

          let https = null;
          try {
            const response = await fetch(`https://${live}/?p6_016_diag=${Date.now()}`, { redirect: 'manual', cache: 'no-store' });
            https = {
              status: response.status,
              location: response.headers.get('location'),
              contentType: response.headers.get('content-type')?.split(';')[0] ?? null,
              server: response.headers.get('server'),
            };
          } catch (error) {
            https = { error: error instanceof Error ? error.message.replace(/[^a-zA-Z0-9:._/-]/g, '_').slice(0, 160) : 'unknown' };
          }

          const output = {
            version: 1,
            observation: 'read_only',
            liveHostname: live,
            zone: { activeExactCount: exactZones.length, idDigest: digest(zone.id) },
            cloudflareDns: exactRecords.map((r) => ({
              type: r?.type ?? null,
              name: r?.name ?? null,
              content: r?.content ?? null,
              proxied: r?.proxied === true,
              ttl: r?.ttl ?? null,
              idDigest: typeof r?.id === 'string' ? digest(r.id) : null,
            })),
            publicDns,
            candidateProject: await project(candidateProject),
            stagingProject: await project(stagingProject),
            https,
            mutation: false,
          };
          writeFileSync('p6-016-live-topology-diagnostic.json', `${JSON.stringify(output, null, 2)}\n`);
          console.log(JSON.stringify(output, null, 2));
          NODE
      - name: Upload bounded read-only diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: p6-016-live-topology-diagnostic
          path: p6-016-live-topology-diagnostic.json
          if-no-files-found: error
          retention-days: 1
