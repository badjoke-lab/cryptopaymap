name: Temporary OPS-P6-008 patcher

on:
  push:
    branches:
      - ops-p6-008-q4-schema-reconcile-disposal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-008-q4-schema-reconcile-disposal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply bounded Q4 reconciliation and disposal fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs')
          s = p.read_text()
          old = """const privateSubmissionTables = [
            'submissions',
            'submission_payloads',
            'submission_contacts',
            'submission_media',
            'submission_events',
            'submission_decisions',
          ];
          """
          new = old + "const applicationSchemaNames = ['public', 'drizzle'];\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = """function normalizeSchemaDump(text) {
            return text
              .split(/\\r?\\n/)
              .filter((line) => !/^-- Dumped (from|by)/.test(line))
              .filter((line) => !/^\\\\(un)?restrict\\b/.test(line))
              .join('\\n')
              .trim();
          }

          """
          assert old in s
          s = s.replace(old, '', 1)

          old = """    schemaDigest(databaseUrl) {
              const value = execFileSync('pg_dump', ['--schema-only', '--no-owner', '--no-privileges'], {
                env: buildPgEnvironment(databaseUrl),
                encoding: 'utf8',
                maxBuffer: 128 * 1024 * 1024,
                stdio: ['ignore', 'pipe', 'pipe'],
              });
              return boundedHash(normalizeSchemaDump(value));
            },
          """
          new = """    schemaDigest(databaseUrl) {
              const scope = \"('public','drizzle')\";
              const relations = runPsql(
                databaseUrl,
                `select jsonb_build_array(n.nspname,c.relname,c.relkind)::text from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ${scope} and c.relkind in ('r','p','v','m','S','f') order by n.nspname,c.relname,c.relkind`,
              );
              const columns = runPsql(
                databaseUrl,
                `select jsonb_build_array(n.nspname,c.relname,a.attnum,a.attname,format_type(a.atttypid,a.atttypmod),a.attnotnull,coalesce(pg_get_expr(ad.adbin,ad.adrelid),''))::text from pg_class c join pg_namespace n on n.oid=c.relnamespace join pg_attribute a on a.attrelid=c.oid and a.attnum>0 and not a.attisdropped left join pg_attrdef ad on ad.adrelid=c.oid and ad.adnum=a.attnum where n.nspname in ${scope} and c.relkind in ('r','p','v','m','f') order by n.nspname,c.relname,a.attnum`,
              );
              const constraints = runPsql(
                databaseUrl,
                `select jsonb_build_array(n.nspname,t.relname,c.conname,c.contype,c.convalidated,pg_get_constraintdef(c.oid,true))::text from pg_constraint c join pg_class t on t.oid=c.conrelid join pg_namespace n on n.oid=t.relnamespace where n.nspname in ${scope} order by n.nspname,t.relname,c.conname`,
              );
              const indexes = runPsql(
                databaseUrl,
                `select jsonb_build_array(n.nspname,t.relname,i.relname,pg_get_indexdef(i.oid))::text from pg_index x join pg_class t on t.oid=x.indrelid join pg_namespace n on n.oid=t.relnamespace join pg_class i on i.oid=x.indexrelid where n.nspname in ${scope} order by n.nspname,t.relname,i.relname`,
              );
              return boundedHash([relations, columns, constraints, indexes].join('\\n---\\n'));
            },
          """
          assert old in s
          s = s.replace(old, new, 1)

          old = """    disposeTarget(databaseUrl) {
              runPsql(databaseUrl, 'drop schema if exists public cascade; create schema public');
              if (this.countUserObjects(databaseUrl) !== 0) throw new Error('target_disposal_failed');
            },
          """
          new = """    disposeTarget(databaseUrl) {
              runPsql(
                databaseUrl,
                'drop schema if exists drizzle cascade; drop schema if exists public cascade; create schema public',
              );
              if (this.countUserObjects(databaseUrl) !== 0) throw new Error('target_disposal_failed');
            },
          """
          assert old in s
          s = s.replace(old, new, 1)

          marker = """async function selfTest() {
            const root = mkdtempSync(join(tmpdir(), 'cpm-p6-07-q4-self-test-'));
          """
          replacement = """async function selfTest() {
            if (!sameSortedValues(applicationSchemaNames, ['public', 'drizzle'])) {
              throw new Error('application_schema_scope_self_test_failed');
            }
            const root = mkdtempSync(join(tmpdir(), 'cpm-p6-07-q4-self-test-'));
          """
          assert marker in s
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          p = Path('scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs')
          s = p.read_text()
          needle = """  [files.executor, 'privateTablesZeroRows'],
          """
          repl = needle + """  [files.executor, \"const applicationSchemaNames = ['public', 'drizzle']\"],
            [files.executor, 'jsonb_build_array(n.nspname,c.relname,c.relkind)'],
            [files.executor, 'pg_get_constraintdef(c.oid,true)'],
            [files.executor, 'pg_get_indexdef(i.oid)'],
            [files.executor, 'drop schema if exists drizzle cascade'],
          """
          assert needle in s
          s = s.replace(needle, repl, 1)
          needle = """if (!files.executor.includes(\"throw new Error('target_disposal_failed')\")) {
            throw new Error('OPS-P6-002A must fail closed when isolated-target disposal fails.');
          }
          """
          repl = needle + """if (files.executor.includes("pg_dump', ['--schema-only'")) {
            throw new Error('OPS-P6-002A must use semantic application-schema reconciliation, not raw pg_dump text.');
          }
          if (!files.executor.includes("drop schema if exists drizzle cascade; drop schema if exists public cascade")) {
            throw new Error('OPS-P6-002A disposal must clear both restored application schemas.');
          }
          """
          assert needle in s
          s = s.replace(needle, repl, 1)
          p.write_text(s)

          p = Path('docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md')
          s = p.read_text()
          s = s.replace(
            '- source and target schema-only digests match;',
            '- source and target semantic application-schema digests match across the restored `public` and `drizzle` schemas, including relations, columns/defaults, constraints, sequences, and indexes;',
          )
          s = s.replace(
            'Disposal drops the restored `public` schema with cascade, recreates an empty `public` schema, and verifies that no user object remains.',
            'Disposal drops both restored application schemas (`drizzle` and `public`) with cascade, recreates an empty `public` schema, and verifies across all non-system schemas that no user object remains.',
          )
          s = s.replace(
            'The executor records only table-set, row-count, constraint, schema, and invariant digests.',
            'The executor records only table-set, row-count, constraint, semantic application-schema, and invariant digests. The semantic schema digest is derived from PostgreSQL catalogs for `public` and `drizzle`; it excludes environment-sensitive raw whole-database dump text, ownership, privileges, and connection identity.',
          )
          p.write_text(s)
          PY

          ./node_modules/.bin/biome format --write \
            scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md

          node scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs
          node scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs --self-test
          rm .github/workflows/tmp-ops-p6-008-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md \
            .github/workflows/tmp-ops-p6-008-patcher.yml
          git commit -m 'OPS-P6-008: reconcile Q4 application schemas and disposal'
          git push origin HEAD:ops-p6-008-q4-schema-reconcile-disposal
