name: Temporary OPS-P6-008 patcher

on:
  push:
    branches:
      - ops-p6-008-q4-schema-reconcile-disposal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-008-q4-schema-reconcile-disposal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply and verify bounded patch
        run: |
          set -euo pipefail
          python3 .github/tmp-ops-p6-008-patch.py
          ./node_modules/.bin/biome format --write scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md
          node scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs
          node scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs --self-test
          rm .github/workflows/tmp-ops-p6-008-patcher.yml .github/tmp-ops-p6-008-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'OPS-P6-008: reconcile Q4 application schemas and disposal'
          git push origin HEAD:ops-p6-008-q4-schema-reconcile-disposal
