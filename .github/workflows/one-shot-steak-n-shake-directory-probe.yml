name: One-shot Steak n Shake official directory probe

on:
  push:
    branches:
      - feat/steak-n-shake-btc-growth
    paths:
      - .github/workflows/one-shot-steak-n-shake-directory-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve official locator data loader
        run: |
          node --input-type=module <<'NODE' | tee steak-directory-probe.json
          const pageUrl = 'https://www.steaknshake.com/locations/';
          const headers = { 'user-agent': 'CryptoPayMap-official-directory-probe/1.0' };
          const page = await fetch(pageUrl, { redirect: 'follow', headers, signal: AbortSignal.timeout(15000) });
          if (!page.ok) throw new Error(`locations page HTTP ${page.status}`);
          const html = await page.text();
          const scriptUrls = [...new Set([...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)]
            .map((m) => new URL(m[1].replace(/&amp;/g, '&'), page.url).toString()))];
          const scanned = [];
          for (const scriptUrl of scriptUrls) {
            const host = new URL(scriptUrl).hostname.toLowerCase().replace(/^www\./, '');
            if (host !== 'steaknshake.com') continue;
            try {
              const response = await fetch(scriptUrl, { redirect: 'follow', headers, signal: AbortSignal.timeout(15000) });
              const text = (await response.text()).slice(0, 2_000_000);
              const interesting = /loadLocationData|zsapi|lochash|venue\/|locationData|locations\.json|geo\.php/i.test(text);
              if (!interesting) continue;
              const matches = [];
              for (const needle of ['loadLocationData', 'zsapi', 'venue/', 'lochash', 'locationData', 'locations.json', 'geo.php']) {
                let from = 0;
                while (matches.length < 100) {
                  const index = text.toLowerCase().indexOf(needle.toLowerCase(), from);
                  if (index < 0) break;
                  matches.push({ needle, context: text.slice(Math.max(0, index - 1600), Math.min(text.length, index + needle.length + 3600)) });
                  from = index + needle.length;
                }
              }
              scanned.push({ scriptUrl, status: response.status, chars: text.length, matches });
            } catch (error) {
              scanned.push({ scriptUrl, error: error instanceof Error ? error.message : String(error) });
            }
          }
          console.log(JSON.stringify({ pageUrl: page.url, scriptCount: scriptUrls.length, scanned }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: steak-directory-probe
          path: steak-directory-probe.json
          retention-days: 3
