name: One-shot Steak n Shake official directory probe

on:
  push:
    branches:
      - feat/steak-n-shake-btc-growth
    paths:
      - .github/workflows/one-shot-steak-n-shake-directory-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve official locator API
        run: |
          node --input-type=module <<'NODE' | tee steak-directory-probe.json
          const url = 'https://www.steaknshake.com/wp-content/themes/steaknshake/js/loc.js';
          const response = await fetch(url, {
            redirect: 'follow',
            headers: { 'user-agent': 'CryptoPayMap-official-directory-probe/1.0' },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`loc.js HTTP ${response.status}`);
          const text = await response.text();
          const needles = ['loadLocationData', 'zsapi', 'getJSON', '$.get', 'jQuery.get', 'locations.json', 'venues'];
          const contexts = {};
          for (const needle of needles) {
            const found = [];
            let from = 0;
            while (found.length < 40) {
              const index = text.toLowerCase().indexOf(needle.toLowerCase(), from);
              if (index < 0) break;
              found.push(text.slice(Math.max(0, index - 1200), Math.min(text.length, index + needle.length + 2200)));
              from = index + needle.length;
            }
            contexts[needle] = found;
          }
          const quoted = [...new Set([...text.matchAll(/["']([^"']*(?:zsapi|venue|location)[^"']*)["']/gi)].map((m) => m[1]))].slice(0, 200);
          console.log(JSON.stringify({ status: response.status, chars: text.length, quoted, contexts }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: steak-directory-probe
          path: steak-directory-probe.json
          retention-days: 3
