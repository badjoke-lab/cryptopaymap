name: One-shot Steak n Shake official directory probe

on:
  push:
    branches:
      - feat/steak-n-shake-btc-growth
    paths:
      - .github/workflows/one-shot-steak-n-shake-directory-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe official WordPress location feed
        run: |
          node --input-type=module <<'NODE' | tee steak-directory-probe.json
          const pageUrl = 'https://www.steaknshake.com/locations/';
          const headers = { 'user-agent': 'CryptoPayMap-official-directory-probe/1.0' };
          const page = await fetch(pageUrl, { redirect: 'follow', headers, signal: AbortSignal.timeout(15000) });
          if (!page.ok) throw new Error(`locations page HTTP ${page.status}`);
          const html = await page.text();
          const localized = html.match(/var\s+sns_ajax\s*=\s*(\{[^;]+\});/i)?.[1] ?? null;
          let ajaxUrl = 'https://www.steaknshake.com/wp-admin/admin-ajax.php';
          if (localized) {
            try {
              const parsed = JSON.parse(localized.replace(/&amp;/g, '&'));
              if (typeof parsed.ajaxurl === 'string') ajaxUrl = new URL(parsed.ajaxurl, page.url).toString();
            } catch {}
          }
          const body = new URLSearchParams({ action: 'get_location_data_from_plugin' });
          const response = await fetch(ajaxUrl, {
            method: 'POST',
            redirect: 'follow',
            headers: {
              ...headers,
              accept: 'application/json,text/plain;q=0.9,*/*;q=0.1',
              'content-type': 'application/x-www-form-urlencoded;charset=UTF-8',
              origin: 'https://www.steaknshake.com',
              referer: page.url,
            },
            body,
            signal: AbortSignal.timeout(20000),
          });
          if (!response.ok) throw new Error(`location feed HTTP ${response.status}`);
          const text = await response.text();
          const data = JSON.parse(text);
          if (!Array.isArray(data)) throw new Error('location feed did not return an array');
          const sample = data.slice(0, 3).map((row) => ({
            keys: Object.keys(row).sort(),
            id: row.id ?? null,
            name: row.name ?? null,
            lat: row.lat ?? row.address?.loc?.[1] ?? null,
            lng: row.lng ?? row.address?.loc?.[0] ?? null,
            addressKeys: row.address && typeof row.address === 'object' ? Object.keys(row.address).sort() : [],
            address: row.address ?? null,
            phone: row.phone ?? null,
            hoursKeys: row.hours && typeof row.hours === 'object' ? Object.keys(row.hours).sort() : [],
            snapfingerUrl: row.snapfinger_url ?? null,
          }));
          const states = [...new Set(data.map((row) => row.address?.state ?? row.address?.region ?? null).filter(Boolean))].sort();
          const validCoordinates = data.filter((row) => Number.isFinite(Number(row.lat ?? row.address?.loc?.[1])) && Number.isFinite(Number(row.lng ?? row.address?.loc?.[0]))).length;
          const withPhone = data.filter((row) => typeof row.phone === 'string' && row.phone.trim()).length;
          const withHours = data.filter((row) => row.hours && typeof row.hours === 'object').length;
          console.log(JSON.stringify({ ajaxUrl, count: data.length, validCoordinates, withPhone, withHours, stateCount: states.length, states, sample }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: steak-directory-probe
          path: steak-directory-probe.json
          retention-days: 3
