name: Europe-west reviewed staging publication proof

on:
  push:
    branches:
      - ops/europe-west-reviewed-publication
    paths:
      - .github/workflows/europe-west-reviewed-publication-proof.yml

permissions:
  contents: read

concurrency:
  group: europe-west-reviewed-staging-publication
  cancel-in-progress: false

env:
  CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
  PREVIEW_URL: https://real-data-review.cryptopaymap-staging.pages.dev

jobs:
  publish-reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Publish all eligible reviewed physical canonical records in staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS: ${{ secrets.CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS }}
        run: |
          summary="$(npx tsx scripts/publish-reviewed-physical-canonical-staging.ts)"
          jq -e '.target == "fixed-review-staging" and .reviewedTargets >= 6 and .publicationConfigured == true and .publisherAuthorized == true and (.mutationPerformed == true or .alreadyPublic == true) and .payloadExposed == false' <<<"$summary" >/dev/null
          {
            echo '## Reviewed real-data staging publication'
            echo
            echo "- eligible reviewed targets: $(jq -r '.reviewedTargets' <<<"$summary")"
            echo "- publication mutation performed: $(jq -r '.mutationPerformed' <<<"$summary")"
            echo "- already public before this run: $(jq -r '.alreadyPublic' <<<"$summary")"
            echo "- public claims in reviewed set after: $(jq -r '.publicClaimsAfter' <<<"$summary")"
            echo '- payload exposed: false'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove synthetic staging review payload before build
        run: rm -rf public/staging-review

      - name: Materialize public data from staging database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/materialize-public-data-from-staging-db.ts

      - name: Verify source and build
        run: |
          npm run check
          npm run build

      - name: Deploy isolated real-data staging preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler pages deploy dist \
            --project-name cryptopaymap-staging \
            --branch real-data-review

      - name: Verify deployed reviewed real-data preview externally
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PREVIEW_URL;
          let places = null;
          for (let attempt = 0; attempt < 20; attempt += 1) {
            const response = await fetch(`${base}/data/places.json?verify=${Date.now()}-${attempt}`, {
              cache: 'no-store',
            }).catch(() => null);
            if (response?.status === 200) {
              const value = await response.json().catch(() => null);
              if (value && Array.isArray(value.records)) {
                places = value;
                if (places.records.length >= 6) break;
              }
            }
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          if (!places || places.records.length < 6) {
            throw new Error(`Expected at least 6 reviewed real public places, got ${places?.records?.length ?? 'unreachable'}.`);
          }
          if (places.records.some((record) => /\bstaging\b/i.test(String(record?.name ?? '')))) {
            throw new Error('Synthetic staging fixture name found in real-data preview.');
          }
          const pinsResponse = await fetch(`${base}/data/place-pins.json?verify=${Date.now()}`, {
            cache: 'no-store',
          });
          const pins = await pinsResponse.json();
          if (!Array.isArray(pins.records) || pins.records.length !== places.records.length) {
            throw new Error(
              `Map pin count ${pins.records?.length ?? 'invalid'} does not match place count ${places.records.length}.`,
            );
          }
          console.log(JSON.stringify({
            previewReachable: true,
            physicalPlaces: places.records.length,
            mapPins: pins.records.length,
            syntheticFixtureNames: 0,
            candidatePayloadExposed: false,
          }));
          NODE
