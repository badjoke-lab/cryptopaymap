name: Temporary OPS-P6-001K project status reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-ops-p6-001k-project-status.yml'
      - 'scripts/temporary-ops-p6-001k-project-status-prefix.md'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'agent/ops-p6-001k-project-status'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out status branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001k-project-status
          fetch-depth: 0

      - name: Replace authoritative status section
        run: |
          python <<'PY'
          from pathlib import Path

          status_path = Path('docs/PROJECT_STATUS.md')
          prefix_path = Path('scripts/temporary-ops-p6-001k-project-status-prefix.md')
          text = status_path.read_text()
          marker = '## Retained executable-audit snapshot\n'
          if marker not in text:
              raise SystemExit('retained executable-audit snapshot marker is missing')
          _, retained = text.split(marker, 1)
          prefix = prefix_path.read_text()
          status_path.write_text(prefix + marker + retained)
          PY

      - name: Verify preserved snapshot and current markers
        run: |
          grep -F 'OPS-P6-001K' docs/PROJECT_STATUS.md
          grep -F '9e83dade38ec01ec451ad8591daac3d519d024df' docs/PROJECT_STATUS.md
          grep -F '## Retained executable-audit snapshot' docs/PROJECT_STATUS.md
          grep -F '0b0b328b8cb002977f1aa34e7385fc8eef56d324' docs/PROJECT_STATUS.md

      - name: Commit status reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATUS.md
          git commit -m 'Reconcile project status through P6-06 permission repair'
          git push origin HEAD:agent/ops-p6-001k-project-status
