name: temporary P6 apex canonical PR trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_tmp-p6-apex-canonical-patch.yml
      - .github/workflows/_tmp-p6-apex-canonical-pr-trigger.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/p6-apex-canonical'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/p6-apex-canonical
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Extract and execute deterministic patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          path = Path('.github/workflows/_tmp-p6-apex-canonical-patch.yml')
          text = path.read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          code = textwrap.dedent(text[start:end])
          exec(compile(code, str(path), 'exec'), {})
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate apex-canonical contracts
        run: |
          npm run check
          node scripts/materialize-production-machine-files.mjs --self-test
          node scripts/check-ops-p6-014-production-candidate-bootstrap.mjs
          node scripts/run-ops-p6-014-production-candidate-bootstrap.mjs --self-test
          node scripts/check-ops-p6-016-production-go-live-executor.mjs
          node scripts/run-ops-p6-016-production-go-live-executor.mjs --self-test
          node scripts/check-ops-p6-017-production-launch-close.mjs
          node scripts/run-ops-p6-017-production-launch-close.mjs --self-test
          git diff --check

      - name: Commit validated patch and remove temporary workflows
        run: |
          rm .github/workflows/_tmp-p6-apex-canonical-patch.yml
          rm .github/workflows/_tmp-p6-apex-canonical-pr-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P6: make apex the canonical production host'
          git push origin HEAD:ops/p6-apex-canonical
