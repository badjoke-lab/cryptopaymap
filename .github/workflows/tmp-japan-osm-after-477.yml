name: Temporary Japan OSM acquisition after #477

on:
  push:
    branches:
      - ops/japan-osm-acquisition-after-477
    paths:
      - '.github/workflows/tmp-japan-osm-after-477.yml'

concurrency:
  group: fixed-review-osm-candidate-acquisition
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Acquire bounded Japan OSM Candidates in fixed review staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: |
          summary="$(npx tsx scripts/acquire-osm-candidates.ts japan)"
          jq -c '{target,scope,fetchedElements,candidateTotalBefore,candidateTotalAfter,candidateDelta,ingestion:{state:.ingestion.state,batchId:.ingestion.batchId,requestId:.ingestion.requestId,inputChecksum:.ingestion.inputChecksum,acceptedCount:.ingestion.acceptedCount,rejectedCount:.ingestion.rejectedCount,replayedCount:.ingestion.replayedCount,duplicateSignalCount:.ingestion.duplicateSignalCount,automaticConfirmedCount:.ingestion.automaticConfirmedCount}}' <<<"$summary"
          test "$(jq -r '.ingestion.automaticConfirmedCount' <<<"$summary")" = "0"
