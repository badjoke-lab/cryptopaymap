name: Format OPS-P6-001J temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/format-ops-p6-001j-temp.yml'

permissions:
  contents: write

concurrency:
  group: format-ops-p6-001j-temp
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out OPS-P6-001J branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001j-domain-topology-diagnostic

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format OPS-P6-001J files
        run: |
          npx biome format --write \
            .github/workflows/ops-p6-001j-configured-staging-p6-06-domain-topology-diagnostic.yml \
            docs/OPS_P6_001J_CONFIGURED_STAGING_P6_06_DOMAIN_TOPOLOGY_DIAGNOSTIC.md \
            scripts/run-ops-p6-001j-configured-staging-p6-06-domain-topology-diagnostic.mjs \
            scripts/check-ops-p6-001j-configured-staging-p6-06-domain-topology-diagnostic.mjs

      - name: Commit formatting and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-ops-p6-001j-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/format-ops-p6-001j-temp.yml \
            .github/workflows/ops-p6-001j-configured-staging-p6-06-domain-topology-diagnostic.yml \
            docs/OPS_P6_001J_CONFIGURED_STAGING_P6_06_DOMAIN_TOPOLOGY_DIAGNOSTIC.md \
            scripts/run-ops-p6-001j-configured-staging-p6-06-domain-topology-diagnostic.mjs \
            scripts/check-ops-p6-001j-configured-staging-p6-06-domain-topology-diagnostic.mjs
          git commit -m 'Format OPS-P6-001J domain topology diagnostic'
          git push origin HEAD:agent/ops-p6-001j-domain-topology-diagnostic
