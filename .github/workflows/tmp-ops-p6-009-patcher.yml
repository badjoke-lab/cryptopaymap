name: Temporary OPS-P6-009 patcher

on:
  push:
    branches:
      - ops-p6-009-q4-check-constraint-canonicalization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-009-q4-check-constraint-canonicalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply and verify bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp-ops-p6-009-patch.py
          node scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs
          node scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs --self-test
          npx prettier --write scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md
          node scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs
          node scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs --self-test
          rm .github/tmp-ops-p6-009-patch.py .github/workflows/tmp-ops-p6-009-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md .github/tmp-ops-p6-009-patch.py .github/workflows/tmp-ops-p6-009-patcher.yml
          git diff --cached --check
          git commit -m 'OPS-P6-009: canonicalize equivalent Q4 CHECK deparser forms'
          git push origin HEAD:ops-p6-009-q4-check-constraint-canonicalization
