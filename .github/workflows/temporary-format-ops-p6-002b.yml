name: Temporary format OPS-P6-002B

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-format-ops-p6-002b.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Q5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-002b-p6-07-incident-exercise-final-receipt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format Q5 sources and repair workflow path
        run: |
          set -euo pipefail
          npx biome format --write \
            scripts/run-ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.mjs \
            scripts/check-ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.mjs \
            scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js
          sed -i \
            's#scripts/check-p6-07-configured-operational-monitorING_BACKUP_RESTORE_INCIDENT_EVIDENCE.js#scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js#' \
            .github/workflows/ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.yml
          npm run format:check
          npm run lint
          node scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js
          node scripts/check-ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.mjs

      - name: Publish formatted sources and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-format-ops-p6-002b.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/run-ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.mjs \
            scripts/check-ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.mjs \
            scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js \
            .github/workflows/ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.yml \
            .github/workflows/temporary-format-ops-p6-002b.yml
          git commit -m 'Format P6-07 Q5 implementation'
          git push origin HEAD:agent/ops-p6-002b-p6-07-incident-exercise-final-receipt
