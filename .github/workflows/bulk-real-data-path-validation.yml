name: Bulk real-data path validation

on:
  push:
    branches:
      - data/bulk-reviewed-osm-promotion

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check changed source formatting and lint
        run: >-
          npx biome check
          scripts/promote-reviewed-osm-bitcoin-staging-bulk.ts
          scripts/publish-reviewed-physical-canonical-staging-bulk.ts
          .github/workflows/real-data-staging-publication.yml
      - name: Astro and TypeScript check
        run: npm run check
      - name: Build
        run: npm run build
