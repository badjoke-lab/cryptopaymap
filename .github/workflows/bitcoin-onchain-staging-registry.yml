name: Bitcoin on-chain staging registry

on:
  push:
    branches:
      - ops/bitcoin-onchain-staging-registry
    paths:
      - scripts/ensure-bitcoin-onchain-staging-registry.ts
      - .github/workflows/bitcoin-onchain-staging-registry.yml

permissions:
  contents: read

env:
  CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Ensure Bitcoin on-chain registry entries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          summary="$(npx tsx scripts/ensure-bitcoin-onchain-staging-registry.ts)"
          printf '%s\n' "$summary"
          jq -e '.target == "fixed-review-staging" and .bitcoinNetworkReady == true and .onchainPaymentMethodReady == true and .publicDataChanged == false and .candidateDataExposed == false' <<<"$summary" >/dev/null
