name: Temporary PR 396 formatter

on:
  push:
    branches:
      - agent/ops-p6-007-q4-pg-restore-dbname

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-007-q4-pg-restore-dbname
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format bounded PR files and remove dispatcher
        run: |
          ./node_modules/.bin/biome format --write \
            docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md \
            scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs
          rm .github/workflows/tmp-format-pr396.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md \
            scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            .github/workflows/tmp-format-pr396.yml
          git commit -m 'OPS-P6-007: format Q4 restore fix'
          git push origin HEAD:agent/ops-p6-007-q4-pg-restore-dbname
