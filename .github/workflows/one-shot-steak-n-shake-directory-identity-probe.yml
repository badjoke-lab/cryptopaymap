name: One-shot Steak n Shake directory identity probe

on:
  push:
    branches:
      - feat/steak-n-shake-btc-growth
    paths:
      - .github/workflows/one-shot-steak-n-shake-directory-identity-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe safe aggregate location identity
        run: |
          node --input-type=module <<'NODE' | tee steak-directory-identity-probe.json
          const ajaxUrl = 'https://www.steaknshake.com/wp-admin/admin-ajax.php';
          const response = await fetch(ajaxUrl, {
            method: 'POST',
            redirect: 'follow',
            headers: {
              'user-agent': 'CryptoPayMap-directory-identity-probe/1.0',
              accept: 'application/json,text/plain;q=0.9,*/*;q=0.1',
              'content-type': 'application/x-www-form-urlencoded;charset=UTF-8',
              origin: 'https://www.steaknshake.com',
              referer: 'https://www.steaknshake.com/locations/',
            },
            body: new URLSearchParams({ action: 'get_location_data_from_plugin' }),
            signal: AbortSignal.timeout(25000),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = JSON.parse(await response.text());
          if (!Array.isArray(data)) throw new Error('response was not an array');

          const value = (row, key) => typeof row?.[key] === 'string' ? row[key].trim() : String(row?.[key] ?? '').trim();
          const addressTuple = (row) => {
            const a = row?.address ?? {};
            return [a.address1, a.city, a.region, a.zip, a.country].map((x) => String(x ?? '').trim().toLowerCase()).join('|');
          };
          const coord = (row) => {
            const loc = row?.address?.loc ?? [];
            return `${Number(loc[1]).toFixed(6)}|${Number(loc[0]).toFixed(6)}`;
          };
          const countBy = (fn) => {
            const map = new Map();
            for (const row of data) {
              const key = fn(row);
              map.set(key, (map.get(key) ?? 0) + 1);
            }
            return map;
          };
          const summarize = (map) => ({
            unique: map.size,
            duplicatedValues: [...map.values()].filter((n) => n > 1).length,
            rowsInDuplicatedValues: [...map.values()].filter((n) => n > 1).reduce((a,b) => a+b, 0),
            maxMultiplicity: Math.max(...map.values()),
          });
          const idMap = countBy((row) => value(row, 'id'));
          const slugMap = countBy((row) => value(row, 'slug'));
          const idSlugMap = countBy((row) => `${value(row, 'id')}|${value(row, 'slug')}`);
          const addressMap = countBy(addressTuple);
          const coordMap = countBy(coord);
          const idAddressMap = countBy((row) => `${value(row, 'id')}|${addressTuple(row)}`);
          const idCoordMap = countBy((row) => `${value(row, 'id')}|${coord(row)}`);
          const duplicateIdGroups = [...idMap.entries()].filter(([, n]) => n > 1);
          const duplicateIdRows = data.filter((row) => (idMap.get(value(row, 'id')) ?? 0) > 1);
          const duplicateIdDistinctSlugs = new Set(duplicateIdRows.map((row) => value(row, 'slug'))).size;
          const duplicateIdDistinctAddresses = new Set(duplicateIdRows.map(addressTuple)).size;
          const duplicateIdDistinctCoords = new Set(duplicateIdRows.map(coord)).size;

          console.log(JSON.stringify({
            count: data.length,
            id: summarize(idMap),
            slug: summarize(slugMap),
            idSlug: summarize(idSlugMap),
            address: summarize(addressMap),
            coordinates: summarize(coordMap),
            idAddress: summarize(idAddressMap),
            idCoordinates: summarize(idCoordMap),
            duplicateIdGroupCount: duplicateIdGroups.length,
            duplicateIdRows: duplicateIdRows.length,
            duplicateIdDistinctSlugs,
            duplicateIdDistinctAddresses,
            duplicateIdDistinctCoords,
            rawRowsExposed: false
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: steak-directory-identity-probe
          path: steak-directory-identity-probe.json
          retention-days: 3
