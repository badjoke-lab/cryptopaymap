name: PR470 Temporary Domain Patch

on:
  push:
    branches:
      - fix-p2-006-bounded-official-domain-comparisons

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-domain-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-p2-006-bounded-official-domain-comparisons
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 scripts/pr470-temp-domain-patch.py
      - run: npm run db:generate
      - run: npm run format
      - run: npm test -- tests/candidate-ingestion-persistence.test.ts tests/osm-overpass-candidate-acquisition.test.ts tests/candidate-acquisition-reconciliation.test.ts
      - run: npm run check
      - run: npm run db:check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db/schema/source-provenance.ts src/importers/candidate-ingestion-persistence.ts src/importers/osm-overpass-candidate-acquisition.ts tests/candidate-ingestion-persistence.test.ts tests/osm-overpass-candidate-acquisition.test.ts drizzle
          git commit -m 'FIX-P2-006: add bounded official-domain Candidate lookup [skip-domain-patch]'
          git push origin HEAD:fix-p2-006-bounded-official-domain-comparisons
