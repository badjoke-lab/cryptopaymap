name: Patch exact Candidate crawl selection

on:
  push:
    branches:
      - fix/auto-select-official-evidence-batch
    paths:
      - .github/workflows/patch-official-evidence-rails.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-select-official-evidence-batch

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch exact Candidate crawl selection
        run: python3 .github/scripts/patch-official-crawl-selection.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format patched file
        run: npx biome format --write scripts/crawl-official-payment-evidence-batch.ts

      - name: Type-check exact Candidate crawl
        run: npx tsc --noEmit --pretty false

      - name: Commit exact Candidate selection
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/crawl-official-payment-evidence-batch.ts
          git commit -m "DATA: support exact Candidate official crawl"
          git push origin HEAD:fix/auto-select-official-evidence-batch
