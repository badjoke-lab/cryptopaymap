name: Patch official Evidence payment rails

on:
  push:
    branches:
      - fix/auto-select-official-evidence-batch
    paths:
      - .github/workflows/patch-official-evidence-rails.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-select-official-evidence-batch

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch strict rail classification
        run: python3 .github/scripts/patch-official-evidence-rails.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format patched file
        run: npx biome format --write scripts/promote-confirm-official-evidence-batch.ts

      - name: Type-check patched rail classifier
        run: npx tsc --noEmit --pretty false

      - name: Commit rail classification fix
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/promote-confirm-official-evidence-batch.ts
          git commit -m "FIX: classify verified Bitcoin payment rails"
          git push origin HEAD:fix/auto-select-official-evidence-batch
