name: Patch bounded official crawl attempts

on:
  push:
    branches:
      - fix/auto-select-official-evidence-batch
    paths:
      - .github/workflows/patch-official-evidence-rails.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-select-official-evidence-batch

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Persist bounded crawl attempts
        run: python3 .github/scripts/patch-official-crawl-attempts.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format patched file
        run: npx biome format --write scripts/crawl-official-payment-evidence-batch.ts scripts/crawl-next-official-payment-evidence-batch.ts

      - name: Type-check crawl progression
        run: npx tsc --noEmit --pretty false

      - name: Commit crawl attempt persistence
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/crawl-official-payment-evidence-batch.ts scripts/crawl-next-official-payment-evidence-batch.ts
          git commit -m "DATA: persist bounded official crawl attempts"
          git push origin HEAD:fix/auto-select-official-evidence-batch
