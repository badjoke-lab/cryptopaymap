name: Temporary OPS-P6-012 strict integer patch

on:
  push:
    branches:
      - ops-p6-012-production-authorization
    paths:
      - '.github/tmp-ops-p6-012-strict-int.py'
      - '.github/workflows/tmp-ops-p6-012-strict-int.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-012-production-authorization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply and validate strict integer patch
        run: |
          set -euo pipefail
          python .github/tmp-ops-p6-012-strict-int.py
          npx biome check --write scripts/evaluate-ops-p6-012-production-authorization.mjs
          node scripts/check-ops-p6-012-production-authorization.mjs
          node scripts/evaluate-ops-p6-012-production-authorization.mjs --self-test
          git diff --check
          rm .github/tmp-ops-p6-012-strict-int.py .github/workflows/tmp-ops-p6-012-strict-int.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/evaluate-ops-p6-012-production-authorization.mjs .github/tmp-ops-p6-012-strict-int.py .github/workflows/tmp-ops-p6-012-strict-int.yml
          git commit -m 'OPS-P6-012: reject malformed numeric authorization inputs'
          git push origin HEAD:ops-p6-012-production-authorization
