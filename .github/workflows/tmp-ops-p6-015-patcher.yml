          text = text.replace(old, new, 1)

          old = "  const proposedExpiry =\n    authorizationTtlMinutes === null\n      ? null\n      : new Date(now.getTime() + authorizationTtlMinutes * 60_000).toISOString();\n  if (\n    proposedExpiry !== null &&\n    staging.earliestExpiry !== null &&\n    Date.parse(proposedExpiry) >= staging.earliestExpiry\n  ) {\n    blockers.push('authorization_ttl:exceeds_predecessor_expiry');\n  }"
          new = "  const evidenceExpiry = earliestEvidenceExpiry([\n    staging.earliestExpiry,\n    p605.expiresAt,\n    candidate.expiresAt,\n    readiness.expiresAt,\n  ]);\n  const proposedExpiry =\n    authorizationTtlMinutes === null\n      ? null\n      : new Date(now.getTime() + authorizationTtlMinutes * 60_000).toISOString();\n  if (\n    proposedExpiry !== null &&\n    evidenceExpiry !== null &&\n    Date.parse(proposedExpiry) >= evidenceExpiry\n  ) {\n    blockers.push('authorization_ttl:exceeds_predecessor_expiry');\n  }"
          if old not in text: raise SystemExit('expiry anchor missing')
          text = text.replace(old, new, 1)

          old = "  const authorizationId = digest({\n    commit,\n    binding,\n    operatorDigests,"
          new = "  const productionEvidenceBinding =\n    candidate.state === 'current_accepted' && readiness.state === 'current_ready'\n      ? {\n          releaseAuthorityDigest: candidate.releaseAuthorityDigest,\n          candidateArtifactId: candidate.candidateArtifactId,\n          publicTreeDigest: candidate.publicTreeDigest,\n          datasetVersion: candidate.datasetVersion,\n          schemaVersion: candidate.schemaVersion,\n          candidateReceiptDigest: candidate.receiptDigest,\n          readinessReceiptDigest: readiness.receiptDigest,\n        }\n      : null;\n  const authorizationId = digest({\n    commit,\n    binding,\n    productionEvidenceBinding,\n    operatorDigests,"
          if old not in text: raise SystemExit('authorization id anchor missing')
          text = text.replace(old, new, 1)

          old = "      configuredStagingAuthorization: {\n        path: staging.path,\n        state: staging.state,\n        generatedAt: staging.generatedAt,\n        workflowRunId: staging.workflowRunId,\n      },\n      predecessors: staging.predecessors,"
          new = "      configuredStagingAuthorization: {\n        path: staging.path,\n        state: staging.state,\n        generatedAt: staging.generatedAt,\n        workflowRunId: staging.workflowRunId,\n      },\n      p605ReleaseAuthority: {\n        path: p605.path,\n        state: p605.state,\n        generatedAt: p605.generatedAt,\n        expiresAt: p605.expiresAt,\n        releaseIdDigest: p605.releaseIdDigest,\n      },\n      productionCandidateBootstrap: {\n        path: candidate.path,\n        state: candidate.state,\n        generatedAt: candidate.generatedAt,\n        expiresAt: candidate.expiresAt,\n        candidateArtifactId: candidate.candidateArtifactId,\n        datasetVersion: candidate.datasetVersion,\n        schemaVersion: candidate.schemaVersion,\n      },\n      productionReadiness: {\n        path: readiness.path,\n        state: readiness.state,\n        generatedAt: readiness.generatedAt,\n        expiresAt: readiness.expiresAt,\n      },\n      predecessors: staging.predecessors,"
          if old not in text: raise SystemExit('receipt checks anchor missing')
          text = text.replace(old, new, 1)

          old = "        boundedByPredecessorExpiry:\n          staging.earliestExpiry === null ? null : new Date(staging.earliestExpiry).toISOString(),"
          new = "        boundedByPredecessorExpiry:\n          evidenceExpiry === null ? null : new Date(evidenceExpiry).toISOString(),\n        boundedByProductionEvidence: true,"
          if old not in text: raise SystemExit('ttl receipt anchor missing')
          text = text.replace(old, new, 1)

          old = "    binding,\n    blockers: uniqueBlockers,"
          new = "    binding,\n    productionEvidenceBinding,\n    blockers: uniqueBlockers,"
          if old not in text: raise SystemExit('binding receipt anchor missing')
          text = text.replace(old, new, 1)

          fixture_anchor = "\nfunction assert(value, message) {"
          fixture_helpers = r'''

function fixtureP605(commit, now) {
  const releaseId = digest('production-release-authority');
  return {
    version: 1,
    evidenceId: 'P6-05',
    environment: 'configured_staging',
    state: 'accepted',
    commit,
    generatedAt: new Date(now.getTime() - 60_000).toISOString(),
    expiresAt: new Date(now.getTime() + 90 * 60_000).toISOString(),
    checks: {
      artifactValidation: { status: 'passed' },
      releases: { status: 'passed', candidate: { releaseId } },
      external: { status: 'passed' },
      finalState: { status: 'passed', activeKind: 'candidate' },
    },
  };
}

function fixtureCandidate(commit, now, p605) {
  return {
    version: 1,
    evidenceId: 'P6-08-CANDIDATE',
    state: 'accepted',
    environment: 'configured_production_candidate',
    commit,
    generatedAt: new Date(now.getTime() - 30_000).toISOString(),
    expiresAt: new Date(now.getTime() + 60 * 60_000).toISOString(),
    releaseAuthorityDigest: digest(p605.checks.releases.candidate.releaseId),
    p605ReceiptDigest: digest(JSON.stringify(p605)),
    publicTreeDigest: 'a'.repeat(64),
    candidateArtifactId: digest('candidate-artifact'),
    datasetVersion: 'production-candidate-test',
    schemaVersion: '1.0.0',
    checks: {
      projectTopology: { safe: true },
      runtimeSecrets: 'configured_by_protected_workflow',
      deployment: 'passed',
      externalVerification: 'passed',
      liveDomainMutation: false,
      dnsMutation: false,
      canonicalHostMutation: false,
    },
    exceptions: [],
  };
}

function fixtureReadiness(commit, now, p605) {
  const releaseIdDigest = digest(p605.checks.releases.candidate.releaseId);
  return {
    version: 1,
    evidenceId: 'P6-08-READINESS',
    state: 'diagnosed',
    decision: 'ready',
    environment: 'configured_production',
    commit,
    generatedAt: now.toISOString(),
    expiresAt: new Date(now.getTime() + 45 * 60_000).toISOString(),
    checks: {
      exactRepositoryContract: 'passed',
      p605: { state: 'current', releaseIdDigest },
      githubEnvironment: { name: 'production', state: 'present', protectionRuleCount: 1 },
      runtimeSecrets: { requiredCount: 4, configuredCount: 4, missingNames: [] },
