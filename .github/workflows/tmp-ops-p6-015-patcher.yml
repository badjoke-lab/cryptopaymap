name: Temporary OPS-P6-015 patcher

on:
  push:
    branches:
      - ops-p6-015-bind-production-authorization
    paths:
      - '.github/workflows/tmp-ops-p6-015-patcher.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-015-bind-production-authorization
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch and validate authorization binding
        run: |
          set -euo pipefail
          python tmp-ops-p6-015-patch.py
          npx biome check --write \
            scripts/evaluate-ops-p6-012-production-authorization.mjs \
            scripts/check-ops-p6-012-production-authorization.mjs
          node scripts/check-ops-p6-012-production-authorization.mjs
          node scripts/evaluate-ops-p6-012-production-authorization.mjs --self-test
          mkdir -p validated-patch/scripts validated-patch/.github/workflows validated-patch/docs
          cp scripts/evaluate-ops-p6-012-production-authorization.mjs validated-patch/scripts/
          cp scripts/check-ops-p6-012-production-authorization.mjs validated-patch/scripts/
          cp .github/workflows/ops-p6-012-configured-production-authorization.yml validated-patch/.github/workflows/
          cp docs/OPS_P6_012_CONFIGURED_PRODUCTION_AUTHORIZATION.md validated-patch/docs/
      - name: Upload validated authorization patch
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-015-validated-patch
          path: validated-patch
          if-no-files-found: error
          retention-days: 1
