name: Temporary OPS-P6-015 patcher

on:
  push:
    branches:
      - ops-p6-015-bind-production-authorization
    paths:
      - '.github/workflows/tmp-ops-p6-015-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-015-bind-production-authorization
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch authorization binding, validate, and remove temporary files
        run: |
          set -euo pipefail
          python tmp-ops-p6-015-patch.py
          npx biome check --write \
            scripts/evaluate-ops-p6-012-production-authorization.mjs \
            scripts/check-ops-p6-012-production-authorization.mjs
          node scripts/check-ops-p6-012-production-authorization.mjs
          node scripts/evaluate-ops-p6-012-production-authorization.mjs --self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-ops-p6-015-patcher.yml tmp-ops-p6-015-patch.py
          git add \
            scripts/evaluate-ops-p6-012-production-authorization.mjs \
            scripts/check-ops-p6-012-production-authorization.mjs \
            .github/workflows/ops-p6-012-configured-production-authorization.yml \
            docs/OPS_P6_012_CONFIGURED_PRODUCTION_AUTHORIZATION.md
          git commit -m 'OPS-P6-015: bind production authorization to candidate readiness'
          git push origin HEAD:ops-p6-015-bind-production-authorization
