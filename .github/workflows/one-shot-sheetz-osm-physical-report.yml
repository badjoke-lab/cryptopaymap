name: One-shot Sheetz OSM physical report
on:
  push:
    branches: [feat/physical-source-first-growth]
    paths:
      - scripts/report-sheetz-osm-physical-staging.ts
      - .github/workflows/one-shot-sheetz-osm-physical-report.yml
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Report Sheetz physical Candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/report-sheetz-osm-physical-staging.ts