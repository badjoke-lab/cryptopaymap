name: One-shot Place record enrichment staging

on:
  push:
    branches:
      - feat/place-record-enrichment
    paths:
      - ops/run-place-record-enrichment.trigger

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Audit richness before enrichment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: |
          set -o pipefail
          npx tsx scripts/audit-place-record-richness-staging.ts 2>&1 | tee place-richness-before.json
      - name: Backfill OSM source-backed profile fields
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: |
          set -o pipefail
          npx tsx scripts/backfill-osm-published-place-profiles-staging.ts 2>&1 | tee osm-profile-enrichment.log
      - name: Backfill missing OSM region/address profile from reverse geocoding
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_OSM_PROFILE_REVERSE_MAX: '100'
        run: |
          set -o pipefail
          npx tsx scripts/restore-osm-quarantined-place-profiles-staging.ts 2>&1 | tee osm-region-enrichment.log
      - name: Audit richness after enrichment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: |
          set -o pipefail
          npx tsx scripts/audit-place-record-richness-staging.ts 2>&1 | tee place-richness-after.json
      - name: Materialize reviewed staging records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/materialize-public-data-from-staging-db.ts
      - name: Validate fixed Place taxonomy
        run: node scripts/validate-public-place-category-taxonomy.mjs public/data/places.json
      - name: Validate Place detail contract
        run: node scripts/validate-public-place-detail-contract.mjs public/data/places.json
      - run: npm run build
      - run: node scripts/prepare-staging-review-artifact.mjs
      - name: Deploy isolated staging review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name cryptopaymap-staging --branch place-record-enrichment-review
      - name: Upload enrichment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: place-record-enrichment-proof
          path: |
            place-richness-before.json
            osm-profile-enrichment.log
            osm-region-enrichment.log
            place-richness-after.json
          if-no-files-found: error
          retention-days: 7
