name: OPS-P6-001H R2 capability diagnostic

on:
  push:
    branches:
      - agent/ops-p6-001h-configured-r2-media-lifecycle
    paths:
      - '.github/workflows/ops-p6-001h-r2-capability-diagnostic.yml'
      - 'scripts/diagnose-ops-p6-001h-r2-capability.mjs'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001h-r2-capability-diagnostic.yml'
      - 'scripts/diagnose-ops-p6-001h-r2-capability.mjs'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      CPM_R2_ACCOUNT_ID: ${{ secrets.CPM_R2_ACCOUNT_ID }}
      CPM_R2_PHOTO_QUARANTINE_BUCKET: ${{ secrets.CPM_R2_PHOTO_QUARANTINE_BUCKET }}
      CPM_R2_ACCESS_KEY_ID: ${{ secrets.CPM_R2_ACCESS_KEY_ID }}
      CPM_R2_SECRET_ACCESS_KEY: ${{ secrets.CPM_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001h-configured-r2-media-lifecycle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run bounded R2 capability diagnostic
        run: node scripts/diagnose-ops-p6-001h-r2-capability.mjs
