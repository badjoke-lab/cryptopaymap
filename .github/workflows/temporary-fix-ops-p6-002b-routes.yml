name: Temporary fix OPS-P6-002B representative routes

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-fix-ops-p6-002b-routes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Q5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-002b-p6-07-incident-exercise-final-receipt

      - name: Replace nonexistent routes with retained P6-05 representatives
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.mjs')
          text = path.read_text()
          old = """async function reverify(binding, fetchImpl) {
            const [home, locations, businesses, version, manifest, adminDenial] = await Promise.all([
              probe('/', [200], 'text/html', fetchImpl),
              probe('/locations/', [200], 'text/html', fetchImpl),
              probe('/businesses/', [200], 'text/html', fetchImpl),
              probe('/version.json', [200], 'application/json', fetchImpl),
              probe('/data/manifest.json', [200], 'application/json', fetchImpl),
              probe('/admin/api/dashboard', [401, 403], 'text/plain', fetchImpl),
            ]);"""
          new = """async function reverify(binding, fetchImpl) {
            const [
              home,
              places,
              representativePlace,
              online,
              representativeService,
              version,
              manifest,
              adminDenial,
            ] = await Promise.all([
              probe('/', [200], 'text/html', fetchImpl),
              probe('/places/', [200], 'text/html', fetchImpl),
              probe('/place/staging-coffee-tokyo/', [200], 'text/html', fetchImpl),
              probe('/online/', [200], 'text/html', fetchImpl),
              probe('/service/staging-vpn/', [200], 'text/html', fetchImpl),
              probe('/version.json', [200], 'application/json', fetchImpl),
              probe('/data/manifest.json', [200], 'application/json', fetchImpl),
              probe('/admin/api/dashboard', [401, 403], 'text/plain', fetchImpl),
            ]);"""
          if text.count(old) != 1:
            raise SystemExit(f'reverify route block mismatch: {text.count(old)}')
          text = text.replace(old, new)
          old_checks = "const checks = { home, locations, businesses, version, manifest, adminDenial, release };"
          new_checks = """const checks = {
            home,
            places,
            representativePlace,
            online,
            representativeService,
            version,
            manifest,
            adminDenial,
            release,
          };"""
          if text.count(old_checks) != 1:
            raise SystemExit(f'checks block mismatch: {text.count(old_checks)}')
          text = text.replace(old_checks, new_checks)
          old_mock = "if (['/', '/locations/', '/businesses/'].includes(url.pathname)) {"
          new_mock = """if (
            [
              '/',
              '/places/',
              '/place/staging-coffee-tokyo/',
              '/online/',
              '/service/staging-vpn/',
            ].includes(url.pathname)
          ) {"""
          if text.count(old_mock) != 1:
            raise SystemExit(f'mock route block mismatch: {text.count(old_mock)}')
          path.write_text(text.replace(old_mock, new_mock))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format and verify route repair
        run: |
          npx biome format --write \
            scripts/run-ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.mjs
          npm run format:check
          npm run lint
          npm run check
          node scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js
          node scripts/check-ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.mjs
          node scripts/run-ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.mjs --self-test

      - name: Publish route repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-ops-p6-002b-configured-staging-p6-07-incident-exercise-final-receipt.mjs
          git commit -m 'Bind Q5 reverification to P6-05 public routes'
          git push origin HEAD:agent/ops-p6-002b-p6-07-incident-exercise-final-receipt
