name: P5-08B public intake and private status audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'docs/P5_08A_MVP_B_INTEGRATION_AUDIT_MATRIX.md'
      - 'docs/P5_08B_PUBLIC_INTAKE_PRIVATE_STATUS_AUDIT.md'
      - 'docs/PROJECT_STATUS.md'
      - 'scripts/check-p5-08b-public-intake-private-status-audit.js'
      - '.github/workflows/p5-08b-public-intake-private-status-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run P5-08B public intake and private status audit
        run: node scripts/check-p5-08b-public-intake-private-status-audit.js