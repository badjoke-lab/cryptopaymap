name: OPS-P6-001R configured staging P6-06 continuity revalidation

on:
  pull_request:
    paths:
      - '.github/workflows/ops-p6-001r-configured-staging-p6-06-continuity-revalidation.yml'
      - 'docs/OPS_P6_001R_CONFIGURED_STAGING_P6_06_CONTINUITY_REVALIDATION.md'
      - 'docs/P6_06_CONFIGURED_DOMAIN_CUTOVER_ROLLBACK_EVIDENCE.md'
      - 'scripts/run-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs'
      - 'scripts/check-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs'
      - 'scripts/check-p6-06-configured-domain-cutover-rollback-evidence.js'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001r-configured-staging-p6-06-continuity-revalidation.yml'
      - 'docs/OPS_P6_001R_CONFIGURED_STAGING_P6_06_CONTINUITY_REVALIDATION.md'
      - 'docs/P6_06_CONFIGURED_DOMAIN_CUTOVER_ROLLBACK_EVIDENCE.md'
      - 'scripts/run-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs'
      - 'scripts/check-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs'
      - 'scripts/check-p6-06-configured-domain-cutover-rollback-evidence.js'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter REVALIDATE_CONFIGURED_STAGING_P6_06_CONTINUITY exactly.
        required: true
        type: string
      approved_commit:
        description: Exact 40-character current main commit SHA.
        required: true
        type: string
      domain_owner:
        description: Bounded configured staging domain continuity owner identity.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ops-p6-001r-configured-staging-p6-06-continuity-revalidation
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Check repository P6-06 evidence contract
        run: node scripts/check-p6-06-configured-domain-cutover-rollback-evidence.js

      - name: Check P6-06 continuity contract
        run: node scripts/check-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs

      - name: Run P6-06 continuity self-test
        run: node scripts/run-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs --self-test

  revalidate:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      DOMAIN_OWNER: ${{ inputs.domain_owner }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify exact current main
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          current_main_commit="$(git -C source rev-parse origin/main)"
          test "$current_main_commit" = "$APPROVED_COMMIT"

      - name: Recheck exact-source repository contract
        id: repository_contract
        continue-on-error: true
        working-directory: source
        run: |
          npm run check
          node scripts/check-p6-06-configured-domain-cutover-rollback-evidence.js
          node scripts/check-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs
          node scripts/run-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs --self-test

      - name: Revalidate configured staging P6-06 continuity
        env:
          REPOSITORY_CONTRACT_OUTCOME: ${{ steps.repository_contract.outcome }}
        working-directory: source
        run: |
          node scripts/run-ops-p6-001r-configured-staging-p6-06-continuity-revalidation.mjs \
            ../status \
            ../p6-06-domain-cutover-rollback-receipt.json

      - name: Upload bounded P6-06 continuity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-001r-configured-staging-p6-06-continuity-revalidation
          path: p6-06-domain-cutover-rollback-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish P6-06 continuity receipt
        if: always()
        run: |
          set -euo pipefail
          test -f p6-06-domain-cutover-rollback-receipt.json
          mkdir -p status/config/staging-authorization
          cp p6-06-domain-cutover-rollback-receipt.json \
            status/config/staging-authorization/p6-06-domain-cutover-rollback-receipt.json
          git -C status config user.name 'github-actions[bot]'
          git -C status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C status add config/staging-authorization/p6-06-domain-cutover-rollback-receipt.json
          if ! git -C status diff --cached --quiet; then
            git -C status commit -m 'Record configured staging P6-06 continuity revalidation'
            git -C status push origin HEAD:staging-review
          fi

      - name: Write P6-06 continuity summary
        if: always()
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync } = require('node:fs');
          if (!existsSync('p6-06-domain-cutover-rollback-receipt.json')) process.exit(0);
          const receipt = JSON.parse(
            readFileSync('p6-06-domain-cutover-rollback-receipt.json', 'utf8'),
          );
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Configured staging P6-06 continuity revalidation',
              '',
              `- State: \`${receipt.state}\``,
              `- Commit: \`${receipt.commit}\``,
              `- Diagnostic: \`${receipt.checks.diagnostic.state}\``,
              `- Prior evidence: \`${receipt.checks.continuity.status}\``,
              `- Existing topology reused: \`${receipt.checks.duplicate.reused}\``,
              `- Current external final: \`${receipt.checks.externalFinal.status}\``,
              `- Exceptions: ${receipt.exceptions.length === 0 ? 'none' : receipt.exceptions.map((value) => `\`${value}\``).join(', ')}`,
              '',
            ].join('\n'),
          );
          NODE

      - name: Enforce accepted continuity receipt
        if: always()
        run: |
          node -e "const r=require('./p6-06-domain-cutover-rollback-receipt.json'); if(r.state!=='accepted'||r.exceptions.length!==0) process.exit(1)"
