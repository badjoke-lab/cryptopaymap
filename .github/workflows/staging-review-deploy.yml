name: Staging review deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: staging-review-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare source-aware Place materializer
        run: node scripts/prepare-source-first-materializer-staging.mjs

      - name: Materialize public data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo 'DATABASE_URL is required for source-backed staging review materialization.' >&2
            exit 1
          fi
          npx tsx scripts/materialize-public-data-from-staging-db.ts

      - name: Materialize real Place verification and change history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/materialize-public-place-history-staging.ts

      - name: Validate published Place detail contract
        run: node scripts/validate-public-place-detail-contract.mjs public/data/places.json

      - name: Validate public Place history coverage and privacy
        run: node scripts/validate-public-place-history-contract.mjs public/data/places.json public/data/place-history.json

      - name: Build
        run: npm run build

      - name: Prepare review artifact
        run: node scripts/prepare-staging-review-artifact.mjs

      - name: Deploy staging review to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name cryptopaymap-staging
          --branch review
