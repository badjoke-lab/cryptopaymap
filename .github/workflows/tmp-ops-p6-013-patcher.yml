name: Temporary OPS-P6-013 patcher

on:
  push:
    branches:
      - ops-p6-013-production-readiness
    paths:
      - '.github/workflows/tmp-ops-p6-013-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-013-production-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch, format, validate, and remove temporary workflow
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/run-ops-p6-013-production-readiness-diagnostic.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const old = "async function cloudflareRequest(path, label) {\n  const token = process.env.CLOUDFLARE_API_TOKEN;";
          const replacement = "async function cloudflareRequest(path, label) {\n  const method = 'GET';\n  const token = process.env.CLOUDFLARE_API_TOKEN;";
          if (!text.includes(old)) throw new Error('cloudflareRequest anchor missing');
          text = text.replace(old, replacement);
          const fetchOld = "  const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {\n    headers: { Authorization: `Bearer ${token}` },";
          const fetchReplacement = "  const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {\n    method,\n    headers: { Authorization: `Bearer ${token}` },";
          if (!text.includes(fetchOld)) throw new Error('Cloudflare fetch anchor missing');
          text = text.replace(fetchOld, fetchReplacement);
          fs.writeFileSync(path, text);
          NODE
          npx biome check --write \
            scripts/run-ops-p6-013-production-readiness-diagnostic.mjs \
            scripts/check-ops-p6-013-production-readiness-diagnostic.mjs
          node scripts/check-ops-p6-013-production-readiness-diagnostic.mjs
          node scripts/run-ops-p6-013-production-readiness-diagnostic.mjs --self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-ops-p6-013-patcher.yml
          git add \
            scripts/run-ops-p6-013-production-readiness-diagnostic.mjs \
            scripts/check-ops-p6-013-production-readiness-diagnostic.mjs \
            .github/workflows/ops-p6-013-configured-production-readiness-diagnostic.yml \
            docs/OPS_P6_013_CONFIGURED_PRODUCTION_READINESS_DIAGNOSTIC.md
          git commit -m 'OPS-P6-013: finalize read-only production readiness diagnostic'
          git push origin HEAD:ops-p6-013-production-readiness
