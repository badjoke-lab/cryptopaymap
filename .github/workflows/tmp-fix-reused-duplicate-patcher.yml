name: Temporary fix reused duplicate persistence patcher

on:
  push:
    branches:
      - fix/reused-duplicate-group-persistence
    paths:
      - '.github/workflows/tmp-fix-reused-duplicate-patcher.yml'

permissions:
  contents: write

jobs:
  fix-patcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact signal membership anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/tmp-reused-duplicate-persistence.yml')
          text = path.read_text()
          pattern = re.compile(
              r'          signal_membership_anchor = """    if \(signal\.importBatchId !== plan\.batch\.id\) \{\n.*?          """\n',
              re.S,
          )
          replacement = (
              '          signal_membership_anchor = "    if (signal.importBatchId !== plan.batch.id) {\\n'
              "      throw new CandidateIngestionPersistenceError(\\n"
              "        'invalid_plan',\\n"
              "        'Duplicate signals must reference the persisted import batch.',\\n"
              "      );\\n"
              "    }\\n" + '"\n'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one signal anchor block, replaced {count}')
          path.write_text(text)
          PY
      - name: Commit patcher correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/tmp-reused-duplicate-persistence.yml
          git commit -m 'ops: fix reused duplicate persistence patch anchor'
          git push origin HEAD:fix/reused-duplicate-group-persistence
