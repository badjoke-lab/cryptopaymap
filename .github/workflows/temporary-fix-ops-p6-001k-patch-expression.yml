name: Temporary fix OPS-P6-001K patch expression

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-fix-ops-p6-001k-patch-expression.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/ops-p6-001k-scoped-dns-read'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001k-scoped-dns-read
          fetch-depth: 0

      - name: Repair expression-safe patch source
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/temporary-ops-p6-001k-scoped-dns-read.yml')
          text = path.read_text()
          pattern = re.compile(
              r"          replace\(\n"
              r"              workflow,\n"
              r"              '      CLOUDFLARE_ACCOUNT_ID: .*?\\n',\n"
              r"              '      CLOUDFLARE_ACCOUNT_ID: .*?\\n      P6_06_STAGING_ZONE_ID: .*?\\n',\n"
              r"          \)\n"
          )
          replacement = (
              "          account_expression = '$' + '{{ secrets.CLOUDFLARE_ACCOUNT_ID }}'\n"
              "          zone_expression = '$' + '{{ secrets.P6_06_STAGING_ZONE_ID }}'\n"
              "          replace(\n"
              "              workflow,\n"
              "              f'      CLOUDFLARE_ACCOUNT_ID: {account_expression}\\n',\n"
              "              f'      CLOUDFLARE_ACCOUNT_ID: {account_expression}\\n'\n"
              "              f'      P6_06_STAGING_ZONE_ID: {zone_expression}\\n',\n"
              "          )\n"
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one expression patch block, found {count}')
          path.write_text(updated)
          PY

      - name: Commit repair and remove fixer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-fix-ops-p6-001k-patch-expression.yml
          git add .github/workflows/temporary-ops-p6-001k-scoped-dns-read.yml
          git commit -m 'Fix scoped DNS patch expression handling'
          git push origin HEAD:agent/ops-p6-001k-scoped-dns-read
