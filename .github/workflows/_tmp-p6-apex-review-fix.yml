name: temporary P6 apex review fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_tmp-p6-apex-review-fix.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/p6-apex-canonical'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/p6-apex-canonical
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fix legacy rollback external target and strengthen checks
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, got {text.count(old)}: {old!r}')
              p.write_text(text.replace(old, new))

          replace_once(
              'scripts/run-ops-p6-016-production-go-live-executor.mjs',
              'const response = await fetch(`https://${canonicalHost}/?p6_016_legacy=${Date.now()}`, {',
              'const response = await fetch(`https://${redirectHost}/?p6_016_legacy=${Date.now()}`, {',
          )

          checker = Path('scripts/check-ops-p6-016-production-go-live-executor.mjs')
          text = checker.read_text()
          marker = "  'www_redirect_location_mismatch',\n"
          if text.count(marker) != 1:
              raise SystemExit('P6-016 checker insertion marker mismatch')
          text = text.replace(
              marker,
              marker + "  'https://${redirecthost}/?p6_016_legacy',\n",
          )
          checker.write_text(text)

          p17 = Path('scripts/run-ops-p6-017-production-launch-close.mjs')
          text = p17.read_text()
          old_fixture = """    apexRedirect: { status: 307, locationDigest: digest('location') },
    dns: {
      apexDigest: digest('apex'),
      canonicalAddressCount: 2,
      canonicalDigest: digest('www'),
      legacyCnamePresent: false,
    },
    tls: {
      protocol: 'TLSv1.3',
      validTo: '2026-12-01T00:00:00.000Z',
      certificateDigest: digest('cert'),
      hostnameCovered: true,
    },"""
          new_fixture = """    wwwRedirect: { status: 308, locationDigest: digest('location') },
    dns: {
      apexAddressCount: 2,
      apexDigest: digest('apex'),
      redirectAddressCount: 2,
      redirectDigest: digest('www'),
      legacyCnamePresent: false,
    },
    tls: {
      canonical: {
        protocol: 'TLSv1.3',
        validTo: '2026-12-01T00:00:00.000Z',
        certificateDigest: digest('canonical-cert'),
        hostnameCovered: true,
      },
      redirect: {
        protocol: 'TLSv1.3',
        validTo: '2026-12-01T00:00:00.000Z',
        certificateDigest: digest('redirect-cert'),
        hostnameCovered: true,
      },
    },"""
          if text.count(old_fixture) != 1:
              raise SystemExit(f'P6-017 fixture marker mismatch: {text.count(old_fixture)}')
          text = text.replace(old_fixture, new_fixture)

          old_normalize = """      sample?.admin?.status !== 403 ||
      sample?.dns?.legacyCnamePresent !== false ||
      sample?.release?.candidateArtifactId === undefined"""
          new_normalize = """      sample?.admin?.status !== 403 ||
      sample?.wwwRedirect?.status !== 308 ||
      !Number.isInteger(sample?.dns?.apexAddressCount) ||
      sample.dns.apexAddressCount < 1 ||
      !Number.isInteger(sample?.dns?.redirectAddressCount) ||
      sample.dns.redirectAddressCount < 1 ||
      sample?.dns?.legacyCnamePresent !== false ||
      sample?.tls?.canonical?.hostnameCovered !== true ||
      sample?.tls?.redirect?.hostnameCovered !== true ||
      sample?.release?.candidateArtifactId === undefined"""
          if text.count(old_normalize) != 1:
              raise SystemExit(f'P6-017 normalize marker mismatch: {text.count(old_normalize)}')
          p17.write_text(text.replace(old_normalize, new_normalize))

          checker17 = Path('scripts/check-ops-p6-017-production-launch-close.mjs')
          text = checker17.read_text()
          marker17 = "  'www_redirect_mismatch',\n"
          if text.count(marker17) != 1:
              raise SystemExit('P6-017 checker insertion marker mismatch')
          text = text.replace(
              marker17,
              marker17 + "  'wwwredirect?.status !== 308',\n  'apexaddresscount',\n  'redirectaddresscount',\n",
          )
          checker17.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate hardened apex topology
        run: |
          npm run check
          node scripts/materialize-production-machine-files.mjs --self-test
          node scripts/check-ops-p6-014-production-candidate-bootstrap.mjs
          node scripts/run-ops-p6-014-production-candidate-bootstrap.mjs --self-test
          node scripts/check-ops-p6-016-production-go-live-executor.mjs
          node scripts/run-ops-p6-016-production-go-live-executor.mjs --self-test
          node scripts/check-ops-p6-017-production-launch-close.mjs
          node scripts/run-ops-p6-017-production-launch-close.mjs --self-test
          git diff --check

      - name: Reject old WWW-canonical markers
        run: |
          set -euo pipefail
          if git grep -n -F "canonicalHost = 'www.cryptopaymap.com'" -- . ':!node_modules'; then exit 1; fi
          if git grep -n -F "canonicalOrigin = 'https://www.cryptopaymap.com'" -- . ':!node_modules'; then exit 1; fi
          if git grep -n -F 'canonical `www.cryptopaymap.com`' -- . ':!node_modules'; then exit 1; fi
          if git grep -n -F 'canonical WWW hostname' -- . ':!node_modules'; then exit 1; fi
          if git grep -n -F 'https://www.cryptopaymap.com/sitemap.xml' -- . ':!node_modules'; then exit 1; fi

      - name: Commit hardened patch and remove temporary workflow
        run: |
          rm .github/workflows/_tmp-p6-apex-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P6: harden apex cutover verification'
          git push origin HEAD:ops/p6-apex-canonical
