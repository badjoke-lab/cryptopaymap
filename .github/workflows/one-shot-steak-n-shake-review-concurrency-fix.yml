name: One-shot Steak n Shake review concurrency fix

on:
  push:
    branches:
      - feat/steak-n-shake-btc-growth
    paths:
      - .github/workflows/one-shot-steak-n-shake-review-concurrency-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steak-n-shake-btc-growth
      - name: Replace obsolete loop continue inside processCandidate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/ingest-review-steak-n-shake-official-source-first-staging.ts')
          text = path.read_text()
          old = """    if (claim.status === 'confirmed') {\n      counters.alreadyConfirmed += 1;\n      continue;\n    }\n"""
          new = """    if (claim.status === 'confirmed') {\n      counters.alreadyConfirmed += 1;\n      return;\n    }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one confirmed-claim continue block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and push review return fix
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/ingest-review-steak-n-shake-official-source-first-staging.ts
          git commit -m "FIX: return from already-confirmed Steak n Shake review"
          git push origin HEAD:feat/steak-n-shake-btc-growth
