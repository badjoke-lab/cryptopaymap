name: One-shot Steak n Shake review concurrency fix

on:
  push:
    branches:
      - feat/steak-n-shake-btc-growth
    paths:
      - .github/workflows/one-shot-steak-n-shake-review-concurrency-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steak-n-shake-btc-growth
      - name: Apply bounded concurrency to independent location reviews
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/ingest-review-steak-n-shake-official-source-first-staging.ts')
          text = path.read_text()
          start = "  for (const candidate of candidates) {\n"
          if text.count(start) != 1:
              raise SystemExit(f'expected exactly one candidate loop, found {text.count(start)}')
          text = text.replace(
              start,
              "  const processCandidate = async (candidate: (typeof candidates)[number]) => {\n",
              1,
          )
          end = """    if (merchantState !== 'already_accepted') counters.confirmed += 1;\n  }\n\n  const branchExpansionGatePassed =\n"""
          replacement = """    if (merchantState !== 'already_accepted') counters.confirmed += 1;\n  };\n\n  // Each location has its own Candidate, Entity, Location, Claim, Evidence, and review guards.\n  // Bound concurrency so independent strict reviews do not serialize hundreds of HTTP DB round trips.\n  const REVIEW_CONCURRENCY = 8;\n  for (let offset = 0; offset < candidates.length; offset += REVIEW_CONCURRENCY) {\n    await Promise.all(candidates.slice(offset, offset + REVIEW_CONCURRENCY).map(processCandidate));\n  }\n\n  const branchExpansionGatePassed =\n"""
          if text.count(end) != 1:
              raise SystemExit(f'expected exactly one loop terminator, found {text.count(end)}')
          text = text.replace(end, replacement, 1)
          path.write_text(text)
          PY
      - name: Commit and push concurrency fix
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/ingest-review-steak-n-shake-official-source-first-staging.ts
          git commit -m "PERF: bound Steak n Shake strict review concurrency"
          git push origin HEAD:feat/steak-n-shake-btc-growth
