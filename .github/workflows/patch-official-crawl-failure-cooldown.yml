name: Patch official crawl failure cooldown

on:
  push:
    branches:
      - fix/official-crawl-failure-cooldown
    paths:
      - scripts/_patch-official-crawl-failure-cooldown.py
      - .github/workflows/patch-official-crawl-failure-cooldown.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply cooldown patch
        run: python3 scripts/_patch-official-crawl-failure-cooldown.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit --pretty false
      - name: Commit patch and remove helpers
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/crawl-next-official-payment-evidence-batch.ts scripts/crawl-official-payment-evidence-batch.ts
          git rm scripts/_patch-official-crawl-failure-cooldown.py .github/workflows/patch-official-crawl-failure-cooldown.yml
          git commit -m "FIX: cool down retryable official crawl failures"
          git push origin HEAD:fix/official-crawl-failure-cooldown
