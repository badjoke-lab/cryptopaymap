name: P6-06 configured domain cutover and rollback evidence

on:
  pull_request:
    paths:
      - 'docs/P6_06_CONFIGURED_DOMAIN_CUTOVER_ROLLBACK_EVIDENCE.md'
      - 'docs/P6_05_CONFIGURED_PUBLIC_EXPORT_RELEASE_EVIDENCE.md'
      - 'docs/PROJECT_STATUS.md'
      - 'docs/MIGRATION_AND_CUTOVER.md'
      - 'docs/SECURITY_AND_PRIVACY.md'
      - 'scripts/check-p6-06-configured-domain-cutover-rollback-evidence.js'
      - '.github/workflows/p6-06-configured-domain-cutover-rollback-evidence.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/P6_06_CONFIGURED_DOMAIN_CUTOVER_ROLLBACK_EVIDENCE.md'
      - 'docs/P6_05_CONFIGURED_PUBLIC_EXPORT_RELEASE_EVIDENCE.md'
      - 'docs/PROJECT_STATUS.md'
      - 'docs/MIGRATION_AND_CUTOVER.md'
      - 'docs/SECURITY_AND_PRIVACY.md'
      - 'scripts/check-p6-06-configured-domain-cutover-rollback-evidence.js'
      - '.github/workflows/p6-06-configured-domain-cutover-rollback-evidence.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run P6-06 evidence contract audit
        run: node scripts/check-p6-06-configured-domain-cutover-rollback-evidence.js