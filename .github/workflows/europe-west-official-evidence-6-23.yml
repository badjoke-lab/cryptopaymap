name: Europe-west official Evidence batches 6-23

on:
  push:
    branches:
      - ops/europe-west-official-evidence-6-23
    paths:
      - .github/workflows/europe-west-official-evidence-6-23.yml

permissions:
  contents: read

concurrency:
  group: fixed-review-official-evidence-crawl-6-23
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
      CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: '250'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Crawl batches 6-23
        shell: bash
        run: |
          set -euo pipefail
          batches=(
            eaf3d4d7-76e8-435e-bc9a-d2cb2988552c
            5d664655-8225-414e-b9ba-d2cb2988552c
            99216a90-069f-47d0-804f-dca1116f89dd
            312d3526-3438-47c5-8351-5c2fc242d3c6
            20983068-031d-492b-ac0c-b9a0d93a5e70
            7d43f605-5f3e-4a79-a6a9-a222775821be
            500467c1-075d-4f01-b2ef-15f141f30c82
            cb7bdcb7-e39d-46cb-90fe-0c3c05d45f8e
            d079f027-9ea4-4a9a-9e52-a7753d917986
            aa493ab1-c32b-4b0f-9df7-944f61f90e4c
            61483919-bbf7-4290-80c5-7c51ac8b5445
            234599d9-be62-4139-8f30-2d11700dce80
            431eb7d9-eb7e-4202-aadd-84b5f7e4a3f1
            c5c63726-d420-42ac-adb4-a88962580936
            9151fb61-886c-4bed-b122-e35eebaa8f92
            363bdf08-e6b6-48c1-9d5d-38a0f772eb9d
            5a9cc8b9-0926-4f43-b186-bead18af7e31
            7c4bc14b-60ac-4925-869f-d45624b19eab
          )

          total_targets=0
          total_landing=0
          total_internal=0
          total_discovered=0
          total_created=0

          for batch_id in "${batches[@]}"; do
            export CPM_OFFICIAL_EVIDENCE_BATCH_IDS="$batch_id"
            summary="$(npx tsx scripts/crawl-official-payment-evidence-batch.ts)"
            jq -e '.target == "fixed-review-staging" and .automaticConfirmedCount == 0 and .candidateStateChanged == false and .evidenceVisibility == "private" and .evidenceReviewStatus == "pending" and .payloadExposed == false' <<<"$summary" >/dev/null
            total_targets=$((total_targets + $(jq -r '.targets' <<<"$summary")))
            total_landing=$((total_landing + $(jq -r '.landingPagesFetched' <<<"$summary")))
            total_internal=$((total_internal + $(jq -r '.internalPagesFetched' <<<"$summary")))
            total_discovered=$((total_discovered + $(jq -r '.explicitDiscovered' <<<"$summary")))
            total_created=$((total_created + $(jq -r '.pendingEvidenceCreated' <<<"$summary")))
          done

          {
            echo '## Europe-west Evidence expansion'
            echo
            echo "- batches processed: ${#batches[@]}"
            echo "- crawled targets: $total_targets"
            echo "- landing pages fetched: $total_landing"
            echo "- internal pages fetched: $total_internal"
            echo "- explicit official Evidence discovered: $total_discovered"
            echo "- pending private Evidence created: $total_created"
            echo '- automatic Confirmed: 0'
            echo '- Candidate payload exposed: false'
          } >> "$GITHUB_STEP_SUMMARY"
