name: Temporary fix OPS-P6-002A database identity

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-fix-ops-p6-002a-database-identity.yml'

permissions:
  contents: write

concurrency:
  group: temporary-fix-ops-p6-002a-database-identity
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Q4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-002a-p6-07-isolated-restore

      - name: Harden database identity and RPO wall clock
        run: |
          python - <<'PY'
          from pathlib import Path

          executor_path = Path('scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs')
          text = executor_path.read_text()

          replacements = [
            (
              "select current_database() || '|' || current_user || '|' || coalesce(inet_server_addr()::text, 'local') || '|' || coalesce(inet_server_port()::text, 'local')",
              "select current_database() || '|' || coalesce(inet_server_addr()::text, 'local') || '|' || coalesce(inet_server_port()::text, 'local')",
              1,
            ),
            (
              "    database: decodeURIComponent(url.pathname.slice(1)),\n    user: decodeURIComponent(url.username),",
              "    database: decodeURIComponent(url.pathname.slice(1)),",
              1,
            ),
            (
              "    timer = () => performance.now(),\n  } = {},",
              "    timer = () => performance.now(),\n    wallClock = () => Date.now(),\n  } = {},",
              1,
            ),
            (
              "    const restoreStartWallClock = now.getTime();",
              "    const restoreStartWallClock = wallClock();",
              1,
            ),
            (
              "    const targetUrl =\n      'postgresql://restore:secret@restore.invalid/cpm_p6_07_restore_test?sslmode=require';\n    const env = {",
              "    const targetUrl =\n      'postgresql://restore:secret@restore.invalid/cpm_p6_07_restore_test?sslmode=require';\n    const sameDatabaseFirstUser =\n      'postgresql://first:secret@same.invalid/same_database?sslmode=require';\n    const sameDatabaseSecondUser =\n      'postgresql://second:secret@same.invalid/same_database?sslmode=require';\n    if (\n      databaseIdentityFromUrl(sameDatabaseFirstUser) !==\n      databaseIdentityFromUrl(sameDatabaseSecondUser)\n    ) {\n      throw new Error('same_database_auth_variation_not_rejected');\n    }\n    const fixedWallClock = () => now.getTime();\n    const env = {",
              1,
            ),
          ]
          for old, new, expected in replacements:
            count = text.count(old)
            if count != expected:
              raise SystemExit(f'executor hardening marker mismatch: expected {expected}, found {count}: {old[:80]}')
            text = text.replace(old, new)

          source_root_marker = "      sourceRoot: root,\n"
          source_root_count = text.count(source_root_marker)
          if source_root_count != 7:
            raise SystemExit(f'self-test execute option count mismatch: {source_root_count}')
          text = text.replace(
            source_root_marker,
            "      sourceRoot: root,\n      wallClock: fixedWallClock,\n",
          )
          executor_path.write_text(text)

          checker_path = Path('scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs')
          checker = checker_path.read_text()
          anchor = "  [files.executor, \"throw new Error('same_database_identity_not_rejected')\"],"
          replacement = "  [files.executor, \"throw new Error('same_database_identity_not_rejected')\"],\n  [files.executor, \"throw new Error('same_database_auth_variation_not_rejected')\"],\n  [files.executor, 'wallClock = () => Date.now()'],\n  [files.executor, 'const restoreStartWallClock = wallClock()'],"
          if checker.count(anchor) != 1:
            raise SystemExit(f'checker hardening anchor mismatch: {checker.count(anchor)}')
          checker = checker.replace(anchor, replacement)
          final_anchor = "if (!files.executor.includes(\"throw new Error('target_disposal_failed')\")) {"
          extra = "if (files.executor.includes(\"current_database() || '|' || current_user\")) {\n  throw new Error('OPS-P6-002A runtime database identity must not depend on the login role.');\n}\nif (/database:\\s*decodeURIComponent\\(url\\.pathname\\.slice\\(1\\)\\),\\s*user:/.test(files.executor)) {\n  throw new Error('OPS-P6-002A URL database identity must not depend on the login role.');\n}\n\nif (!files.executor.includes(\"throw new Error('target_disposal_failed')\")) {"
          if checker.count(final_anchor) != 1:
            raise SystemExit(f'checker final anchor mismatch: {checker.count(final_anchor)}')
          checker_path.write_text(checker.replace(final_anchor, extra))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format and verify hardened Q4 implementation
        run: |
          npm run format
          node --check scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs
          npm run check
          node scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js
          node scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs
          node scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs --self-test

      - name: Publish hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs
          git commit -m 'Harden Q4 database identity and RPO timing'
          git push origin HEAD:agent/ops-p6-002a-p6-07-isolated-restore
