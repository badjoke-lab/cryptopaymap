name: OPS-P6-001F run exact-main evidence once

on:
  push:
    branches:
      - agent/ops-p6-001f-run-exact-main-evidence
    paths:
      - '.github/workflows/ops-p6-001f-run-exact-main-evidence-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  sequence:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: badjoke-lab/cryptopaymap
      MAIN_SHA: 09c2e377fcfbd65273497bfb2297a7543361fd15
    steps:
      - name: Check out control branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001f-run-exact-main-evidence

      - name: Dispatch and wait for exact-main evidence
        run: |
          set -euo pipefail

          find_run() {
            local workflow="$1"
            for _ in $(seq 1 30); do
              run_id="$(gh run list \
                --repo "$REPOSITORY" \
                --workflow "$workflow" \
                --branch main \
                --event workflow_dispatch \
                --limit 30 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$MAIN_SHA\") | .databaseId" \
                | head -n 1)"
              if [ -n "$run_id" ]; then
                printf '%s' "$run_id"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          gh workflow run ops-p6-001d-configured-staging-p6-01-data-qa.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f confirmation=EXECUTE_CONFIGURED_STAGING_P6_01 \
            -f approved_commit="$MAIN_SHA" \
            -f data_owner=badjoke-lab:data-operations
          p601_run_id="$(find_run ops-p6-001d-configured-staging-p6-01-data-qa.yml)"
          gh run watch "$p601_run_id" --repo "$REPOSITORY" --exit-status

          gh workflow run ops-p6-001e-configured-staging-p6-02-identity-admin.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f confirmation=EXECUTE_CONFIGURED_STAGING_P6_02 \
            -f approved_commit="$MAIN_SHA" \
            -f identity_owner=badjoke-lab:identity-operations
          p602_run_id="$(find_run ops-p6-001e-configured-staging-p6-02-identity-admin.yml)"
          gh run watch "$p602_run_id" --repo "$REPOSITORY" --exit-status

          cat > ops-p6-001f-exact-main-sequence.json <<JSON
          {
            "mainCommit": "$MAIN_SHA",
            "p601RunId": "$p601_run_id",
            "p602RunId": "$p602_run_id",
            "status": "complete"
          }
          JSON

      - name: Commit bounded sequence status
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops-p6-001f-exact-main-sequence.json
          git commit -m 'OPS-P6-001F record exact-main evidence sequence'
          git push origin HEAD:agent/ops-p6-001f-run-exact-main-evidence
