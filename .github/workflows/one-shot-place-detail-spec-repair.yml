name: One-shot Place detail spec repair staging review

on:
  push:
    branches:
      - feat/physical-source-first-growth
    paths:
      - ops/run-place-detail-spec-repair.trigger

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --check scripts/prepare-source-first-materializer-staging.mjs
      - run: node --check scripts/validate-public-place-detail-contract.mjs
      - name: Prepare source-first materializer with required Place profile fields
        run: node scripts/prepare-source-first-materializer-staging.mjs
      - name: Materialize current reviewed staging records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/materialize-public-data-from-staging-db.ts
      - name: Validate every published Place detail contract
        run: node scripts/validate-public-place-detail-contract.mjs public/data/places.json
      - name: Assert Chipotle source repair remains intact
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const data = JSON.parse(await readFile('public/data/places.json', 'utf8'));
          const chipotle = data.records.filter((place) => /chipotle/i.test(place.name));
          if (chipotle.length < 1) throw new Error('Expected at least one Chipotle public Place.');
          const wrongCategory = chipotle.filter((place) => place.categorySlug !== 'restaurant');
          const missingDescription = chipotle.filter(
            (place) => typeof place.description !== 'string' || place.description.trim().length < 1,
          );
          if (wrongCategory.length || missingDescription.length) {
            throw new Error(
              `Place profile regression: chipotle=${chipotle.length} wrongCategory=${wrongCategory.length} missingDescription=${missingDescription.length}`,
            );
          }
          console.log(
            JSON.stringify({
              chipotlePlaces: chipotle.length,
              category: 'restaurant',
              descriptionsPresent: chipotle.length,
            }),
          );
          NODE
      - run: npm run build
      - run: node scripts/prepare-staging-review-artifact.mjs
      - name: Deploy isolated staging review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name cryptopaymap-staging --branch physical-growth-review
