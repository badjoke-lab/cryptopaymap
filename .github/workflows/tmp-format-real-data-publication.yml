name: Temporary real-data publication formatter

on:
  push:
    branches:
      - fix/real-data-staging-publication
    paths:
      - 'scripts/materialize-public-data-from-staging-db.ts'
      - 'scripts/node-runtime-shims.d.ts'
      - 'scripts/publish-tokyo-confirmed-canonical-staging.ts'
      - '.github/workflows/tmp-format-real-data-publication.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format repository-owned TypeScript
        run: npx biome format --write scripts/materialize-public-data-from-staging-db.ts scripts/node-runtime-shims.d.ts scripts/publish-tokyo-confirmed-canonical-staging.ts
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/materialize-public-data-from-staging-db.ts scripts/node-runtime-shims.d.ts scripts/publish-tokyo-confirmed-canonical-staging.ts
          git commit -m 'chore: format real-data staging publication'
          git push origin HEAD:fix/real-data-staging-publication
