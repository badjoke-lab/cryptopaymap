name: OPS-P6-001D format branch

on:
  push:
    branches:
      - agent/ops-p6-001d-configured-staging-p6-01-data-qa
    paths:
      - '.github/workflows/ops-p6-001d-format-branch.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001d-configured-staging-p6-01-data-qa
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format bounded OPS-P6-001D files
        run: |
          npx biome format --write \
            .github/workflows/ops-p6-001c-configured-staging-authorization.yml \
            .github/workflows/ops-p6-001d-configured-staging-p6-01-data-qa.yml \
            docs/OPS_P6_001D_CONFIGURED_STAGING_P6_01_DATA_QA.md \
            docs/PROJECT_STATUS.md \
            scripts/run-ops-p6-001d-configured-staging-data-qa.ts
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/ops-p6-001c-configured-staging-authorization.yml \
            .github/workflows/ops-p6-001d-configured-staging-p6-01-data-qa.yml \
            docs/OPS_P6_001D_CONFIGURED_STAGING_P6_01_DATA_QA.md \
            docs/PROJECT_STATUS.md \
            scripts/run-ops-p6-001d-configured-staging-data-qa.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'OPS-P6-001D apply Biome formatting'
          git push origin HEAD:agent/ops-p6-001d-configured-staging-p6-01-data-qa
