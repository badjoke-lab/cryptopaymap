name: One-time OPS-P6-006 Drizzle snapshot index patcher

on:
  pull_request:
    paths:
      - '.github/workflows/one-time-ops-p6-006-snapshot-index-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ops-p6-006-drizzle-snapshot-index'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-006-drizzle-snapshot-index

      - name: Apply bounded snapshot-index fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          executor = Path('scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs')
          checker = Path('scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs')
          docs = Path('docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md')

          text = executor.read_text()
          start_marker = "  const entries = Array.isArray(journal?.entries) ? journal.entries : [];\n"
          end_marker = "  const tables = isObject(snapshot?.tables) ? snapshot.tables : {};\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker)) if start >= 0 else -1
          if start < 0 or end < 0:
              raise SystemExit('loadExpectedSchema boundaries not found')
          replacement = """  const entries = Array.isArray(journal?.entries) ? journal.entries : [];
          const latest = entries.at(-1);
          const tag = latest?.tag;
          const index = latest?.idx;
          if (
            typeof tag !== 'string' ||
            !/^[a-zA-Z0-9_-]+$/.test(tag) ||
            !Number.isInteger(index) ||
            index < 0 ||
            index > 9_999
          ) {
            throw new Error('schema_snapshot_missing');
          }
          const snapshotFile = `${String(index).padStart(4, '0')}_snapshot.json`;
          const snapshotPath = resolve(sourceRoot, 'drizzle/meta', snapshotFile);
          if (!existsSync(snapshotPath)) throw new Error('schema_snapshot_missing');
          const snapshot = JSON.parse(readFileSync(snapshotPath, 'utf8'));
          """
          text = text[:start] + replacement + text[end:]

          old_journal = "writeJson(resolve(root, 'drizzle/meta/_journal.json'), { entries: [{ tag: '0001_test' }] });"
          if text.count(old_journal) != 1:
              raise SystemExit(f'self-test journal match count={text.count(old_journal)}')
          text = text.replace(
              old_journal,
              "writeJson(resolve(root, 'drizzle/meta/_journal.json'), {\n      entries: [{ idx: 1, tag: '0001_test' }],\n    });",
              1,
          )
          old_snapshot = "resolve(root, 'drizzle/meta/0001_test_snapshot.json')"
          if text.count(old_snapshot) != 1:
              raise SystemExit(f'self-test snapshot filename match count={text.count(old_snapshot)}')
          text = text.replace(old_snapshot, "resolve(root, 'drizzle/meta/0001_snapshot.json')", 1)
          executor.write_text(text)

          check_text = checker.read_text()
          anchor = "  [files.executor, 'targetNamePattern = /^cpm_p6_07_restore_[a-z0-9_]{4,48}$/'],\n"
          if check_text.count(anchor) != 1:
              raise SystemExit(f'checker expectation anchor count={check_text.count(anchor)}')
          check_text = check_text.replace(
              anchor,
              anchor
              + "  [files.executor, \"const index = latest?.idx\"],\n"
              + "  [files.executor, \"String(index).padStart(4, '0')\"],\n"
              + "  [files.executor, \"resolve(sourceRoot, 'drizzle/meta', snapshotFile)\"],\n"
              + "  [files.executor, \"entries: [{ idx: 1, tag: '0001_test' }]\"],\n",
              1,
          )
          footer = "\nconsole.log('OPS-P6-002A configured staging P6-07 isolated restore contract passed.');\n"
          if check_text.count(footer) != 1:
              raise SystemExit(f'checker footer count={check_text.count(footer)}')
          check_text = check_text.replace(
              footer,
              "\nif (files.executor.includes('drizzle/meta/${tag}_snapshot.json')) {\n"
              "  throw new Error('OPS-P6-002A must resolve Drizzle snapshots by journal index, not tag.');\n"
              "}\n"
              + footer,
              1,
          )
          checker.write_text(check_text)

          doc_text = docs.read_text()
          anchor_doc = "## Restore and reconciliation\n\n"
          paragraph = "The expected Drizzle schema snapshot is resolved from the latest `_journal.json` entry's numeric `idx`, zero-padded to the canonical `NNNN_snapshot.json` filename. The human-readable journal `tag` is retained only as bounded receipt metadata and is never used as the snapshot filename. A missing, invalid, or unresolved index fails closed before any restore mutation.\n\n"
          if doc_text.count(anchor_doc) != 1:
              raise SystemExit(f'docs restore heading count={doc_text.count(anchor_doc)}')
          docs.write_text(doc_text.replace(anchor_doc, anchor_doc + paragraph, 1))
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Format changed JavaScript files
        run: |
          npx biome format --write \
            scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs

      - name: Validate bounded fix
        run: |
          set -euo pipefail
          npm run format:check
          npm run check
          node scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js
          node scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs
          node scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs --self-test

      - name: Commit real fix only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs \
            docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '3'
          git commit -m 'OPS-P6-006: resolve Q4 snapshot by journal index'
          git push origin HEAD:agent/ops-p6-006-drizzle-snapshot-index
