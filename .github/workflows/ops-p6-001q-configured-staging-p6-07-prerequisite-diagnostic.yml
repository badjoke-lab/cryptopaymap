name: OPS-P6-001Q configured staging P6-07 prerequisite diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.yml'
      - 'docs/OPS_P6_001Q_CONFIGURED_STAGING_P6_07_PREREQUISITE_DIAGNOSTIC.md'
      - 'docs/P6_07_CONFIGURED_OPERATIONAL_MONITORING_BACKUP_RESTORE_INCIDENT_EVIDENCE.md'
      - 'scripts/run-ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.mjs'
      - 'scripts/check-ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.mjs'
      - 'scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js'
      - 'scripts/evaluate-ops-p6-001c-staging-authorization.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.yml'
      - 'docs/OPS_P6_001Q_CONFIGURED_STAGING_P6_07_PREREQUISITE_DIAGNOSTIC.md'
      - 'docs/P6_07_CONFIGURED_OPERATIONAL_MONITORING_BACKUP_RESTORE_INCIDENT_EVIDENCE.md'
      - 'scripts/run-ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.mjs'
      - 'scripts/check-ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.mjs'
      - 'scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js'
      - 'scripts/evaluate-ops-p6-001c-staging-authorization.mjs'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter DIAGNOSE_CONFIGURED_STAGING_P6_07 exactly.
        required: true
        type: string
      approved_commit:
        description: Exact 40-character current main commit SHA.
        required: true
        type: string
      operations_owner:
        description: Bounded configured staging operations owner identity.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Check repository P6-07 evidence contract
        run: node scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js

      - name: Check P6-07 prerequisite diagnostic contract
        run: node scripts/check-ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.mjs

      - name: Run P6-07 prerequisite diagnostic self-test
        run: node scripts/run-ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.mjs --self-test

  diagnose:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      OPERATIONS_OWNER: ${{ inputs.operations_owner }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      P6_07_RESTORE_DATABASE_URL: ${{ secrets.P6_07_RESTORE_DATABASE_URL }}
      P6_07_BACKUP_ENCRYPTION_KEY: ${{ secrets.P6_07_BACKUP_ENCRYPTION_KEY }}
      P6_07_ALERT_ISSUE_NUMBER: '349'
      P6_07_BACKUP_RETENTION_DAYS: '30'
    steps:
      - name: Check out evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          path: source

      - name: Check out retained status branch
        uses: actions/checkout@v4
        with:
          ref: staging-review
          path: status

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Verify exact current main
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          current_main_commit="$(git -C source rev-parse origin/main)"
          test "$current_main_commit" = "$APPROVED_COMMIT"

      - name: Recheck exact-source repository contract
        id: repository_contract
        continue-on-error: true
        working-directory: source
        run: |
          npm run check
          node scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js
          node scripts/check-ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.mjs
          node scripts/run-ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.mjs --self-test

      - name: Diagnose configured staging P6-07 prerequisites
        env:
          REPOSITORY_CONTRACT_OUTCOME: ${{ steps.repository_contract.outcome }}
        working-directory: source
        run: |
          node scripts/run-ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic.mjs \
            ../status \
            ../p6-07-prerequisite-diagnostic.json

      - name: Upload bounded P6-07 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-p6-001q-configured-staging-p6-07-prerequisite-diagnostic
          path: p6-07-prerequisite-diagnostic.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish P6-07 prerequisite diagnostic
        if: always()
        run: |
          set -euo pipefail
          test -f p6-07-prerequisite-diagnostic.json
          mkdir -p status/config/staging-authorization
          cp p6-07-prerequisite-diagnostic.json \
            status/config/staging-authorization/p6-07-prerequisite-diagnostic.json
          git -C status config user.name 'github-actions[bot]'
          git -C status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C status add config/staging-authorization/p6-07-prerequisite-diagnostic.json
          if ! git -C status diff --cached --quiet; then
            git -C status commit -m 'Record configured staging P6-07 prerequisite diagnostic'
            git -C status push origin HEAD:staging-review
          fi

      - name: Write P6-07 prerequisite summary
        if: always()
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync } = require('node:fs');
          if (!existsSync('p6-07-prerequisite-diagnostic.json')) process.exit(0);
          const receipt = JSON.parse(readFileSync('p6-07-prerequisite-diagnostic.json', 'utf8'));
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Configured staging P6-07 prerequisite diagnostic',
              '',
              `- State: \`${receipt.state}\``,
              `- Decision: \`${receipt.decision}\``,
              `- Commit: \`${receipt.commit}\``,
              `- Predecessor binding: \`${receipt.checks.predecessorBinding}\``,
              `- Home: \`${receipt.checks.external.home.status}\``,
              `- Version: \`${receipt.checks.external.version.status}\``,
              `- Manifest: \`${receipt.checks.external.manifest.status}\``,
              `- Admin denial: \`${receipt.checks.external.adminDenial.status}\``,
              `- Blockers: ${receipt.blockers.length === 0 ? 'none' : receipt.blockers.map((value) => `\`${value}\``).join(', ')}`,
              '',
            ].join('\n'),
          );
          NODE

      - name: Enforce completed diagnostic
        if: always()
        run: |
          node -e "const r=require('./p6-07-prerequisite-diagnostic.json'); if(r.state!=='diagnosed') process.exit(1)"
