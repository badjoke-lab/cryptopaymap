name: Format FIX-P6-006 temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/format-fix-p6-006-temp.yml'

permissions:
  contents: write

concurrency:
  group: format-fix-p6-006-temp
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FIX-P6-006 branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-p6-006-historical-releases

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format FIX-P6-006 files
        run: |
          npx biome format --write \
            scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs \
            scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs \
            docs/OPS_P6_001I_CONFIGURED_STAGING_P6_05_PUBLIC_EXPORT_RELEASE.md

      - name: Commit formatting and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-fix-p6-006-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/format-fix-p6-006-temp.yml \
            scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs \
            scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs \
            docs/OPS_P6_001I_CONFIGURED_STAGING_P6_05_PUBLIC_EXPORT_RELEASE.md
          if ! git diff --cached --quiet; then
            git commit -m 'Format FIX-P6-006 release classification'
            git push origin HEAD:agent/fix-p6-006-historical-releases
          fi
