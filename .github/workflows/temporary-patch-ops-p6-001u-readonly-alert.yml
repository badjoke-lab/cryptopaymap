name: Temporary patch OPS-P6-001U read-only alert evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-patch-ops-p6-001u-readonly-alert.yml'

permissions:
  contents: write

concurrency:
  group: temporary-patch-ops-p6-001u-readonly-alert
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out OPS-P6-001U branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001u-p6-07-monitoring-alert

      - name: Patch read-only alert evidence verification
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          script = Path('scripts/run-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs')
          text = script.read_text()

          text, count = re.subn(
              r"\s+Authorization: `Bearer \$\{token\}`,\n",
              "\n      ...(token ? { Authorization: `Bearer ${token}` } : {}),\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'optional authorization marker mismatch: {count}')

          text, count = re.subn(
              r"\n\s+if \(!token\) throw new Error\('missing_github_token'\);",
              '',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'optional token guard mismatch: {count}')

          text, count = re.subn(
              r"(if \(existing\) return \{ status: 'delivered', reused: true, \.\.\.safeCommentReference\(existing\) \};\n)",
              r"\1    if (!token) throw new Error(`missing_preseeded_channel_evidence_${kind}`);\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'missing evidence guard mismatch: {count}')

          text, count = re.subn(
              r"(destinationClass: 'github_issue',\n\s+issueNumber,)",
              r"\1\n    readOnlyEvidence: token.length === 0,",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'read-only mode mismatch: {count}')

          text = text.replace(
              "['wrong_release_http_200', bindingDigest, workflowRunId ?? 'manual'].join(':')",
              "['wrong_release_http_200', bindingDigest, alertRuleRevision].join(':')",
          )
          text = text.replace(
              "['monitor_blind_state', bindingDigest, workflowRunId ?? 'manual'].join(':')",
              "['monitor_blind_state', bindingDigest, alertRuleRevision].join(':')",
          )
          if "workflowRunId ?? 'manual'" in text:
              raise SystemExit('workflow-run-dependent alert identity remains')

          old_escalation = """  const blindDelivery = await channel.deliver(blindStateId, blindDetails);
            const escalationDeadline = new Date(Date.now() + 2_000).toISOString();
            await sleep(2_500);
            const deadlineMissed = Date.now() > Date.parse(escalationDeadline);
            if (!deadlineMissed) throw new Error('escalation_deadline_not_missed');
            const escalation = await channel.escalate(blindStateId, {
              ...blindDetails,
              evidenceAt: new Date().toISOString(),
            });"""
          new_escalation = """  const blindDelivery = await channel.deliver(blindStateId, blindDetails);
            const escalationDeadline = new Date(
              (validTimestamp(blindDelivery.createdAt) ? Date.parse(blindDelivery.createdAt) : Date.now()) +
                2_000,
            ).toISOString();
            if (!channel.readOnlyEvidence) await sleep(2_500);
            const escalation = await channel.escalate(blindStateId, {
              ...blindDetails,
              evidenceAt: new Date().toISOString(),
            });
            const escalationObservedAt = validTimestamp(escalation.createdAt)
              ? Date.parse(escalation.createdAt)
              : Date.now();
            const deadlineMissed = escalationObservedAt > Date.parse(escalationDeadline);
            if (!deadlineMissed) throw new Error('escalation_deadline_not_missed');"""
          if text.count(old_escalation) != 1:
              raise SystemExit(f'escalation block mismatch: {text.count(old_escalation)}')
          text = text.replace(old_escalation, new_escalation)

          old_delivery = """      firstDelivery.reused === false &&
            duplicateDelivery.reused === true &&"""
          new_delivery = """      (firstDelivery.reused === false || channel.readOnlyEvidence === true) &&
            duplicateDelivery.reused === true &&"""
          if text.count(old_delivery) != 1:
              raise SystemExit(f'first delivery block mismatch: {text.count(old_delivery)}')
          text = text.replace(old_delivery, new_delivery)

          old_sleep = "    sleep: async () => {},"
          new_sleep = """    sleep: (milliseconds) =>
              new Promise((resolvePromise) => setTimeout(resolvePromise, milliseconds)),"""
          if text.count(old_sleep) != 1:
              raise SystemExit(f'self-test sleep mismatch: {text.count(old_sleep)}')
          text = text.replace(old_sleep, new_sleep)
          script.write_text(text)

          checker = Path('scripts/check-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs')
          audit = checker.read_text()
          replacements = [
              ("  [files.workflow, 'issues: write'],", "  [files.workflow, 'pre-delivered alert evidence'],"),
              (
                  "  [files.executor, \"destinationClass: 'github_issue'\"],",
                  "  [files.executor, \"destinationClass: 'github_issue'\"],\n  [files.executor, 'readOnlyEvidence: token.length === 0'],",
              ),
              (
                  "if (!files.executor.includes(\"['/', [200], 'text/html'\"))",
                  "if (!files.executor.includes(\"probePath('/', [200], 'text/html'\"))",
              ),
              (
                  "if (!files.executor.includes('firstDelivery.reused === false'))",
                  "if (!files.executor.includes('firstDelivery.reused === false || channel.readOnlyEvidence === true'))",
              ),
          ]
          for old, new in replacements:
              if audit.count(old) != 1:
                  raise SystemExit(f'checker marker mismatch: {old} count={audit.count(old)}')
              audit = audit.replace(old, new)
          checker.write_text(audit)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format and verify OPS-P6-001U
        run: |
          npm run format
          npm run check
          node scripts/check-p6-07-configured-operational-monitoring-backup-restore-incident-evidence.js
          node scripts/check-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs
          node scripts/run-ops-p6-001u-configured-staging-p6-07-monitoring-alert.mjs --self-test

      - name: Remove one-time patch and publish normalization
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-patch-ops-p6-001u-readonly-alert.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verify pre-delivered P6-07 alert evidence read-only'
          git push origin HEAD:agent/ops-p6-001u-p6-07-monitoring-alert
