name: Temporary OPS-P6-014 validator

on:
  push:
    branches:
      - ops-p6-014-production-candidate-bootstrap
    paths:
      - '.github/workflows/tmp-ops-p6-014-validator.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-014-production-candidate-bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format, validate, and remove temporary workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/OPS_P6_014_CONFIGURED_PRODUCTION_CANDIDATE_BOOTSTRAP.md')
          text = path.read_text()
          text = text.replace(
              'It does not switch the canonical host, create redirects for the live hostname, alter certificates, purge live caches, or execute cutover.',
              'It does not switch the canonical host, create redirects for the live hostname, alter certificates, or purge live caches. It does not execute cutover.',
          )
          path.write_text(text)
          PY
          npx biome check --write --unsafe \
            scripts/run-ops-p6-014-production-candidate-bootstrap.mjs \
            scripts/check-ops-p6-014-production-candidate-bootstrap.mjs
          node scripts/check-ops-p6-014-production-candidate-bootstrap.mjs
          node scripts/run-ops-p6-014-production-candidate-bootstrap.mjs --self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-ops-p6-014-validator.yml
          git add \
            .github/workflows/ops-p6-014-configured-production-candidate-bootstrap.yml \
            docs/OPS_P6_014_CONFIGURED_PRODUCTION_CANDIDATE_BOOTSTRAP.md \
            scripts/run-ops-p6-014-production-candidate-bootstrap.mjs \
            scripts/check-ops-p6-014-production-candidate-bootstrap.mjs
          git commit -m 'OPS-P6-014: finalize guarded production candidate bootstrap'
          git push origin HEAD:ops-p6-014-production-candidate-bootstrap
