name: FIX-P6-004 temporary patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-p6-004-temp.yml'

permissions:
  contents: write

concurrency:
  group: fix-p6-004-temp
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FIX-P6-004 branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-p6-004-pages-platform-domain

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Patch Pages platform-domain classification
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs';
          let source = readFileSync(path, 'utf8');
          const oldShape = `    topology: { status: 'not_run', productionBranch: null, customDomainCount: null },`;
          const newShape = `    topology: {
              status: 'not_run',
              productionBranch: null,
              platformDomainPresent: false,
              platformDomainMatches: false,
              customDomainCount: null,
            },`;
          if (!source.includes(oldShape)) throw new Error('Topology receipt shape marker is missing.');
          source = source.replace(oldShape, newShape);

          const oldBlock = `      const project = await cloudflareRequest('');
              const customDomains = Array.isArray(project?.domains) ? project.domains : [];
              checks.topology = {
                status:
                  project?.name === projectName &&
                  project?.production_branch === productionBranch &&
                  customDomains.length === 0
                    ? 'passed'
                    : 'failed',
                productionBranch: project?.production_branch ?? null,
                customDomainCount: customDomains.length,
              };`;
          const newBlock = `      const project = await cloudflareRequest('');
              const platformDomain = \`${'${projectName}'}.pages.dev\`;
              const projectDomains = Array.isArray(project?.domains)
                ? project.domains.filter((domain) => typeof domain === 'string')
                : [];
              const platformDomainPresent = projectDomains.includes(platformDomain);
              const platformDomainMatches = project?.subdomain === platformDomain;
              const customDomains = projectDomains.filter((domain) => domain !== platformDomain);
              checks.topology = {
                status:
                  project?.name === projectName &&
                  project?.production_branch === productionBranch &&
                  platformDomainPresent &&
                  platformDomainMatches &&
                  customDomains.length === 0
                    ? 'passed'
                    : 'failed',
                productionBranch: project?.production_branch ?? null,
                platformDomainPresent,
                platformDomainMatches,
                customDomainCount: customDomains.length,
              };`;
          if (!source.includes(oldBlock)) throw new Error('Topology classification marker is missing.');
          source = source.replace(oldBlock, newBlock);
          writeFileSync(path, source);
          NODE
          npx biome format --write scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs

      - name: Commit patch and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-p6-004-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/fix-p6-004-temp.yml \
            scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs
          git commit -m 'Distinguish Pages platform domain from custom domains'
          git push origin HEAD:agent/fix-p6-004-pages-platform-domain
