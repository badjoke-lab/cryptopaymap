name: One-time OPS-P6-007 patcher

on:
  pull_request:
    paths:
      - '.github/workflows/one-time-p6-07-predecessor-q1-0cbcb.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_BRANCH: agent/ops-p6-007-q4-pg-restore-dbname
    steps:
      - name: Patch OPS-P6-007 branch through GitHub contents API
        shell: bash
        run: |
          set -euo pipefail

          api_get() {
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/$1"
          }

          update_path() {
            local path="$1"
            local message="$2"
            local encoded_path current sha content patched payload
            encoded_path="$(jq -rn --arg v "$path" '$v|@uri')"
            current="$(api_get "contents/$encoded_path?ref=$TARGET_BRANCH")"
            sha="$(jq -r '.sha' <<<"$current")"
            content="$(jq -r '.content' <<<"$current" | base64 -d)"
            patched="$(PATH_TO_PATCH="$path" CONTENT_TO_PATCH="$content" node <<'NODE'
          const path = process.env.PATH_TO_PATCH;
          let text = process.env.CONTENT_TO_PATCH;
          const replaceOnce = (from, to) => {
            const count = text.split(from).length - 1;
            if (count !== 1) throw new Error(`${path}: expected exactly one match, got ${count}`);
            text = text.replace(from, to);
          };

          if (path === 'scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs') {
            replaceOnce(
              "['--exit-on-error', '--single-transaction', '--no-owner', '--no-privileges', plainPath]",
              "[\n            '--exit-on-error',\n            '--single-transaction',\n            '--no-owner',\n            '--no-privileges',\n            '--dbname',\n            decodeURIComponent(new URL(databaseUrl).pathname.slice(1)),\n            plainPath,\n          ]",
            );
          } else if (path === 'scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs') {
            replaceOnce(
              "  [files.executor, \"'--no-privileges'\"],\n",
              "  [files.executor, \"'--no-privileges'\"],\n  [files.executor, \"'--dbname'\"],\n  [files.executor, \"decodeURIComponent(new URL(databaseUrl).pathname.slice(1))\"],\n",
            );
            replaceOnce(
              "if (files.executor.includes('drizzle/meta/${tag}_snapshot.json')) {\n",
              "if (!files.executor.includes(\"'--dbname'\")) {\n  throw new Error('OPS-P6-002A must bind pg_restore explicitly to the isolated target database.');\n}\nif (/--dbname[^\\n]*(databaseUrl|P6_07_RESTORE_DATABASE_URL)/.test(files.executor)) {\n  throw new Error('OPS-P6-002A must not place a protected database URL on the pg_restore command line.');\n}\n\nif (files.executor.includes('drizzle/meta/${tag}_snapshot.json')) {\n",
            );
          } else if (path === 'docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md') {
            replaceOnce(
              "pg_restore\n--exit-on-error\n--single-transaction\n--no-owner\n--no-privileges\n",
              "pg_restore\n--exit-on-error\n--single-transaction\n--no-owner\n--no-privileges\n--dbname <validated isolated target database name>\n",
            );
            replaceOnce(
              "The executor then proves:\n",
              "Only the already validated isolated target database name is supplied with `--dbname`; host, user, password, SSL mode, and other protected connection material remain in the PostgreSQL environment and are never placed on the command line. Omitting the explicit target database fails repository contract validation.\n\nThe executor then proves:\n",
            );
          } else {
            throw new Error(`unsupported path: ${path}`);
          }
          process.stdout.write(text);
          NODE
            )"
            payload="$(jq -nc --arg message "$message" --arg content "$(printf '%s' "$patched" | base64 -w0)" --arg sha "$sha" --arg branch "$TARGET_BRANCH" '{message:$message,content:$content,sha:$sha,branch:$branch}')"
            curl --fail --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/contents/$encoded_path" \
              -d "$payload" >/dev/null
          }

          test "$(api_get 'commits/main' | jq -r '.sha')" = '0cbcb3820de762c6d1d3f894f3d4b9cf5e539297'
          update_path 'scripts/run-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs' 'OPS-P6-007: bind pg_restore to isolated database'
          update_path 'scripts/check-ops-p6-002a-configured-staging-p6-07-isolated-restore.mjs' 'OPS-P6-007: enforce pg_restore target binding'
          update_path 'docs/OPS_P6_002A_CONFIGURED_STAGING_P6_07_ISOLATED_RESTORE.md' 'OPS-P6-007: document explicit restore target'
          echo 'OPS-P6-007 branch patched; main untouched.'
