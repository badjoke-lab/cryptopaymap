name: Real-data staging publication

on:
  workflow_dispatch:
    inputs:
      acquisition_batch_ids:
        description: Comma-separated staging acquisition batch UUIDs to review
        required: true
        type: string
      country_code:
        description: ISO alpha-2 country code for the selected acquisition batches
        required: true
        type: string
      crawl_limit:
        description: Official-site candidates to crawl in this run (1-250)
        required: true
        default: '250'
        type: string
      review_limit:
        description: Eligible candidates to promote and confirm in this run (1-500)
        required: true
        default: '500'
        type: string
      publication_limit:
        description: Reviewed confirmed places to make public in this run (1-500)
        required: true
        default: '500'
        type: string

permissions:
  contents: read

concurrency:
  group: real-data-staging-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Crawl bounded official merchant payment evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_OFFICIAL_EVIDENCE_BATCH_IDS: ${{ inputs.acquisition_batch_ids }}
          CPM_OFFICIAL_EVIDENCE_MAX_TARGETS: ${{ inputs.crawl_limit }}
        run: npx tsx scripts/crawl-official-payment-evidence-batch.ts

      - name: Bulk promote and confirm reviewed OSM Bitcoin places
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_BULK_REVIEW_BATCH_IDS: ${{ inputs.acquisition_batch_ids }}
          CPM_BULK_REVIEW_COUNTRY_CODE: ${{ inputs.country_code }}
          CPM_BULK_REVIEW_LIMIT: ${{ inputs.review_limit }}
        run: npx tsx scripts/promote-reviewed-osm-bitcoin-staging-bulk.ts

      - name: Bulk publish reviewed confirmed canonical records in staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS: ${{ secrets.CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS }}
          CPM_BULK_PUBLICATION_LIMIT: ${{ inputs.publication_limit }}
        run: npx tsx scripts/publish-reviewed-physical-canonical-staging-bulk.ts

      - name: Remove synthetic staging review payload before build
        run: rm -rf public/staging-review

      - name: Materialize all public confirmed data from staging database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/materialize-public-data-from-staging-db.ts

      - name: Build
        run: npm run build

      - name: Deploy isolated real-data staging preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name cryptopaymap-staging
          --branch real-data-review
