name: OPS-P6-001L one-time format fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ops-p6-001l-format-fix.yml'

permissions:
  contents: write

concurrency:
  group: ops-p6-001l-format-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001l-domain-cutover-rollback

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Repair self-test and apply bounded Biome fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/run-ops-p6-001l-configured-staging-p6-06-domain-cutover-rollback.mjs')
          text = path.read_text()
          old = """  assert(
            boundedHash(approvedHostname) === boundedHash(approvedHostname),
            'hostname digest must be deterministic',
          );"""
          new = """  const hostnameDigest = boundedHash(approvedHostname);
          assert(
            hostnameDigest === `sha256:${sha256(approvedHostname)}`,
            'hostname digest must use the bounded SHA-256 form',
          );"""
          if old not in text:
              raise SystemExit('self-test marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx biome format --write \
            scripts/run-ops-p6-001l-configured-staging-p6-06-domain-cutover-rollback.mjs \
            scripts/check-ops-p6-001l-configured-staging-p6-06-domain-cutover-rollback.mjs
          npx biome lint \
            scripts/run-ops-p6-001l-configured-staging-p6-06-domain-cutover-rollback.mjs \
            scripts/check-ops-p6-001l-configured-staging-p6-06-domain-cutover-rollback.mjs

      - name: Remove one-time workflow and publish fixes
        run: |
          set -euo pipefail
          rm -f .github/workflows/ops-p6-001l-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/ops-p6-001l-format-fix.yml \
            scripts/run-ops-p6-001l-configured-staging-p6-06-domain-cutover-rollback.mjs \
            scripts/check-ops-p6-001l-configured-staging-p6-06-domain-cutover-rollback.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Format guarded P6-06 cutover executor'
            git push origin HEAD:agent/ops-p6-001l-domain-cutover-rollback
          fi
