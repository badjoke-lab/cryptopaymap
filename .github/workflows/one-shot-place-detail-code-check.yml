name: One-shot Place detail repair code check

on:
  push:
    branches:
      - feat/physical-source-first-growth
    paths:
      - ops/run-place-detail-code-check.trigger

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --check scripts/prepare-source-first-materializer-staging.mjs
      - run: node --check scripts/validate-public-place-detail-contract.mjs
