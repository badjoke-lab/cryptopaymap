name: FIX-P6-006 temporary patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-p6-006-temp.yml'

permissions:
  contents: write

concurrency:
  group: fix-p6-006-temp
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FIX-P6-006 branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-p6-006-historical-releases

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Patch authenticated historical release classification
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs';
          let source = readFileSync(path, 'utf8');

          const oldClassifier = `async function classifiedDeployments(commit, treeDigest) {
            const deployments = await productionDeployments();
            const recognized = [];
            const unrecognized = [];
            for (const deployment of deployments) {
              if (deployment?.latest_stage?.status !== 'success') continue;
              const url = safeUrl(deployment.url);
              const marker = url === null ? null : await fetchMarker(url);
              if (
                marker?.version === 1 &&
                marker?.environment === 'configured_staging' &&
                marker?.evidenceId === evidenceId &&
                marker?.sourceCommit === commit &&
                marker?.publicTreeDigest === treeDigest &&
                (marker?.kind === 'baseline' || marker?.kind === 'candidate')
              ) {
                recognized.push({ deployment, marker, url });
              } else {
                unrecognized.push({
                  id: boundedHash(deployment?.id ?? 'missing'),
                  environment: deployment?.environment ?? null,
                });
              }
            }
            return { recognized, unrecognized };
          }`;

          const newClassifier = `function validP6ReleaseMarker(marker) {
            if (
              marker?.version !== 1 ||
              marker?.environment !== 'configured_staging' ||
              marker?.evidenceId !== evidenceId ||
              !validCommit(marker?.sourceCommit) ||
              typeof marker?.publicTreeDigest !== 'string' ||
              !/^[a-f0-9]{64}$/.test(marker.publicTreeDigest) ||
              (marker?.kind !== 'baseline' && marker?.kind !== 'candidate') ||
              typeof marker?.releaseId !== 'string'
            ) {
              return false;
            }
            return (
              marker.releaseId ===
              releaseMarker(marker.kind, marker.sourceCommit, marker.publicTreeDigest).releaseId
            );
          }

          async function classifiedDeployments(commit, treeDigest) {
            const deployments = await productionDeployments();
            const recognized = [];
            const historical = [];
            const unrecognized = [];
            for (const deployment of deployments) {
              if (deployment?.latest_stage?.status !== 'success') continue;
              const url = safeUrl(deployment.url);
              const marker = url === null ? null : await fetchMarker(url);
              if (validP6ReleaseMarker(marker)) {
                const item = { deployment, marker, url };
                if (marker.sourceCommit === commit && marker.publicTreeDigest === treeDigest) {
                  recognized.push(item);
                } else {
                  historical.push({
                    id: boundedHash(deployment?.id ?? 'missing'),
                    kind: marker.kind,
                  });
                }
              } else {
                unrecognized.push({
                  id: boundedHash(deployment?.id ?? 'missing'),
                  environment: deployment?.environment ?? null,
                });
              }
            }
            return { recognized, historical, unrecognized };
          }`;

          if (!source.includes(oldClassifier)) throw new Error('Classifier marker is missing.');
          source = source.replace(oldClassifier, newClassifier);

          const oldShape = `    releases: { status: 'not_run', baseline: null, candidate: null },`;
          const newShape = `    releases: {
              status: 'not_run',
              historicalCount: 0,
              baseline: null,
              candidate: null,
            },`;
          if (!source.includes(oldShape)) throw new Error('Release receipt shape marker is missing.');
          source = source.replace(oldShape, newShape);

          const assignmentPattern = /checks\.releases = \{\n(\s+)status: 'passed',\n\1baseline: \{/;
          if (!assignmentPattern.test(source)) {
            throw new Error('Release assignment marker is missing.');
          }
          source = source.replace(
            assignmentPattern,
            (_match, indent) =>
              `checks.releases = {\n${indent}status: 'passed',\n${indent}historicalCount: classified.historical.length,\n${indent}baseline: {`,
          );

          writeFileSync(path, source);
          NODE
          npx biome format --write scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs

      - name: Commit patch and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-p6-006-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/fix-p6-006-temp.yml \
            scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs
          git commit -m 'Recognize authenticated historical P6-05 releases'
          git push origin HEAD:agent/fix-p6-006-historical-releases
