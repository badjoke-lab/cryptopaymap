name: TEMP OPS-P6-023 Turnstile canonical hostname patcher

on:
  push:
    branches:
      - ops-p6-023-turnstile-canonical-www
    paths:
      - '.github/workflows/tmp-ops-p6-023-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply bounded canonical Turnstile hostname fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'expected one anchor in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              '.github/workflows/ops-p6-014-configured-production-candidate-bootstrap.yml',
              "CPM_TURNSTILE_EXPECTED_HOSTNAME: 'cryptopaymap.com',",
              "CPM_TURNSTILE_EXPECTED_HOSTNAME: 'www.cryptopaymap.com',",
          )

          replace_once(
              'scripts/run-ops-p6-014-production-candidate-bootstrap.mjs',
              "const baseUrl = `https://${platformHost}`;\nconst markerPath = 'p6-05-release.json';",
              "const baseUrl = `https://${platformHost}`;\nconst productionTurnstileHostname = new URL(canonicalOrigin).hostname;\nconst markerPath = 'p6-05-release.json';",
          )
          replace_once(
              'scripts/run-ops-p6-014-production-candidate-bootstrap.mjs',
              "    assert(first.version.canonicalOnly === true, 'version must remain canonical-only');\n",
              "    assert(first.version.canonicalOnly === true, 'version must remain canonical-only');\n    assert(\n      productionTurnstileHostname === 'www.cryptopaymap.com',\n      'production Turnstile hostname must equal the canonical WWW hostname',\n    );\n",
          )

          replace_once(
              'scripts/check-ops-p6-014-production-candidate-bootstrap.mjs',
              "  'p6_08_production_cf_access_aud',\n  'cpm_admin_auth_mode',",
              "  'p6_08_production_cf_access_aud',\n  \"cpm_turnstile_expected_hostname: 'www.cryptopaymap.com'\",\n  'cpm_admin_auth_mode',",
          )
          replace_once(
              'scripts/check-ops-p6-014-production-candidate-bootstrap.mjs',
              "  'credentialgenerationdigest',\n]);",
              "  'credentialgenerationdigest',\n  'productionturnstilehostname',\n]);",
          )
          replace_once(
              'scripts/check-ops-p6-014-production-candidate-bootstrap.mjs',
              "  'unauthenticated',\n  '`/admin/`',",
              "  'unauthenticated',\n  'canonical `www.cryptopaymap.com`',\n  '`/admin/`',",
          )

          replace_once(
              'docs/OPS_P6_014_CONFIGURED_PRODUCTION_CANDIDATE_BOOTSTRAP.md',
              "The intended Turnstile hostname remains `cryptopaymap.com`; the candidate pages.dev hostname is not treated as the canonical live hostname.",
              "The intended Turnstile hostname is the canonical `www.cryptopaymap.com`. The apex `cryptopaymap.com` is the redirect host and must not be accepted as the server-side Turnstile hostname; the candidate pages.dev hostname is also not treated as the canonical live hostname.",
          )
          PY

      - name: Format and validate bounded change
        run: |
          npm run format
          npm run format:check
          npm run lint
          npm run check
          node scripts/check-ops-p6-014-production-candidate-bootstrap.mjs
          node scripts/run-ops-p6-014-production-candidate-bootstrap.mjs --self-test

      - name: Commit validated patch without retaining temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-ops-p6-023-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ops-p6-014-configured-production-candidate-bootstrap.yml \
            scripts/run-ops-p6-014-production-candidate-bootstrap.mjs \
            scripts/check-ops-p6-014-production-candidate-bootstrap.mjs \
            docs/OPS_P6_014_CONFIGURED_PRODUCTION_CANDIDATE_BOOTSTRAP.md
          git diff --cached --name-only
          git commit -m 'OPS-P6-023: bind production Turnstile to canonical WWW'
          echo "validated_commit=$(git rev-parse HEAD)"
          git push origin HEAD:ops-p6-023-turnstile-canonical-www || true
          echo "Validated commit remains available in this job even if workflow-scope push is rejected."
