name: OPS-P6-001G format branch

on:
  push:
    branches:
      - agent/ops-p6-001g-configured-neon-transaction
    paths:
      - '.github/workflows/ops-p6-001g-format-branch.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001g-configured-neon-transaction

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format bounded files
        run: |
          npx biome format --write \
            docs/PROJECT_STATUS.md \
            docs/OPS_P6_001G_CONFIGURED_STAGING_P6_03_NEON_TRANSACTION.md \
            scripts/check-ops-p6-001g-configured-staging-neon-transaction.mjs \
            scripts/run-ops-p6-001g-configured-staging-neon-transaction.ts

      - name: Remove one-time formatter and commit
        run: |
          set -euo pipefail
          rm .github/workflows/ops-p6-001g-format-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/PROJECT_STATUS.md \
            docs/OPS_P6_001G_CONFIGURED_STAGING_P6_03_NEON_TRANSACTION.md \
            scripts/check-ops-p6-001g-configured-staging-neon-transaction.mjs \
            scripts/run-ops-p6-001g-configured-staging-neon-transaction.ts \
            .github/workflows/ops-p6-001g-format-branch.yml
          git commit -m 'OPS-P6-001G format configured transaction slice'
          git push origin HEAD:agent/ops-p6-001g-configured-neon-transaction
