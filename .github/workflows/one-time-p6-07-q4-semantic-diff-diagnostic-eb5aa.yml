name: One-time P6-07 Q4 semantic diff diagnostic eb5aa

on:
  pull_request:
    paths:
      - '.github/workflows/one-time-p6-07-q4-semantic-diff-diagnostic-eb5aa.yml'

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: eb5aa45676ad18c28c3a16fc00b46432050fc2a2
      EXPECTED_TARGET: cpm_p6_07_restore_20260808
      Q3_RUN_ID: '31470200394'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESTORE_URL: ${{ secrets.P6_07_RESTORE_DATABASE_URL }}
      BACKUP_KEY: ${{ secrets.P6_07_BACKUP_ENCRYPTION_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact main
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -r '.sha')"
          test "$actual" = "$EXPECTED_MAIN"

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install --yes curl ca-certificates >/dev/null
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          arch="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: ${arch}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update >/dev/null
          sudo apt-get install --yes postgresql-client-17 >/dev/null
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Download exact Q3 artifact
        uses: actions/download-artifact@v4
        with:
          name: ops-p6-001y-configured-staging-p6-07-encrypted-backup-31470200394
          run-id: 31470200394
          github-token: ${{ github.token }}
          path: q3-artifact

      - name: Restore, compare semantic components, and always dispose target
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createDecipheriv, createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const { readFileSync, writeFileSync, rmSync } = require('node:fs');

          const expectedTarget = process.env.EXPECTED_TARGET;
          const sourceUrl = process.env.DATABASE_URL;
          const targetUrl = process.env.RESTORE_URL;
          const secret = process.env.BACKUP_KEY;
          if (!sourceUrl || !targetUrl || !secret) throw new Error('required_secret_missing');

          function pgEnv(raw) {
            const url = new URL(raw);
            const env = { ...process.env };
            env.PGHOST = url.hostname;
            env.PGPORT = url.port || '5432';
            env.PGUSER = decodeURIComponent(url.username);
            env.PGPASSWORD = decodeURIComponent(url.password);
            env.PGDATABASE = decodeURIComponent(url.pathname.replace(/^\/+/, ''));
            const sslmode = url.searchParams.get('sslmode');
            if (sslmode) env.PGSSLMODE = sslmode;
            return env;
          }
          function psql(raw, sql) {
            return execFileSync('psql', ['-X', '-v', 'ON_ERROR_STOP=1', '-Atq', '-c', sql], {
              env: pgEnv(raw), encoding: 'utf8', maxBuffer: 64 * 1024 * 1024,
              stdio: ['ignore', 'pipe', 'pipe'],
            }).trim();
          }
          function digest(value) {
            return `sha256:${createHash('sha256').update(value).digest('hex')}`;
          }
          function lines(raw) { return raw ? raw.split(/\r?\n/).filter(Boolean) : []; }
          function parseLines(raw) { return lines(raw).map((line) => JSON.parse(line)); }
          function keyFor(kind, row) {
            if (kind === 'relations') return row.slice(0, 3).join('|');
            if (kind === 'columns') return row.slice(0, 4).join('|');
            return row.slice(0, 3).join('|');
          }
          function compare(kind, sql) {
            const sourceRows = parseLines(psql(sourceUrl, sql));
            const targetRows = parseLines(psql(targetUrl, sql));
            const sourceText = sourceRows.map((r) => JSON.stringify(r)).join('\n');
            const targetText = targetRows.map((r) => JSON.stringify(r)).join('\n');
            console.log(`${kind}_source_count=${sourceRows.length}`);
            console.log(`${kind}_target_count=${targetRows.length}`);
            console.log(`${kind}_source_digest=${digest(sourceText)}`);
            console.log(`${kind}_target_digest=${digest(targetText)}`);
            const sm = new Map(sourceRows.map((r) => [keyFor(kind, r), JSON.stringify(r)]));
            const tm = new Map(targetRows.map((r) => [keyFor(kind, r), JSON.stringify(r)]));
            const keys = [...new Set([...sm.keys(), ...tm.keys()])].sort();
            const diffs = keys.filter((k) => sm.get(k) !== tm.get(k));
            console.log(`${kind}_diff_count=${diffs.length}`);
            for (const key of diffs.slice(0, 30)) {
              const sv = sm.get(key) ?? '';
              const tv = tm.get(key) ?? '';
              console.log(`${kind}_diff_key=${key}`);
              console.log(`${kind}_source_line_digest=${sv ? digest(sv) : 'missing'}`);
              console.log(`${kind}_target_line_digest=${tv ? digest(tv) : 'missing'}`);
            }
            return diffs.length;
          }

          const sourceName = psql(sourceUrl, 'select current_database()');
          const targetName = psql(targetUrl, 'select current_database()');
          if (targetName !== expectedTarget) throw new Error('target_name_mismatch');
          if (sourceName === targetName) throw new Error('same_database_name');
          const objectCountSql = "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname not in ('pg_catalog','information_schema') and n.nspname !~ '^pg_toast' and c.relkind in ('r','p','v','m','S','f')";
          const initial = Number(psql(targetUrl, objectCountSql));
          if (initial !== 0) throw new Error(`target_not_empty_${initial}`);
          console.log('isolated_target_initial_user_objects=0');

          const envelope = JSON.parse(readFileSync('q3-artifact/p6-07-q3-backup.enc.json', 'utf8'));
          const key = createHash('sha256').update(secret, 'utf8').digest();
          const decipher = createDecipheriv('aes-256-gcm', key, Buffer.from(envelope.iv, 'base64'));
          decipher.setAAD(Buffer.from(JSON.stringify(envelope.metadata), 'utf8'));
          decipher.setAuthTag(Buffer.from(envelope.tag, 'base64'));
          const plain = Buffer.concat([
            decipher.update(Buffer.from(envelope.ciphertext, 'base64')),
            decipher.final(),
          ]);
          writeFileSync('q4-diagnostic.dump', plain);

          let exitCode = 0;
          try {
            execFileSync('pg_restore', [
              '--exit-on-error', '--single-transaction', '--no-owner', '--no-privileges',
              '--dbname', expectedTarget, 'q4-diagnostic.dump',
            ], { env: pgEnv(targetUrl), stdio: ['ignore', 'ignore', 'pipe'], maxBuffer: 64 * 1024 * 1024 });
            console.log('diagnostic_restore=passed');
            const scope = "('public','drizzle')";
            const queries = {
              relations: `select jsonb_build_array(n.nspname,c.relname,c.relkind)::text from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ${scope} and c.relkind in ('r','p','v','m','S','f') order by n.nspname,c.relname,c.relkind`,
              columns: `select jsonb_build_array(n.nspname,c.relname,a.attnum,a.attname,format_type(a.atttypid,a.atttypmod),a.attnotnull,coalesce(pg_get_expr(ad.adbin,ad.adrelid),''))::text from pg_class c join pg_namespace n on n.oid=c.relnamespace join pg_attribute a on a.attrelid=c.oid and a.attnum>0 and not a.attisdropped left join pg_attrdef ad on ad.adrelid=c.oid and ad.adnum=a.attnum where n.nspname in ${scope} and c.relkind in ('r','p','v','m','f') order by n.nspname,c.relname,a.attnum`,
              constraints: `select jsonb_build_array(n.nspname,t.relname,c.conname,c.contype,c.convalidated,pg_get_constraintdef(c.oid,true))::text from pg_constraint c join pg_class t on t.oid=c.conrelid join pg_namespace n on n.oid=t.relnamespace where n.nspname in ${scope} order by n.nspname,t.relname,c.conname`,
              indexes: `select jsonb_build_array(n.nspname,t.relname,i.relname,pg_get_indexdef(i.oid))::text from pg_index x join pg_class t on t.oid=x.indrelid join pg_namespace n on n.oid=t.relnamespace join pg_class i on i.oid=x.indexrelid where n.nspname in ${scope} order by n.nspname,t.relname,i.relname`,
            };
            let total = 0;
            for (const [kind, sql] of Object.entries(queries)) total += compare(kind, sql);
            console.log(`semantic_component_total_diff_count=${total}`);
          } catch (error) {
            exitCode = 1;
            console.error(`diagnostic_failure=${error instanceof Error ? error.message : String(error)}`);
          } finally {
            try {
              psql(targetUrl, 'drop schema if exists drizzle cascade; drop schema if exists public cascade; create schema public');
              const after = Number(psql(targetUrl, objectCountSql));
              console.log(`isolated_target_user_objects_after=${after}`);
              if (after !== 0) exitCode = 1;
            } catch {
              console.error('diagnostic_cleanup_failed');
              exitCode = 1;
            }
            rmSync('q4-diagnostic.dump', { force: true });
          }
          process.exit(exitCode);
          NODE
