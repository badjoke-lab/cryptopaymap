name: PR469 Temporary Biome Autoformat

on:
  push:
    branches:
      - fix-p2-006-persist-cross-batch-duplicate-signals

permissions:
  contents: write

jobs:
  autoformat:
    if: ${{ !contains(github.event.head_commit.message, '[skip-autoformat]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-p2-006-persist-cross-batch-duplicate-signals
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx biome format --write src/importers/candidate-ingestion-persistence.ts src/importers/osm-overpass-candidate-acquisition.ts tests/candidate-ingestion-persistence.test.ts tests/osm-overpass-candidate-acquisition.test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Biome produced no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/importers/candidate-ingestion-persistence.ts src/importers/osm-overpass-candidate-acquisition.ts tests/candidate-ingestion-persistence.test.ts tests/osm-overpass-candidate-acquisition.test.ts
          git commit -m 'chore: apply Biome formatting [skip-autoformat]'
          git push origin HEAD:fix-p2-006-persist-cross-batch-duplicate-signals
