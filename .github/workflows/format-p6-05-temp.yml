name: Format P6-05 temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/format-p6-05-temp.yml'

permissions:
  contents: write

concurrency:
  group: format-p6-05-temp
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out P6-05 branch
        uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001i-configured-staging-public-release

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format P6-05 files
        run: |
          npx biome format --write \
            .github/workflows/ops-p6-001i-configured-staging-p6-05-public-export-release.yml \
            docs/OPS_P6_001I_CONFIGURED_STAGING_P6_05_PUBLIC_EXPORT_RELEASE.md \
            scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs \
            scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs

      - name: Commit formatting and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-p6-05-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/format-p6-05-temp.yml \
            .github/workflows/ops-p6-001i-configured-staging-p6-05-public-export-release.yml \
            docs/OPS_P6_001I_CONFIGURED_STAGING_P6_05_PUBLIC_EXPORT_RELEASE.md \
            scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs \
            scripts/run-ops-p6-001i-configured-staging-public-export-release.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Format configured staging P6-05 implementation'
            git push origin HEAD:agent/ops-p6-001i-configured-staging-public-release
          fi
