name: Temporary OPS-P6-017 validator

on:
  push:
    branches:
      - ops-p6-017-post-cutover-launch-close
    paths:
      - '.github/workflows/tmp-ops-p6-017-validator.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-p6-017-post-cutover-launch-close
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format and validate launch-close implementation
        run: |
          set -euo pipefail
          npx biome check --write --unsafe \
            scripts/run-ops-p6-017-post-cutover-launch-close.mjs \
            scripts/check-ops-p6-017-post-cutover-launch-close.mjs
          node scripts/check-ops-p6-017-post-cutover-launch-close.mjs
          node scripts/run-ops-p6-017-post-cutover-launch-close.mjs --self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-ops-p6-017-validator.yml
          git add \
            scripts/run-ops-p6-017-post-cutover-launch-close.mjs \
            scripts/check-ops-p6-017-post-cutover-launch-close.mjs
          git commit -m 'OPS-P6-017: finalize post-cutover launch-close evaluator'
          git push origin HEAD:ops-p6-017-post-cutover-launch-close
