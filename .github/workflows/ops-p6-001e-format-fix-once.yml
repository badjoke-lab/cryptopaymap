name: OPS-P6-001E format fix once

on:
  push:
    branches:
      - agent/ops-p6-001e-configured-staging-p6-02
    paths:
      - '.github/workflows/ops-p6-001e-format-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      FORMAT_REVISION: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001e-configured-staging-p6-02
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix bounded implicit journey state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-ops-p6-001e-configured-staging-identity-admin.ts')
          text = path.read_text()
          old = '  let positiveJourneys;\n'
          new = "  let positiveJourneys = { status: 'failed', error: 'positive_journey_unavailable' };\n"
          if old not in text:
              raise SystemExit('Expected positiveJourneys declaration was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format bounded files
        run: |
          npx biome format --write \
            scripts/run-ops-p6-001e-configured-staging-identity-admin.ts \
            src/admin/access/identity.ts \
            src/admin/access/verification.ts \
            tests/admin-access-identity.test.ts \
            tests/admin-access-verification.test.ts
      - name: Commit bounded corrections
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/run-ops-p6-001e-configured-staging-identity-admin.ts \
            src/admin/access/identity.ts \
            src/admin/access/verification.ts \
            tests/admin-access-identity.test.ts \
            tests/admin-access-verification.test.ts
          git commit -m 'OPS-P6-001E fix bounded Biome findings'
          git push origin HEAD:agent/ops-p6-001e-configured-staging-p6-02
