name: OPS-P6-001E format fix once

on:
  push:
    branches:
      - agent/ops-p6-001e-configured-staging-p6-02
    paths:
      - '.github/workflows/ops-p6-001e-format-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      FORMAT_REVISION: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ops-p6-001e-configured-staging-p6-02
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format bounded files
        run: |
          npx biome format --write \
            scripts/run-ops-p6-001e-configured-staging-identity-admin.ts \
            src/admin/access/identity.ts \
            src/admin/access/verification.ts \
            tests/admin-access-identity.test.ts \
            tests/admin-access-verification.test.ts
      - name: Commit bounded formatting
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/run-ops-p6-001e-configured-staging-identity-admin.ts \
            src/admin/access/identity.ts \
            src/admin/access/verification.ts \
            tests/admin-access-identity.test.ts \
            tests/admin-access-verification.test.ts
          if git diff --cached --quiet; then
            echo 'No bounded formatting required.'
            exit 0
          fi
          git commit -m 'OPS-P6-001E apply Biome formatting'
          git push origin HEAD:agent/ops-p6-001e-configured-staging-p6-02
