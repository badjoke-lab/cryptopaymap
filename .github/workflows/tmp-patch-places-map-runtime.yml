name: Temporary places map resilience patch

on:
  push:
    branches:
      - fix/places-map-runtime
    paths:
      - '.github/workflows/tmp-patch-places-map-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/places-map-runtime
      - name: Apply bounded map recovery and screenshot gate fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          map_path = Path('src/components/places/PlacesMap.tsx')
          text = map_path.read_text()

          replacements = [
              (
                  "const mapLoadTimeoutMs = 12_000;\n",
                  "const mapLoadTimeoutMs = 12_000;\nconst mapStyleRetryDelayMs = 900;\n",
              ),
              (
                  "    let loadTimeout: number | null = null;\n",
                  "    let loadTimeout: number | null = null;\n    let styleRetryTimer: number | null = null;\n    let styleRetryAttempted = false;\n",
              ),
              (
                  "    const clearLoadTimeout = () => {\n      if (loadTimeout !== null) window.clearTimeout(loadTimeout);\n      loadTimeout = null;\n    };\n",
                  "    const clearLoadTimeout = () => {\n      if (loadTimeout !== null) window.clearTimeout(loadTimeout);\n      loadTimeout = null;\n    };\n\n    const clearStyleRetry = () => {\n      if (styleRetryTimer !== null) window.clearTimeout(styleRetryTimer);\n      styleRetryTimer = null;\n    };\n",
              ),
              (
                  "          loaded = true;\n          clearLoadTimeout();\n          addPinImages(map);\n",
                  "          loaded = true;\n          clearLoadTimeout();\n          clearStyleRetry();\n          addPinImages(map);\n",
              ),
              (
                  "        map.on('error', () => {\n          if (!loaded && active) {\n            clearLoadTimeout();\n            setRuntimeState('error');\n          }\n        });\n",
                  "        map.on('error', () => {\n          if (loaded || !active || styleRetryAttempted || styleRetryTimer !== null) return;\n          styleRetryTimer = window.setTimeout(() => {\n            styleRetryTimer = null;\n            if (!active || loaded || !map || styleRetryAttempted) return;\n            styleRetryAttempted = true;\n            map.setStyle(styleUrl);\n          }, mapStyleRetryDelayMs);\n        });\n",
              ),
              (
                  "      active = false;\n      clearLoadTimeout();\n      observer?.disconnect();\n",
                  "      active = false;\n      clearLoadTimeout();\n      clearStyleRetry();\n      observer?.disconnect();\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'PlacesMap replacement expected once, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          map_path.write_text(text)

          screenshot_path = Path('scripts/capture-review-screenshots.mjs')
          screenshots = screenshot_path.read_text()
          old = """async function waitForPlacesMap(page) {\n  const loading = page.getByText('Loading map...', { exact: true });\n  await loading.waitFor({ state: 'hidden', timeout: 20_000 }).catch(() => {});\n  await page.waitForTimeout(1_500);\n}\n"""
          new = """async function waitForPlacesMap(page) {\n  const loading = page.getByText('Loading map…', { exact: true });\n  await loading.waitFor({ state: 'hidden', timeout: 20_000 });\n\n  const loadError = page.getByText('Map could not be loaded', { exact: true });\n  if (await loadError.isVisible().catch(() => false)) {\n    throw new Error('Places map entered the load-error state.');\n  }\n\n  const unsupported = page.getByText('Interactive map unavailable', { exact: true });\n  if (await unsupported.isVisible().catch(() => false)) {\n    throw new Error('Places map entered the unsupported state.');\n  }\n\n  await page.locator('.maplibregl-canvas').first().waitFor({ state: 'visible', timeout: 5_000 });\n  await page.waitForTimeout(1_500);\n}\n"""
          count = screenshots.count(old)
          if count != 1:
              raise SystemExit(f'screenshot replacement expected once, found {count}')
          screenshot_path.write_text(screenshots.replace(old, new, 1))
          PY

      - name: Commit runtime fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/places/PlacesMap.tsx scripts/capture-review-screenshots.mjs
          git commit -m 'fix: recover Places map from transient style errors'
          git push origin HEAD:fix/places-map-runtime
