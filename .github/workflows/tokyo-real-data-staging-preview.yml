name: Tokyo real-data staging preview

on:
  push:
    branches:
      - ops/tokyo-candidate-review-triage
    paths:
      - scripts/publish-tokyo-confirmed-canonical-staging.ts
      - scripts/materialize-public-data-from-staging-db.ts
      - .github/workflows/tokyo-real-data-staging-preview.yml

permissions:
  contents: read

concurrency:
  group: tokyo-real-data-staging-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PREVIEW_URL: https://real-data-review.cryptopaymap-staging.pages.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check staging publication authorization configuration
        env:
          PUBLISH_ACTORS: ${{ secrets.CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS }}
        run: |
          if [ -n "$PUBLISH_ACTORS" ]; then configured=true; else configured=false; fi
          printf '{"exportPublishConfigured":%s}\n' "$configured"

      - name: Publish exactly four reviewed canonical records in staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
          CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS: ${{ secrets.CPM_ADMIN_EXPORT_PUBLISH_ACTOR_IDS }}
        run: npx tsx scripts/publish-tokyo-confirmed-canonical-staging.ts

      - name: Remove synthetic staging review payload before build
        run: rm -rf public/staging-review

      - name: Materialize public data from staging database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/materialize-public-data-from-staging-db.ts

      - name: Verify source and build
        run: |
          npm run check
          npm run build

      - name: Deploy isolated real-data staging preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler pages deploy dist \
            --project-name cryptopaymap-staging \
            --branch real-data-review

      - name: Verify deployed real-data preview externally
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PREVIEW_URL;
          let places = null;
          for (let attempt = 0; attempt < 20; attempt += 1) {
            const response = await fetch(`${base}/data/places.json?verify=${Date.now()}-${attempt}`, { cache: 'no-store' }).catch(() => null);
            if (response?.status === 200) {
              const value = await response.json().catch(() => null);
              if (value && Array.isArray(value.records)) {
                places = value;
                break;
              }
            }
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          if (!places) throw new Error('Preview places export did not become reachable.');
          if (places.records.length !== 4) throw new Error(`Expected 4 real places; got ${places.records.length}.`);
          if (places.records.some((record) => /\bstaging\b/i.test(String(record?.name ?? '')))) {
            throw new Error('Synthetic staging fixture name found in real-data preview.');
          }
          const pinsResponse = await fetch(`${base}/data/place-pins.json?verify=${Date.now()}`, { cache: 'no-store' });
          const pins = await pinsResponse.json();
          if (!Array.isArray(pins.records) || pins.records.length !== 4) throw new Error('Expected 4 real map pins.');
          console.log(JSON.stringify({
            previewReachable: true,
            physicalPlaces: places.records.length,
            mapPins: pins.records.length,
            syntheticFixtureNames: 0,
            candidatePayloadExposed: false,
          }));
          NODE
