name: Europe-west official Evidence review batches 16-23

on:
  push:
    branches:
      - ops/europe-west-official-evidence-review-16-23
    paths:
      - scripts/review-europe-west-official-evidence-16-23.ts
      - .github/workflows/europe-west-official-evidence-review-16-23.yml

permissions:
  contents: read

env:
  CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Review official Evidence privately
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          review_file="${RUNNER_TEMP}/europe-west-official-evidence-review-16-23.json"
          npx tsx scripts/review-europe-west-official-evidence-16-23.ts > "$review_file"
          jq -e '.target == "fixed-review-staging" and .mutationPerformed == false and .publicDataChanged == false and .payloadExposedInLogs == false' "$review_file" >/dev/null
          {
            echo '## Europe-west private official Evidence review — batches 16-23'
            echo
            echo "- Evidence rows: $(jq -r '.evidenceRows' "$review_file")"
            echo "- structurally valid rows: $(jq -r '.structurallyValidRows' "$review_file")"
            echo "- live official payment matches: $(jq -r '.livePaymentMatches' "$review_file")"
            echo "- live Bitcoin mentions: $(jq -r '.liveBitcoinMentions' "$review_file")"
            echo "- live Lightning mentions: $(jq -r '.liveLightningMentions' "$review_file")"
            echo '- Candidate names/addresses/URLs/raw payload in public logs: 0'
            echo '- mutation performed: false'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: europe-west-official-evidence-review-16-23-private
          path: ${{ runner.temp }}/europe-west-official-evidence-review-16-23.json
          retention-days: 1
          if-no-files-found: error
