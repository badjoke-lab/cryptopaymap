name: One-shot Chipotle Flexa route progress audit

on:
  push:
    branches:
      - feat/physical-source-first-growth
    paths:
      - ops/run-chipotle-flexa-route-progress-audit.trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit Chipotle Flexa route progress
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: |
          set -o pipefail
          npx tsx scripts/audit-chipotle-flexa-route-progress-staging.ts 2>&1 | tee chipotle-flexa-route-progress.log
      - uses: actions/upload-artifact@v4
        with:
          name: chipotle-flexa-route-progress
          path: chipotle-flexa-route-progress.log
          if-no-files-found: error
          retention-days: 7
