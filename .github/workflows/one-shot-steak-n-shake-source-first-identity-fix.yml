name: One-shot Steak n Shake source-first identity fix

on:
  push:
    branches:
      - feat/steak-n-shake-btc-growth
    paths:
      - .github/workflows/one-shot-steak-n-shake-source-first-identity-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/steak-n-shake-btc-growth
          fetch-depth: 0
      - name: Apply composite official location identity
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'scripts/ingest-review-steak-n-shake-official-source-first-staging.ts';
          let text = await readFile(path, 'utf8');
          const replace = (from, to) => {
            if (!text.includes(from)) throw new Error(`Expected patch context missing:\n${from}`);
            text = text.replace(from, to);
          };
          replace(
            "  if (new Set(valid.map((row) => row.id)).size !== valid.length) {\n    throw new Error('Official directory contains duplicate location IDs.');\n  }",
            "  if (new Set(valid.map((row) => row.slug)).size !== valid.length) {\n    throw new Error('Official directory contains duplicate location slugs.');\n  }\n  if (new Set(valid.map((row) => `${row.id}|${row.slug}`)).size !== valid.length) {\n    throw new Error('Official directory contains duplicate composite location identities.');\n  }"
          );
          replace(
            "  const externalIds = directory.rows.map((row) => `steak-n-shake:${row.id}`);",
            "  const externalIds = directory.rows.map((row) => `steak-n-shake:${row.id}:${row.slug}`);"
          );
          replace(
            "    const officialLocationId = typeof seed.officialLocationId === 'string' ? seed.officialLocationId.trim() : '';\n    const name = typeof seed.name === 'string' ? seed.name.trim() : '';",
            "    const officialLocationId = typeof seed.officialLocationId === 'string' ? seed.officialLocationId.trim() : '';\n    const officialSlug = typeof seed.officialSlug === 'string' ? seed.officialSlug.trim() : '';\n    const name = typeof seed.name === 'string' ? seed.name.trim() : '';"
          );
          replace(
            "    if (!origin || !officialLocationId || !name || !address || !city || !state || !postalCode || !hours || latitude === null || longitude === null) {",
            "    if (!origin || !officialLocationId || !officialSlug || !name || !address || !city || !state || !postalCode || !hours || latitude === null || longitude === null) {"
          );
          replace(
            "              slug: `steak-n-shake-${officialLocationId}`.slice(0, 64),",
            "              slug: `steak-n-shake-${officialLocationId}-${(await sha256(officialSlug)).slice(0, 10)}`.slice(0, 64),"
          );
          await writeFile(path, text);
          NODE
          git diff --check
          git diff -- scripts/ingest-review-steak-n-shake-official-source-first-staging.ts
      - name: Commit and push identity fix
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/ingest-review-steak-n-shake-official-source-first-staging.ts
          git commit -m "FIX: key Steak n Shake official locations by composite identity"
          git push origin HEAD:feat/steak-n-shake-btc-growth
