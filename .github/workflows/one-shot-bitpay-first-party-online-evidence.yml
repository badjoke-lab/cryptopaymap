name: One-shot BitPay first-party online Evidence

on:
  push:
    branches:
      - feat/bulk-official-directory-evidence
    paths:
      - scripts/seed-bitpay-first-party-online-evidence-staging.ts
      - .github/workflows/one-shot-bitpay-first-party-online-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-shot-bitpay-first-party-online-evidence
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check repository before staging mutation
        run: npm run check

      - name: Verify merchant first-party pages and seed private Evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPM_CANDIDATE_ACQUISITION_TARGET: fixed-review-staging
        run: npx tsx scripts/seed-bitpay-first-party-online-evidence-staging.ts
