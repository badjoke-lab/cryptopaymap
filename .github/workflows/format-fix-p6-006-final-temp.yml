name: Format FIX-P6-006 final temporary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/format-fix-p6-006-final-temp.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FIX-P6-006 branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-p6-006-historical-releases

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format final checker
        run: npx biome format --write scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs

      - name: Commit formatting and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-fix-p6-006-final-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/format-fix-p6-006-final-temp.yml \
            scripts/check-ops-p6-001i-configured-staging-public-export-release.mjs
          git commit -m 'Format final FIX-P6-006 checker'
          git push origin HEAD:agent/fix-p6-006-historical-releases
